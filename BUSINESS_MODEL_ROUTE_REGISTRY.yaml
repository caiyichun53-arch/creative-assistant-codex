schema_version: business_model_route_registry.v1
goal: GOAL-RUNTIME-BUSINESS-ROUTE-CUTOVER-01
status: formal_registry
source_policy:
  allowed_sources:
    - AGENTS.md
    - BUILD_PLAN.md
    - GOAL-RUNTIME-BUSINESS-ROUTE-CUTOVER-01 objective
  excluded_sources:
    - scripts/llm/call.py
    - config/settings.yaml
    - config/settings.example.yaml
    - README files
  note: Node inventory is derived from formal docs and the active goal, not from old aliases or legacy scripts.
provider_policy_defaults:
  provider_name: hermes
  live_model_port: HermesModelProviderAdapter
  model_ref_env: HERMES_BUSINESS_MODEL_NAME
  model_class_env: HERMES_BUSINESS_MODEL_CLASS
  billing_mode: subscription
  tools_enabled: false
  memory_enabled: false
  feishu_messaging_enabled: false
  nested_job_orchestration_enabled: false
  file_or_terminal_side_effects_enabled: false
  approved_provider_required: true
  fallback_policy:
    dry_run_fallback: false
    fake_port_fallback: false
    cli_fallback: false
    on_failure: fail_closed
nodes:
  - node_id: topic_judgement
    logical_route: business.topic_judgement
    capability_tier: fast_reasoning
    source_evidence:
      - AGENTS.md: LLM allowed for 选题判断.
      - BUILD_PLAN.md: 每日选题流 later connects LLM judgement after examples grow.
    timeout_ms: 30000
    retry:
      max_attempts: 1
      retry_on: []
    token_context_budget:
      max_input_tokens: 2000
      max_output_tokens: 700
    allowed_provider_policy:
      inherit: provider_policy_defaults
    fallback_policy:
      inherit: provider_policy_defaults.fallback_policy
    input_schema:
      type: object
      required: [fixture_id, candidate_topic, evidence_refs]
      properties:
        fixture_id: string
        candidate_topic: string
        evidence_refs: array
      additional_properties: false
    output_schema:
      type: object
      required: [decision, rationale, schema_version]
      properties:
        decision: string
        rationale: string
        schema_version: string
      additional_properties: false

  - node_id: content_relation_judgement
    logical_route: business.content_relation_judgement
    capability_tier: fast_reasoning
    source_evidence:
      - GOAL-BUSINESS-SKILL-CONTENT-RELATION-JUDGE-01 semantic ruling: content_relation_judge v1 formal relation taxonomy and directionality.
      - AGENTS.md: LLM allowed only in generated judgement nodes inside fixed routes.
    timeout_ms: 30000
    retry:
      max_attempts: 1
      retry_on: []
    token_context_budget:
      max_input_tokens: 2400
      max_output_tokens: 900
    allowed_provider_policy:
      inherit: provider_policy_defaults
    fallback_policy:
      inherit: provider_policy_defaults.fallback_policy
    input_schema:
      type: object
      required: [fixture_id, left_content, right_content, left_evidence_refs, right_evidence_refs, relation_types]
      properties:
        fixture_id: string
        left_content: string
        right_content: string
        left_evidence_refs: array
        right_evidence_refs: array
        relation_types: array
      additional_properties: false
    output_schema:
      type: object
      required: [relation_type, relation_direction, confidence, evidence_from_left, evidence_from_right, schema_version]
      properties:
        relation_type: string
        relation_direction: string
        confidence: string
        evidence_from_left: array
        evidence_from_right: array
        schema_version: string
      additional_properties: false

  - node_id: source_to_topic
    logical_route: business.source_to_topic
    capability_tier: creative_generation
    source_evidence:
      - GOAL-V0.6.2-PRODUCTION-COMPLETION-01 Phase 2: source evidence to candidate topic is a remaining formal Skill.
      - AGENTS.md: LLM allowed for topic judgement/generation inside fixed routes only.
      - FORMAL_SKILL_ROUTE_MAPPING.yaml: source_to_topic must not reuse business.topic_judgement silently.
    timeout_ms: 60000
    retry:
      max_attempts: 1
      retry_on: []
    token_context_budget:
      max_input_tokens: 5000
      max_output_tokens: 1200
    allowed_provider_policy:
      inherit: provider_policy_defaults
    fallback_policy:
      inherit: provider_policy_defaults.fallback_policy
    input_schema:
