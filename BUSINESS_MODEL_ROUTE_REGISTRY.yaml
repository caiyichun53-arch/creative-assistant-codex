schema_version: business_model_route_registry.v1
goal: GOAL-RUNTIME-BUSINESS-ROUTE-CUTOVER-01
status: formal_registry
source_policy:
  allowed_sources:
    - AGENTS.md
    - BUILD_PLAN.md
    - GOAL-RUNTIME-BUSINESS-ROUTE-CUTOVER-01 objective
  excluded_sources:
    - scripts/llm/call.py
    - config/settings.yaml
    - config/settings.example.yaml
    - README files
  note: Node inventory is derived from formal docs and the active goal, not from old aliases or legacy scripts.
provider_policy_defaults:
  provider_name: hermes
  live_model_port: HermesModelProviderAdapter
  model_ref_env: MODEL_PROVIDER_MODEL
  tools_enabled: false
  memory_enabled: false
  feishu_messaging_enabled: false
  nested_job_orchestration_enabled: false
  file_or_terminal_side_effects_enabled: false
  approved_provider_required: true
  fallback_policy:
    dry_run_fallback: false
    fake_port_fallback: false
    cli_fallback: false
    on_failure: fail_closed
nodes:
  - node_id: topic_judgement
    logical_route: business.topic_judgement
    capability_tier: fast_reasoning
    source_evidence:
      - AGENTS.md: LLM allowed for 选题判断.
      - BUILD_PLAN.md: 每日选题流 later connects LLM judgement after examples grow.
    timeout_ms: 30000
    retry:
      max_attempts: 1
      retry_on: []
    token_context_budget:
      max_input_tokens: 2000
      max_output_tokens: 700
    allowed_provider_policy:
      inherit: provider_policy_defaults
    fallback_policy:
      inherit: provider_policy_defaults.fallback_policy
    input_schema:
      type: object
      required: [fixture_id, candidate_topic, evidence_refs]
      properties:
        fixture_id: string
        candidate_topic: string
        evidence_refs: array
      additional_properties: false
    output_schema:
      type: object
      required: [decision, rationale, schema_version]
      properties:
        decision: string
        rationale: string
        schema_version: string
      additional_properties: false

  - node_id: research_synthesis
    logical_route: business.research_synthesis
    capability_tier: deep_reasoning
    source_evidence:
      - AGENTS.md: LLM allowed for 研究综合.
      - BUILD_PLAN.md: 选中一个选题后进行研究并组装材料包.
    timeout_ms: 60000
    retry:
      max_attempts: 1
      retry_on: []
    token_context_budget:
      max_input_tokens: 9000
      max_output_tokens: 1800
    allowed_provider_policy:
      inherit: provider_policy_defaults
    fallback_policy:
      inherit: provider_policy_defaults.fallback_policy
    input_schema:
      type: object
      required: [fixture_id, research_question, evidence_refs]
      properties:
        fixture_id: string
        research_question: string
        evidence_refs: array
      additional_properties: false
    output_schema:
      type: object
      required: [summary, claims, schema_version]
      properties:
        summary: string
        claims: array
        schema_version: string
      additional_properties: false

