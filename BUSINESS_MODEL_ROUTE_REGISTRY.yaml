      required: [fixture_id, source_content, source_evidence_refs, domain_label, relation_summary]
      properties:
        fixture_id: string
        source_content: string
        source_evidence_refs: array
        domain_label: string
        relation_summary: string
      additional_properties: false
    output_schema:
      type: object
      required: [topic_status, candidate_topic, topic_angle, supporting_evidence, source_constraints, no_result_reason, confidence, schema_version]
      properties:
        topic_status: string
        candidate_topic: string
        topic_angle: string
        supporting_evidence: array
        source_constraints: array
        no_result_reason: string
        confidence: string
        schema_version: string
      additional_properties: false

