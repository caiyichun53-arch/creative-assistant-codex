schema_version: business_model_route_registry.v1
governance_basis: docs/EFFECTIVE_DESIGN_BASELINE.md
status: formal_registry
source_policy:
  design_authority:
    - docs/EFFECTIVE_DESIGN_BASELINE.md
  runtime_configuration:
    - config/model_routes.yaml
  excluded_sources:
    - scripts/llm/call.py
    - config/settings.yaml
    - config/settings.example.yaml
    - README files
  note: Node inventory is checked against the effective design baseline and current routing configuration, never against historical plans or goals.
model_routing:
  config_path: config/model_routes.yaml
  workflow_nodes_bind_route_id_only: true
  provider_resolution_layer: model_routes
runtime_policy_defaults:
  tools_enabled: false
  memory_enabled: false
  feishu_messaging_enabled: false
  nested_job_orchestration_enabled: false
  file_or_terminal_side_effects_enabled: false
  approved_provider_required: true
  fallback_policy:
    dry_run_fallback: false
    fake_port_fallback: false
    cli_fallback: false
    on_failure: fail_closed
nodes:
  - node_id: topic_judgement
    logical_route: business.topic_judgement
    route_id: business_analysis
    task_type: topic_screening
    capability_tier: fast_reasoning
    source_evidence:
      - docs/EFFECTIVE_DESIGN_BASELINE.md: current design boundary.
      - docs/EFFECTIVE_DESIGN_BASELINE.md: current design boundary.
    timeout_ms: 30000
    retry:
      max_attempts: 1
      retry_on: []
    allowed_provider_policy:
      inherit: runtime_policy_defaults
    fallback_policy:
      inherit: runtime_policy_defaults.fallback_policy
    input_schema:
      type: object
      required: [fixture_id, candidate_topic, evidence_refs]
      properties:
        fixture_id: string
        candidate_topic: string
        evidence_refs: array
      additional_properties: false
    output_schema:
      type: object
      required: [decision, rationale, schema_version]
      properties:
        decision: string
        rationale: string
        schema_version: string
      additional_properties: false

  - node_id: content_relation_judgement
