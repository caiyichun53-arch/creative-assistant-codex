schema_version: competitor_breakdown.business_contract.v1
status: active_formal_business_contract
skill_id: competitor_breakdown
governance_basis: docs/EFFECTIVE_DESIGN_BASELINE.md
responsibility: >-
  Analyze one already collected, transcribed and qualified competitor work into
  one source-numbered spoken-content breakdown record for later retrieval.
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - transcript
    - source_references
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - chat_memory
  - prior_performance_conclusion
  - cross_video_summary
non_responsibilities:
  - collection
  - transcription
  - account_baseline_calculation
  - high_signal_selection
  - cross_video_summarization
  - effectiveness_claim
  - formal_data_write
  - business_state_transition
  - human_confirmation
  - other_skill_invocation
evidence_requirements:
  every_claim_requires_exact_transcript_evidence: true
  source_numbers_are_retained: true
  performance_causality_claims_forbidden: true
  comments_describe_reactions_not_effectiveness: true
deep_reading_requirements:
  content_type_is_retrieval_only_not_a_fixed_structure: true
  central_reading_may_be_question_conflict_choice_comparison_or_other_supported_understanding: true
  relevant_deep_lenses_are_selected_dynamically_not_as_a_mandatory_checklist: true
  every_central_or_selected_lens_reading_requires_transcript_evidence: true
  source_order_must_show_real_understanding_progress_or_be_marked_as_recurring_pattern: true
  unsupported_deep_interpretation_is_forbidden: true
output_policy:
  one_completed_record_per_supplied_work: true
  no_cross_work_generalization: true
  no_formal_experience_publication: true
  user_confirmation_required_before_any_experience_use: true
failure_policy:
  no_formal_result_on_invalid_or_empty_output: true
  automatic_retry: false
runtime_boundary:
  reads_files_at_runtime: false
  writes_files_at_runtime: false
  accesses_external_url: false
  calls_other_skills: false
  changes_business_state: false
  writes_formal_data: false
completion_definition:
  - output is structurally valid
  - every retained claim points to supplied transcript evidence
  - the record states the central understanding and only the supported deep readings
  - the core, not the skill, performs any later formal write
