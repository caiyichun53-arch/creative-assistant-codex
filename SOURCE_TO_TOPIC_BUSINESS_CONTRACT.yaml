schema_version: source_to_topic.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: source_to_topic
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Transform already supplied source evidence into one candidate topic for the formal production workflow.
non_responsibilities:
  - content_classify
  - content_relation_judge
  - viral_or_hit_judgement
  - account_baseline_calculation
  - deep_sample_analysis
  - tactic_extract
  - research_fetching
  - research_evidence_extract
  - content_plan
  - script_generate
  - script_review
  - status_transition
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - source_id
    - source_content
    - source_evidence_items
    - domain_label
    - relation_summary
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - business_status_code
  - file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - legacy_data_reference
  - cold_backup_reference
topic_status_values:
  - generated
  - needs_review
  - no_result
topic_generation_policy:
  one_topic_per_run: true
  must_stay_inside_supplied_evidence: true
  must_not_fetch_or_infer_missing_context: true
  must_not_classify_domain: true
  must_not_judge_content_relation: true
  must_not_write_experience_memory: true
  no_result_when_source_missing_or_unusable: true
  needs_review_when_domain_or_relation_boundary_unclear: true
evidence_requirements:
  source_evidence_items_min: 1
  source_evidence_items_max: 8
  output_supporting_evidence_must_reference_input: true
  rationale_or_angle_must_not_add_unseen_facts: true
confidence_policy:
  allowed_values:
    - high
    - medium
    - low
    - none
  no_numeric_thresholds: true
  high: Source evidence is concrete, domain label is stable, and relation summary gives a clear production boundary.
  medium: Source evidence is concrete but topic framing still has minor boundary risk.
  low: Candidate can be proposed only with human review.
  none: Required for no_result.
domain_scope:
  accepted_domain_labels:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - cross_domain
    - unknown
  current_named_domains:
    - fan_kepu_social_life
    - music_entertainment
  third_domain_behavior: Allowed only as an extensibility fixture, not as a quality claim for that domain.
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  source_id_max: 80
  source_content_max: 1600
  evidence_item_max: 240
  evidence_items_max: 8
  relation_summary_max: 600
context_budget:
  max_input_tokens: 5000
token_budget:
  max_output_tokens: 1200
timeout:
  milliseconds: 60000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: source_to_topic:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - needs_review_unknown_domain
    - insufficient_source_evidence
    - model_empty_result
    - non_json_output
    - missing_output_field
    - evidence_not_in_input
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.source_to_topic
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.source_to_topic
  binding_name: source_to_topic_public_input_to_topic_generation
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    source_content:
      source: preprocessed
      key: source_text
    source_evidence_refs:
      source: input
      key: source_evidence_items
    domain_label:
      source: input
      key: domain_label
    relation_summary:
      source: preprocessed
      key: relation_text
  model_input_schema:
    type: object
    required:
      - fixture_id
      - source_content
      - source_evidence_refs
      - domain_label
      - relation_summary
    properties:
      fixture_id: string
      source_content: string
      source_evidence_refs: array
      domain_label: string
      relation_summary: string
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys topic_status, candidate_topic, topic_angle,
    supporting_evidence, source_constraints, no_result_reason, confidence,
    schema_version. Transform the supplied source evidence into one candidate
    topic. Do not classify the domain, judge relations, fetch more context,
    research facts, write scripts, or call other Skills. supporting_evidence
    must contain only items from source_evidence_refs. Use schema_version
    source_to_topic.output.v1. source_content={source_content};
    source_evidence_refs={source_evidence_refs}; domain_label={domain_label};
    relation_summary={relation_summary}
  model_output_schema:
    type: object
    required:
      - topic_status
      - candidate_topic
      - topic_angle
      - supporting_evidence
      - source_constraints
      - no_result_reason
      - confidence
      - schema_version
    properties:
      topic_status:
        type: string
        enum:
          - generated
          - needs_review
          - no_result
      candidate_topic:
        type: string
        maxLength: 120
      topic_angle:
        type: string
        maxLength: 240
      supporting_evidence:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      source_constraints:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      no_result_reason:
        type: string
        enum:
          - none
          - empty_source
          - insufficient_source_evidence
          - unsupported_source
      confidence:
        type: string
        enum:
          - high
          - medium
          - low
          - none
      schema_version:
        type: string
        const: source_to_topic.output.v1
    additional_properties: false
  output_map:
    topic_status:
      source: model_output
      key: topic_status
    candidate_topic:
      source: model_output
      key: candidate_topic
    topic_angle:
      source: model_output
      key: topic_angle
    supporting_evidence:
      source: model_output
      key: supporting_evidence
    source_constraints:
      source: model_output
      key: source_constraints
    no_result_reason:
      source: model_output
      key: no_result_reason
    confidence:
      source: model_output
      key: confidence
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - source_id
    - source_content
    - source_evidence_items
    - domain_label
    - relation_summary
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    source_id:
      type: string
      minLength: 1
      maxLength: 80
    source_content:
      type: string
      maxLength: 1600
    source_evidence_items:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    relation_summary:
      type: string
      maxLength: 600
    schema_version:
      type: string
      const: source_to_topic.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - topic_status
    - candidate_topic
    - topic_angle
    - supporting_evidence
    - source_constraints
    - no_result_reason
    - confidence
    - schema_version
  properties:
    topic_status:
      type: string
      enum:
        - generated
        - needs_review
        - no_result
    candidate_topic:
      type: string
      maxLength: 120
    topic_angle:
      type: string
      maxLength: 240
    supporting_evidence:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    source_constraints:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    no_result_reason:
      type: string
      enum:
        - none
        - empty_source
        - insufficient_source_evidence
        - unsupported_source
    confidence:
      type: string
      enum:
        - high
        - medium
        - low
        - none
    schema_version:
      type: string
      const: source_to_topic.output.v1
  additional_properties: false
