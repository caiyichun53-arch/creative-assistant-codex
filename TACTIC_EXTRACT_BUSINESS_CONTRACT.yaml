schema_version: tactic_extract.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: tactic_extract
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Reduce multiple prepared sample analyses into reusable tactic candidates.
non_responsibilities:
  - sample_deep_analyze
  - source_to_topic
  - experience_revision_propose
  - experience_writeback
  - example_publication
  - ASR_transcription
  - comment_collection
  - research_fetching
  - script_generation
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - analysis_batch_id
    - dna_note_refs
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - raw_dna_note_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
reduction_policy:
  requires_multiple_sample_analysis_refs: true
  output_is_candidate_only: true
  must_not_publish_or_write_back_experience: true
  must_not_fetch_or_read_source_files: true
  must_not_call_sample_deep_analyze: true
  must_preserve_domain_boundary: true
evidence_requirements:
  dna_note_refs_min: 2
  dna_note_refs_max: 12
  output_arrays_min: 1
  output_arrays_max: 12
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  analysis_batch_id_max: 80
  dna_note_ref_max: 160
context_budget:
  max_input_tokens: 14000
token_budget:
  max_output_tokens: 2800
timeout:
  milliseconds: 90000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: tactic_extract:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - illegal_writeback
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.reverse_pattern_reduce
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.reverse_pattern_reduce
  binding_name: tactic_extract_public_input_to_reverse_pattern_reduce
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    dna_note_refs:
      source: input
      key: dna_note_refs
  model_input_schema:
    type: object
    required:
      - fixture_id
      - dna_note_refs
    properties:
      fixture_id: string
      dna_note_refs: array
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys common_patterns, example_candidates,
    schema_version. Reduce the supplied sample analysis references into
    candidate tactics only. Do not publish examples, write to experience memory,
    fetch files, read DNA notes by path, or call other Skills. Use schema_version
    tactic_extract.output.v1. dna_note_refs={dna_note_refs}
  model_output_schema:
    type: object
    required:
      - common_patterns
      - example_candidates
      - schema_version
    properties:
      common_patterns:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: string
          minLength: 1
          maxLength: 240
      example_candidates:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: string
          minLength: 1
          maxLength: 240
      schema_version:
        type: string
        const: tactic_extract.output.v1
    additional_properties: false
  output_map:
    common_patterns:
      source: model_output
      key: common_patterns
    example_candidates:
      source: model_output
      key: example_candidates
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - analysis_batch_id
    - dna_note_refs
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    analysis_batch_id:
      type: string
      minLength: 1
      maxLength: 80
    dna_note_refs:
      type: array
      minItems: 2
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 160
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: tactic_extract.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - common_patterns
    - example_candidates
    - schema_version
  properties:
    common_patterns:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 240
    example_candidates:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: tactic_extract.output.v1
  additional_properties: false
