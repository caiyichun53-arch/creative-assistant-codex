schema_version: tactic_extract.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: tactic_extract
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Reduce multiple prepared sample analyses into reusable tactic candidates.
non_responsibilities:
  - sample_deep_analyze
  - source_to_topic
  - experience_revision_propose
  - experience_writeback
  - example_publication
  - ASR_transcription
  - comment_collection
  - research_fetching
  - script_generation
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - analysis_batch_id
    - dna_note_refs
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - raw_dna_note_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
reduction_policy:
  requires_multiple_sample_analysis_refs: true
  output_is_candidate_only: true
  must_not_publish_or_write_back_experience: true
  must_not_fetch_or_read_source_files: true
  must_not_call_sample_deep_analyze: true
  must_preserve_domain_boundary: true
# 2026-07-11: dna_note_refs_max raised 12->20 by explicit user decision, so a
# single real batch of 20 sample_deep_analyze results (see
# production_activation_deviation_top20 in HANDOFF_STATE.md) can be reduced in
# one tactic_extract call instead of being arbitrarily split.
# 2026-07-13 用户明确拍板:这份契约曾经声明的 dna_note_ref_max(单条note的字符
# 上限,历史上从160一路加宽到2500)、context_budget.max_input_tokens 这些字符/
# token 上限已经彻底取消——run_tactic_extract.py 的 _note_for_evidence_row()
# 不再截断,真实内容一律原样完整发给模型。历史教训留痕:这条上限曾经真的
# 切掉过真实内容(90字/字段的早期实现,在22条真实分析里有2条被切掉后半段,
# structure_pattern 这种长字段最容易受伤),这正是这次彻底取消上限的理由,不是
# 平白无故删掉一道护栏。风险(真实调用可能因为内容过长报错、或成本变高)由
# 用户明确接受。
# 2026-07-11: output_arrays_max raised 12->200 (effectively uncapped for a
# diagnostic run). The prior 12 had zero BUSINESS_RULE_CATALOG.yaml backing
# -- BR-DNA-004 (the catalog entry for this exact step) records a real
# threshold, max_per_play: 3, but it was never connected to this schema
# field, and its own provenance is itself unverified (no amendment/
# real-data-check trail the way e.g. BR-HIT-001's thresholds have). A real
# batch of 20 sample_deep_analyze notes produced more than 12 real
# common_patterns, which the old cap rejected outright -- silently losing
# two real paid model calls' output with no record of what was actually
# returned. 200 is provisional, to let a real call complete so the actual
# count can be observed; the real permanent cap is a pending user decision,
# not settled by this change.
evidence_requirements:
  dna_note_refs_min: 2
  dna_note_refs_max: 20
  output_arrays_min: 1
  output_arrays_max: 200
timeout:
  milliseconds: 90000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: tactic_extract:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - illegal_writeback
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.reverse_pattern_reduce
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.reverse_pattern_reduce
  route_id: business_analysis
  binding_name: tactic_extract_public_input_to_reverse_pattern_reduce
  binding_version: 1.0.0
  # 2026-07-11: domain_label is required by the public input_schema but was
  # dropped before reaching the model. Added.
  input_map:
    fixture_id:
      source: input
      key: request_id
    dna_note_refs:
      source: input
      key: dna_note_refs
    domain_label:
      source: input
      key: domain_label
  model_input_schema:
    type: object
    required:
      - fixture_id
      - dna_note_refs
      - domain_label
    properties:
      fixture_id: string
      dna_note_refs: array
      domain_label: string
    additional_properties: false
  # 2026-07-11: rewritten after a real call against 20 real notes (see
  # HANDOFF_STATE.md) with the old bare prompt returned 60 common_patterns
  # that were mostly just individual phrases lifted from single notes (not
  # genuine cross-note commonality) and 0 example_candidates -- the old
  # prompt never explained what "common" means (recurring across multiple
  # notes, not "any phrase observed"), never explained what
  # example_candidates should contain, and gave no count guidance at all.
  prompt_template: >-
    You are reducing a batch of individual video pattern analyses into a
    small set of genuinely reusable patterns (归纳共性) for a Chinese
    short-video content team. Return only JSON with keys common_patterns,
    example_candidates, schema_version
    (schema_version=tactic_extract.output.v1).

    Each note below is one real video's 选题(topic)/钩子(hook)/结构(structure)
    pattern, for domain_label={domain_label}: dna_note_refs={dna_note_refs}

    common_patterns: only include a pattern here if it genuinely recurs
    across at least two different notes (even if worded differently there) --
    do not list every distinct phrase you see once. Consolidate
    near-duplicate observations into one pattern instead of listing each
    wording separately. Write each pattern in Simplified Chinese as a short,
    genuinely reusable technique description, not a copy of one note's exact
    wording. Aim for a small set a content team could actually remember and
    apply -- quality and genuine cross-note recurrence over exhaustive
    coverage of everything mentioned.

    example_candidates: for each common pattern you identify, write ONE
    PLAIN STRING (not a JSON object -- a single sentence of text) that names
    the pattern, cites the specific note(s) by id prefix that best exemplify
    it, and briefly says what makes it a good example, all in that one
    sentence. This field must not be empty when common_patterns is
    non-empty.

    Do not publish examples, write to experience memory, fetch files, read
    DNA notes by path, or call other Skills.

    Before answering, double check your JSON includes all three keys --
    common_patterns, example_candidates, and schema_version set exactly to
    tactic_extract.output.v1. Do not omit schema_version.
  model_output_schema:
    type: object
    required:
      - common_patterns
      - example_candidates
      - schema_version
    properties:
      common_patterns:
        type: array
        minItems: 1
        maxItems: 200
        items:
          type: string
          minLength: 1
      example_candidates:
        type: array
        minItems: 1
        maxItems: 200
        items:
          type: string
          minLength: 1
      schema_version:
        type: string
        const: tactic_extract.output.v1
    additional_properties: false
  output_map:
    common_patterns:
      source: model_output
      key: common_patterns
    example_candidates:
      source: model_output
      key: example_candidates
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - analysis_batch_id
    - dna_note_refs
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
    correlation_id:
      type: string
      minLength: 1
    analysis_batch_id:
      type: string
      minLength: 1
    dna_note_refs:
      type: array
      minItems: 2
      maxItems: 20
      items:
        type: string
        minLength: 1
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: tactic_extract.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - common_patterns
    - example_candidates
    - schema_version
  properties:
    common_patterns:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: string
        minLength: 1
    example_candidates:
      type: array
      minItems: 1
      maxItems: 200
      items:
        type: string
        minLength: 1
    schema_version:
      type: string
      const: tactic_extract.output.v1
  additional_properties: false
