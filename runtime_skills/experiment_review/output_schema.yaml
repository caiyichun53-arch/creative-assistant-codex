type: object
required:
  - review_status
  - supported_experience_refs
  - refuted_experience_refs
  - inconclusive_experience_refs
  - key_findings
  - evidence_used
  - next_actions
  - schema_version
properties:
  review_status:
    type: string
    enum:
      - supports_hypothesis
      - refutes_hypothesis
      - inconclusive
      - needs_more_data
  supported_experience_refs:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  refuted_experience_refs:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  inconclusive_experience_refs:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  key_findings:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 240
  evidence_used:
    type: array
    minItems: 0
    maxItems: 12
    items:
      type: string
  next_actions:
    type: array
    minItems: 0
    maxItems: 6
    items:
      type: string
      minLength: 1
      maxLength: 240
  schema_version:
    type: string
    const: experiment_review.output.v1
additional_properties: false
