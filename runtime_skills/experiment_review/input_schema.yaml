type: object
required:
  - request_id
  - correlation_id
  - experiment_id
  - experiment_design
  - execution_summary
  - result_metrics
  - evidence_items
  - tested_experience_refs
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 80
  correlation_id:
    type: string
    minLength: 1
    maxLength: 80
  experiment_id:
    type: string
    minLength: 1
    maxLength: 80
  experiment_design:
    type: string
    minLength: 1
    maxLength: 1800
  execution_summary:
    type: string
    minLength: 1
    maxLength: 1800
  result_metrics:
    type: object
  evidence_items:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
  tested_experience_refs:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 160
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: experiment_review.input.v1
additional_properties: false
