type: object
required:
  - request_id
  - correlation_id
  - sample_id
  - candidate_topic
  - transcript_excerpt
  - metrics
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 80
  correlation_id:
    type: string
    minLength: 1
    maxLength: 80
  sample_id:
    type: string
    minLength: 1
    maxLength: 80
  candidate_topic:
    type: string
    minLength: 1
    maxLength: 120
  transcript_excerpt:
    type: string
    minLength: 1
    maxLength: 2200
  metrics:
    type: object
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: sample_deep_analyze.input.v1
additional_properties: false
