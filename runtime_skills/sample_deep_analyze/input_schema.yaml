type: object
required:
  - request_id
  - correlation_id
  - sample_id
  - candidate_topic
  - transcript_excerpt
  - metrics
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
  correlation_id:
    type: string
    minLength: 1
  sample_id:
    type: string
    minLength: 1
  candidate_topic:
    type: string
    minLength: 1
  transcript_excerpt:
    type: string
    minLength: 1
    # 2026-07-09: raised from 2200. That number was truncating ~24% of real
    # transcripts mid-content (confirmed on real production data -- a 4409-char
    # transcript got cut to its first half, and the model's structure_pattern
    # output visibly fabricated an ending it never saw). 7000 is derived from
    # this contract's own context_budget.max_input_tokens=12000: reserve ~1500
    # tokens for the prompt template + metrics + JSON overhead, leaving ~10500
    # tokens for the transcript, at a conservative 1.5 chars/token for Chinese
    # text -> ~7000 chars. Covers the real observed max (4528 chars) with
    # margin, without being an arbitrary round number disconnected from the
    # actual token budget it has to fit inside.
  metrics:
    type: object
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: sample_deep_analyze.input.v1
additional_properties: false
