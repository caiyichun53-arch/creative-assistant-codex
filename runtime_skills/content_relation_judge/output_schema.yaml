type: object
required:
  - relation_type
  - relation_direction
  - confidence
  - evidence_from_left
  - evidence_from_right
  - compared_dimensions
  - missing_evidence
  - rationale
  - schema_version
properties:
  relation_type:
    type: string
    enum:
      - same_item
      - equivalent
      - contains
      - contained_by
      - complementary
      - contradicts
      - related_distinct
      - no_relation
      - insufficient_evidence
  relation_direction:
    type: string
    enum:
      - symmetric
      - left_contains_right
      - left_contained_by_right
      - not_applicable
  confidence:
    type: string
    enum:
      - high
      - medium
      - low
  evidence_from_left:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  evidence_from_right:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  compared_dimensions:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  missing_evidence:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  rationale:
    type: string
    minLength: 1
  schema_version:
    type: string
    const: content_relation_judge.output.v1
additional_properties: false
