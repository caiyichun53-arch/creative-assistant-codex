schema_version: formal_skill_binding.v1
binding_name: content_relation_judge_public_input_to_relation_judgement
binding_version: 1.0.0
route_name: business.content_relation_judgement
input_map:
  fixture_id:
    source: input
    key: request_id
  left_content:
    source: preprocessed
    key: left_text
  right_content:
    source: preprocessed
    key: right_text
  left_evidence_refs:
    source: input
    key: left_evidence_items
  right_evidence_refs:
    source: input
    key: right_evidence_items
  relation_types:
    source: literal
    value:
      - same_item
      - equivalent
      - contains
      - contained_by
      - complementary
      - contradicts
      - related_distinct
      - no_relation
      - insufficient_evidence
output_map:
  relation_type:
    source: model_output
    key: relation_type
  relation_direction:
    source: model_output
    key: relation_direction
  confidence:
    source: model_output
    key: confidence
  evidence_from_left:
    source: model_output
    key: evidence_from_left
  evidence_from_right:
    source: model_output
    key: evidence_from_right
  compared_dimensions:
    source: model_output
    key: compared_dimensions
  missing_evidence:
    source: model_output
    key: missing_evidence
  rationale:
    source: model_output
    key: rationale
  schema_version:
    source: model_output
    key: schema_version
