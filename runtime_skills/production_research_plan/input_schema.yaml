type: object
required:
  - request_id
  - correlation_id
  - candidate_topic
  - evidence_items
  - tactic_candidates
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
  correlation_id:
    type: string
    minLength: 1
  candidate_topic:
    type: string
    minLength: 1
  evidence_items:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
  tactic_candidates:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: string
      minLength: 1
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: production_research_plan.input.v1
additional_properties: false
