schema_version: formal_skill_binding.v1
binding_name: candidate_pool_to_priority
binding_version: 1.1.0
model_response_format:
  type: json_object
model_input_schema:
  type: object
  required:
  - run_id
  - domain_label
  - discovery_date
  - candidates
  - input_fingerprint
  - domain_rules
  properties:
    run_id:
      type: string
    domain_label:
      type: string
    discovery_date:
      type: string
    candidates:
      type: array
      items:
        type: object
    input_fingerprint:
      type: string
    domain_rules:
      type: object
  additional_properties: false
model_output_schema:
  type: object
  required:
  - schema_version
  - input_fingerprint
  - assessments
  properties:
    schema_version:
      type: string
      enum:
      - candidate_priority.output.v1
    input_fingerprint:
      type: string
    assessments:
      type: array
      items:
        type: object
        required:
        - candidate_version_id
        - score
        - reason
        - evidence_refs
        - limitations
        properties:
          candidate_version_id:
            type: string
          score:
            type: integer
          reason:
            type: string
          evidence_refs:
            type: array
            items:
              type: string
          limitations:
            type: string
        additional_properties: false
  additional_properties: false
input_map:
  run_id:
    source: input
    key: run_id
  domain_label:
    source: input
    key: domain_label
  discovery_date:
    source: input
    key: discovery_date
  candidates:
    source: input
    key: candidates
  input_fingerprint:
    source: input
    key: input_fingerprint
  domain_rules:
    source: input
    key: domain_rules
output_map:
  schema_version:
    source: model_output
    key: schema_version
  input_fingerprint:
    source: model_output
    key: input_fingerprint
  assessments:
    source: model_output
    key: assessments
