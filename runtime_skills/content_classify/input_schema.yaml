schema_version: content_classify.input_schema.v1
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - content_id
    - title
    - body
    - evidence_items
    - language_hint
    - domain_hint
  properties:
    request_id: {type: string, minLength: 1, maxLength: 80}
    correlation_id: {type: string, minLength: 1, maxLength: 80}
    content_id: {type: string, minLength: 1, maxLength: 80}
    title: {type: string, maxLength: 120}
    body: {type: string, maxLength: 1200}
    evidence_items:
      type: array
      minItems: 1
      maxItems: 8
      items: {type: string, minLength: 1, maxLength: 240}
    language_hint:
      type: string
      enum: [zh, mixed, non_zh, unknown]
    domain_hint:
      type: string
      enum: [fan_kepu_social_life, music_entertainment, third_domain_neutral, unknown]
  additional_properties: false
