schema_version: content_classify.fixtures.v1
fixtures:
  - fixture_id: fan_kepu_single
    input:
      request_id: fan-kepu-single
      correlation_id: fixture-correlation-fan
      content_id: fixture-fan-001
      title: 社区电梯为什么总在早高峰拥堵
      body: 用通勤时间、楼层分布和维护周期解释一个常见生活现象。
      evidence_items:
        - 社区电梯早高峰拥堵
        - 通勤时间和楼层分布是解释依据
      language_hint: zh
      domain_hint: fan_kepu_social_life
    expected:
      classification_status: classified
      primary_label: fan_kepu_social_life

