schema_version: content_classify.output_schema.v1
output_schema:
  type: object
  required:
    - classification_status
    - primary_label
    - candidate_labels
    - no_result_reason
    - uncertainty_reason
    - confidence
    - rationale
    - evidence_used
    - schema_version
  properties:
    classification_status:
      type: string
      enum: [classified, multiple_candidates, uncertain, no_result]
    primary_label:
      type: string
      enum: [fan_kepu_social_life, music_entertainment, third_domain_neutral, cross_domain, not_classifiable, none]
    candidate_labels:
      type: array
      minItems: 0
      maxItems: 5
      items:
        type: string
        enum: [fan_kepu_social_life, music_entertainment, third_domain_neutral, cross_domain, not_classifiable]
    no_result_reason:
      type: string
      enum: [none, empty_text, insufficient_information, non_content, unsupported_language, model_empty_result]
    uncertainty_reason:
      type: string
      enum: [none, multiple_supported_domains, title_body_conflict, noisy_input, weak_evidence, mixed_language_boundary]
    confidence:
      type: string
      enum: [high, medium, low, none]
    rationale: {type: string, minLength: 1}
    evidence_used:
      type: array
      minItems: 0
      maxItems: 8
      items: {type: string}
    schema_version: {type: string, const: content_classify.output.v1}
  additional_properties: false
