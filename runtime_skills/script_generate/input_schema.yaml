type: object
required:
  - request_id
  - correlation_id
  - brief
  - selected_hook
  - beats
  - research_summary
  - evidence_items
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 80
  correlation_id:
    type: string
    minLength: 1
    maxLength: 80
  brief:
    type: string
    minLength: 1
    maxLength: 3000
  selected_hook:
    type: string
    minLength: 1
    maxLength: 240
  beats:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 360
  research_summary:
    type: string
    minLength: 1
    maxLength: 1000
  evidence_items:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: script_generate.input.v1
additional_properties: false
