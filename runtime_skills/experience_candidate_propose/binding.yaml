schema_version: formal_skill_binding.v1
binding_name: experience_candidate_frozen_breakdowns_v1
binding_version: 1.3.0
input_map:
  domain_label: {source: input, key: domain_label}
  content_plan_context: {source: input, key: content_plan_context}
  frozen_breakdowns: {source: input, key: frozen_breakdowns}
output_map:
  decision: {source: model_output, key: decision}
  candidate: {source: model_output, key: candidate}
  source_ids: {source: model_output, key: source_ids}
model_input_schema:
  type: object
  required: [domain_label, content_plan_context, frozen_breakdowns]
  properties:
    domain_label: {type: string}
    content_plan_context: {type: object}
    frozen_breakdowns: {type: array}
  additional_properties: false
model_output_schema:
  type: object
  required: [decision, candidate, source_ids]
  properties:
    decision: {type: string, enum: [proposal, no_proposal]}
    candidate:
      type: object
      nullable: true
      required: [summary, experience_layer, use_positions, trigger_signals, applicable_when, method, boundary, not_applicable_when]
      properties:
        summary: {type: string}
        experience_layer: {type: string, enum: [structure, section_method, local_detail]}
        use_positions: {type: array, items: {type: string, enum: [whole_content, opening, body, transition, ending, sentence]}}
        trigger_signals: {type: array, items: {type: string}}
        applicable_when: {type: array, items: {type: string}}
        method: {type: array, items: {type: string}}
        boundary: {type: array, items: {type: string}}
        not_applicable_when: {type: array, items: {type: string}}
      additional_properties: false
    source_ids: {type: array, items: {type: string}, minItems: 3, maxItems: 8, uniqueItems: true}
  additional_properties: false
model_response_format:
  type: json_object
