schema_version: formal_skill_binding.v1
binding_name: source_to_topic_public_input_to_topic_generation
binding_version: 1.1.0
route_name: business.source_to_topic
route_id: business_analysis
model_response_format:
  type: json_object
model_input_schema:
  type: object
  required:
    - fixture_id
    - source_content
    - source_evidence_refs
    - domain_label
    - relation_summary
    - source_kind
    - event_cluster_summary
    - deterministic_prefilter
    - material_packet
    - duplicate_cooling_status
    - domain_rule_summary
    - experience_cards
    - user_direction
  properties:
    fixture_id: string
    source_content: string
    source_evidence_refs: array
    domain_label: string
    relation_summary: string
    source_kind: string
    event_cluster_summary:
      type: object
    deterministic_prefilter:
      type: object
    material_packet:
      type: object
    duplicate_cooling_status:
      type: object
    domain_rule_summary: string
    experience_cards:
      type: array
      items:
        type: object
    user_direction: string
  additional_properties: false
model_output_schema:
  type: object
  required:
    - topic_status
    - candidate_topic
    - topic_angle
    - core_question
    - audience_relation
    - content_increment
    - supporting_evidence
    - source_constraints
    - no_result_reason
    - confidence
    - angle_discovery
    - candidate_selection
    - risks
    - material_gaps
    - user_review_required
    - user_review_reasons
    - execution_review
    - experience_usage
    - topic_shape
    - delivery_contract
    - schema_version
  properties:
    topic_status:
      type: string
      enum: [generated, generated_good_candidate, valid_but_weak, needs_review, no_result]
    candidate_topic:
      type: string
    topic_angle:
      type: string
    core_question:
      type: string
    audience_relation:
      type: string
    content_increment:
      type: string
    supporting_evidence:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    source_constraints:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    no_result_reason:
      type: string
      enum: [none, empty_source, insufficient_source_evidence, unsupported_source]
    confidence:
      type: string
      enum: [high, medium, low, none]
    angle_discovery:
      type: object
    candidate_selection:
      type: object
    risks:
      type: array
      maxItems: 8
      items:
        type: string
    material_gaps:
      type: array
      maxItems: 8
      items:
        type: string
    user_review_required:
      type: boolean
    user_review_reasons:
      type: array
      maxItems: 8
      items:
        type: string
    execution_review:
      type: object
    experience_usage:
      type: object
    topic_shape:
      type: object
      required: [core_subject, scope_boundary, one_piece_line]
      properties:
        core_subject:
          type: string
        scope_boundary:
          type: string
        one_piece_line:
          type: string
      additional_properties: false
    delivery_contract:
      type: object
      required: [user_gets]
      properties:
        user_gets:
          type: string
      additional_properties: false
    schema_version:
      type: string
      const: source_to_topic.output.v2
  additional_properties: false
input_map:
  fixture_id:
    source: input
    key: request_id
  source_content:
    source: preprocessed
    key: source_text
  source_evidence_refs:
    source: input
    key: source_evidence_items
  domain_label:
    source: input
    key: domain_label
  relation_summary:
    source: preprocessed
    key: relation_text
  source_kind:
    source: input
    key: source_kind
  event_cluster_summary:
    source: input
    key: event_cluster_summary
  deterministic_prefilter:
    source: input
    key: deterministic_prefilter
  material_packet:
    source: input
    key: material_packet
  duplicate_cooling_status:
    source: input
    key: duplicate_cooling_status
  domain_rule_summary:
    source: input
    key: domain_rule_summary
  experience_cards:
    source: input
    key: experience_cards
  user_direction:
    source: input
    key: user_direction
output_map:
  topic_status:
    source: model_output
    key: topic_status
  candidate_topic:
    source: model_output
    key: candidate_topic
  topic_angle:
    source: model_output
    key: topic_angle
  core_question:
    source: model_output
    key: core_question
  audience_relation:
    source: model_output
    key: audience_relation
  content_increment:
    source: model_output
    key: content_increment
  supporting_evidence:
    source: model_output
    key: supporting_evidence
  source_constraints:
    source: model_output
    key: source_constraints
  no_result_reason:
    source: model_output
    key: no_result_reason
  confidence:
    source: model_output
    key: confidence
  angle_discovery:
    source: model_output
    key: angle_discovery
  candidate_selection:
    source: model_output
    key: candidate_selection
  risks:
    source: model_output
    key: risks
  material_gaps:
    source: model_output
    key: material_gaps
  user_review_required:
    source: model_output
    key: user_review_required
  user_review_reasons:
    source: model_output
    key: user_review_reasons
  execution_review:
    source: model_output
    key: execution_review
  experience_usage:
    source: model_output
    key: experience_usage
  topic_shape:
    source: model_output
    key: topic_shape
  delivery_contract:
    source: model_output
    key: delivery_contract
  schema_version:
    source: model_output
    key: schema_version
