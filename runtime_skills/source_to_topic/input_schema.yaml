type: object
required:
  - request_id
  - correlation_id
  - source_id
  - source_content
  - source_evidence_items
  - domain_label
  - relation_summary
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 80
  correlation_id:
    type: string
    minLength: 1
    maxLength: 80
  source_id:
    type: string
    minLength: 1
    maxLength: 80
  source_content:
    type: string
    maxLength: 1600
  source_evidence_items:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 240
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  relation_summary:
    type: string
    maxLength: 600
  schema_version:
    type: string
    const: source_to_topic.input.v1
additional_properties: false
