type: object
required:
- topic_status
- candidate_topic
- topic_angle
- core_question
- audience_relation
- content_increment
- supporting_evidence
- source_constraints
- no_result_reason
- confidence
- angle_discovery
- candidate_selection
- risks
- material_gaps
- user_review_required
- user_review_reasons
- execution_review
- experience_usage
- topic_shape
- delivery_contract
- schema_version
- material_understanding
properties:
  topic_status:
    type: string
    enum:
    - generated
    - no_result
  candidate_topic:
    type: string
  topic_angle:
    type: string
  core_question:
    type: string
  audience_relation:
    type: string
  content_increment:
    type: string
  supporting_evidence:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  source_constraints:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
  no_result_reason:
    type: string
    enum:
    - none
    - empty_source
    - insufficient_source_evidence
    - unsupported_source
  confidence:
    type: string
    enum:
    - high
    - medium
    - low
    - none
  angle_discovery:
    type: array
    items:
      type: object
      required:
      - direction
      - reason
      properties:
        direction:
          type: string
        reason:
          type: string
      additional_properties: false
  candidate_selection:
    type: object
    required:
    - selected_direction
    - why_selected
    - rejected_directions
    properties:
      selected_direction:
        type: string
      why_selected:
        type: string
      rejected_directions:
        type: array
        maxItems: 7
        items:
          type: object
          required:
          - direction
          - reason
          properties:
            direction:
              type: string
            reason:
              type: string
          additional_properties: false
    additional_properties: false
  risks:
    type: array
    maxItems: 8
    items:
      type: string
  material_gaps:
    type: array
    maxItems: 8
    items:
      type: string
  user_review_required:
    type: boolean
  user_review_reasons:
    type: array
    maxItems: 8
    items:
      type: string
  execution_review:
    type: object
    required:
    - used_traceable_material
    - did_not_invent_facts
    - respected_domain_boundary
    - respected_risk_boundary
    - did_not_force_candidate
    - no_score_rank_weight
    properties:
      used_traceable_material:
        type: boolean
      did_not_invent_facts:
        type: boolean
      respected_domain_boundary:
        type: boolean
      respected_risk_boundary:
        type: boolean
      did_not_force_candidate:
        type: boolean
      no_score_rank_weight:
        type: boolean
    additional_properties: false
  experience_usage:
    type: object
    required:
    - used_experience_ids
    - unused_experience_ids
    - rationale
    properties:
      used_experience_ids:
        type: array
        maxItems: 5
        items:
          type: string
      unused_experience_ids:
        type: array
        maxItems: 5
        items:
          type: string
      rationale:
        type: string
    additional_properties: false
  topic_shape:
    type: object
    required:
    - core_subject
    - scope_boundary
    - one_piece_line
    properties:
      core_subject:
        type: string
      scope_boundary:
        type: string
      one_piece_line:
        type: string
    additional_properties: false
  delivery_contract:
    type: object
    required:
    - user_gets
    properties:
      user_gets:
        type: string
    additional_properties: false
  schema_version:
    type: string
    const: source_to_topic.output.v3
  material_understanding:
    type: object
    required:
    - input_kind
    - search_status
    - reason
    - summary
    - domain_fit
    - sources
    properties:
      input_kind:
        type: string
        enum:
        - clue
        - formed_topic
      search_status:
        type: string
        enum:
        - searched
        - not_needed
        - unavailable
      reason:
        type: string
        minLength: 1
      summary:
        type: string
      domain_fit:
        type: string
      sources:
        type: array
        items:
          type: object
          required:
          - url
          - title
          - findings
          properties:
            url:
              type: string
              minLength: 1
            title:
              type: string
              minLength: 1
            findings:
              type: string
              minLength: 1
          additional_properties: false
    additional_properties: false
additional_properties: false
