schema_version: formal_skill_binding.v1
binding_name: research_plan_frozen_topic_v3
binding_version: 3.0.0
model_response_format: {type: json_object}
input_map:
  input_assembly: {source: input, key: input_assembly}
output_map:
  research_objective: {source: model_output, key: research_objective}
  research_scope: {source: model_output, key: research_scope}
  research_sequence: {source: model_output, key: research_sequence}
  research_questions: {source: model_output, key: research_questions}
  source_plan: {source: model_output, key: source_plan}
  required_outputs: {source: model_output, key: required_outputs}
model_input_schema:
  type: object
  required: [input_assembly]
  properties: {input_assembly: {type: object}}
  additional_properties: false
model_output_schema:
  type: object
  required: [research_objective, research_scope, research_sequence, research_questions, source_plan, required_outputs]
  properties:
    research_objective: {type: string}
    research_scope: {type: object}
    research_sequence: {type: array}
    research_questions: {type: array}
    source_plan: {type: array}
    required_outputs: {type: array}
  additional_properties: false
