type: object
required:
  - verdict
  - issues
  - polished_text
  - revision_focus
  - ai_flavor_risk
  - revision_targets
  - schema_version
properties:
  verdict:
    type: string
    enum:
      - pass
      - revise
      - fail
  issues:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
      minLength: 1
  polished_text:
    type: string
    minLength: 50
  revision_focus:
    type: array
    minItems: 1
    maxItems: 3
    items:
      type: string
      minLength: 1
  ai_flavor_risk:
    type: string
    enum:
      - low
      - medium
      - high
  revision_targets:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
  schema_version:
    type: string
    const: script_review.output.v1
additional_properties: false
