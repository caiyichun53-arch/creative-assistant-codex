type: object
required:
  - request_id
  - correlation_id
  - draft_text
  - brief
  - evidence_items
  - human_reference_refs
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
    maxLength: 80
  correlation_id:
    type: string
    minLength: 1
    maxLength: 80
  draft_text:
    type: string
    minLength: 50
    maxLength: 6000
  brief:
    type: string
    minLength: 1
    maxLength: 3000
  evidence_items:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
  human_reference_refs:
    type: array
    minItems: 1
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 240
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: script_review.input.v1
additional_properties: false
