type: object
required:
  - request_id
  - correlation_id
  - research_packet_id
  - research_question
  - research_packet
  - source_refs
  - domain_label
  - schema_version
properties:
  request_id:
    type: string
    minLength: 1
  correlation_id:
    type: string
    minLength: 1
  research_packet_id:
    type: string
    minLength: 1
  research_question:
    type: string
    minLength: 1
  research_packet:
    type: string
    minLength: 1
  source_refs:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: string
      minLength: 1
  domain_label:
    type: string
    enum:
      - fan_kepu_social_life
      - music_entertainment
      - third_domain_neutral
      - cross_domain
      - unknown
  schema_version:
    type: string
    const: research_evidence_extract.input.v1
additional_properties: false
