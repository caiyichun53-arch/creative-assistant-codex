type: object
required:
  - evidence_items
  - uncertainty_notes
  - schema_version
properties:
  evidence_items:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: object
  uncertainty_notes:
    type: array
    minItems: 0
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 240
  schema_version:
    type: string
    const: research_evidence_extract.output.v1
additional_properties: false
