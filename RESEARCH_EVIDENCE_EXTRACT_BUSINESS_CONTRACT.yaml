schema_version: research_evidence_extract.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: research_evidence_extract
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Extract bounded evidence items from an already supplied research packet.
non_responsibilities:
  - search_provider_fetching
  - production_research_plan
  - content_plan
  - script_generation
  - fact_verification_against_external_sources
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - research_packet_id
    - research_question
    - research_packet
    - source_refs
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
extraction_policy:
  consumes_supplied_packet_only: true
  must_not_fetch_or_verify_externally: true
  must_not_plan_content: true
  must_not_synthesize_research_plan: true
  evidence_items_are_candidate_inputs_for_downstream_planning: true
evidence_requirements:
  source_refs_min: 1
  source_refs_max: 12
  evidence_items_min: 1
  evidence_items_max: 12
  output_source_ref_must_reference_input: true
  supporting_text_must_be_selected_from_research_packet: true
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  research_packet_id_max: 80
  research_question_max: 240
  research_packet_max: 6000
  source_ref_max: 160
context_budget:
  max_input_tokens: 9000
token_budget:
  max_output_tokens: 1800
timeout:
  milliseconds: 60000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: research_evidence_extract:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - unseen_source_ref
    - unseen_supporting_text
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.research_evidence_extract
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.research_evidence_extract
  binding_name: research_evidence_extract_public_input_to_evidence_extraction
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    research_question:
      source: input
      key: research_question
    research_packet:
      source: input
      key: research_packet
    source_refs:
      source: input
      key: source_refs
  model_input_schema:
    type: object
    required:
      - fixture_id
      - research_question
      - research_packet
      - source_refs
    properties:
      fixture_id: string
      research_question: string
      research_packet: string
      source_refs: array
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys evidence_items, uncertainty_notes, schema_version.
    Extract evidence only from the supplied research_packet. Each evidence item
    must include claim, source_ref, supporting_text. source_ref must be one of
    source_refs and supporting_text must be copied from the research_packet. Do
    not fetch, verify externally, plan content, or call other Skills. Use
    schema_version research_evidence_extract.output.v1.
    research_question={research_question}; research_packet={research_packet};
    source_refs={source_refs}
  model_output_schema:
    type: object
    required:
      - evidence_items
      - uncertainty_notes
      - schema_version
    properties:
      evidence_items:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: object
      uncertainty_notes:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
          minLength: 1
          maxLength: 240
      schema_version:
        type: string
        const: research_evidence_extract.output.v1
    additional_properties: false
  output_map:
    evidence_items:
      source: model_output
      key: evidence_items
    uncertainty_notes:
      source: model_output
      key: uncertainty_notes
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - research_packet_id
    - research_question
    - research_packet
    - source_refs
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    research_packet_id:
      type: string
      minLength: 1
      maxLength: 80
    research_question:
      type: string
      minLength: 1
      maxLength: 240
    research_packet:
      type: string
      minLength: 1
      maxLength: 6000
    source_refs:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 160
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: research_evidence_extract.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - evidence_items
    - uncertainty_notes
    - schema_version
  properties:
    evidence_items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
    uncertainty_notes:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: research_evidence_extract.output.v1
  additional_properties: false
