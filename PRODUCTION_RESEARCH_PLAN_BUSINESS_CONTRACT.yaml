schema_version: production_research_plan.business_contract.v1
governance_basis: docs/EFFECTIVE_DESIGN_BASELINE.md
status: active_formal_business_contract
skill_id: production_research_plan
skill_version: 1.0.0
source_documents:
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - docs/EFFECTIVE_DESIGN_BASELINE.md
responsibility: Synthesize supplied candidate topic, extracted evidence, and tactic candidates into a bounded production research plan.
non_responsibilities:
  - research_evidence_extract
  - search_provider_fetching
  - source_to_topic
  - content_plan
  - script_generation
  - script_review
  - fact_verification_against_external_sources
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - candidate_topic
    - evidence_items
    - tactic_candidates
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
planning_policy:
  consumes_supplied_evidence_only: true
  must_not_fetch_or_verify_externally: true
  must_not_write_script_or_outline: true
  must_not_call_content_plan: true
  plan_steps_must_reference_input_evidence_or_tactics: true
evidence_requirements:
  evidence_items_min: 1
  evidence_items_max: 12
  tactic_candidates_min: 1
  tactic_candidates_max: 12
  output_claims_must_reference_input_evidence_claims: true
  output_plan_uses_must_reference_input_claims_or_tactics: true
timeout:
  milliseconds: 60000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: production_research_plan:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - unseen_claim
    - unseen_plan_use
completion_definition: []
missing_requirements: []
allowed_model_nodes:
  - business.research_synthesis
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.research_synthesis
  route_id: business_analysis
  binding_name: production_research_plan_public_input_to_research_synthesis
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    research_question:
      source: input
      key: candidate_topic
    evidence_refs:
      source: input
      key: evidence_items
    tactic_candidates:
      source: input
      key: tactic_candidates
  model_input_schema:
    type: object
    required:
      - fixture_id
      - research_question
      - evidence_refs
      - tactic_candidates
    properties:
      fixture_id: string
      research_question: string
      evidence_refs:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: object
      tactic_candidates: array
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys summary, claims, plan_steps, open_questions,
    schema_version. Create a bounded production research plan from the supplied
    candidate topic, evidence_refs, and tactic_candidates only. Do not fetch,
    verify externally, write an outline, generate script text, or call other
    Skills. claims must come from evidence_refs.claim. Each plan_steps item must
    include step, purpose, uses, and uses must reference an input claim or tactic
    candidate. Use schema_version production_research_plan.output.v1.
    research_question={research_question}; evidence_refs={evidence_refs};
    tactic_candidates={tactic_candidates}
  model_output_schema:
    type: object
    required:
      - summary
      - claims
      - plan_steps
      - open_questions
      - schema_version
    properties:
      summary:
        type: string
        minLength: 1
      claims:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: string
          minLength: 1
      plan_steps:
        type: array
        minItems: 1
        maxItems: 10
        items:
          type: object
      open_questions:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
          minLength: 1
      schema_version:
        type: string
        const: production_research_plan.output.v1
    additional_properties: false
  output_map:
    summary:
      source: model_output
      key: summary
    claims:
      source: model_output
      key: claims
    plan_steps:
      source: model_output
      key: plan_steps
    open_questions:
      source: model_output
      key: open_questions
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - candidate_topic
    - evidence_items
    - tactic_candidates
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
    correlation_id:
      type: string
      minLength: 1
    candidate_topic:
      type: string
      minLength: 1
    evidence_items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
    tactic_candidates:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: production_research_plan.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - summary
    - claims
    - plan_steps
    - open_questions
    - schema_version
  properties:
    summary:
      type: string
      minLength: 1
    claims:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
    plan_steps:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: object
    open_questions:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
        minLength: 1
    schema_version:
      type: string
      const: production_research_plan.output.v1
  additional_properties: false
