schema_version: 1
goal: GOAL-RUNTIME-VERTICAL-SLICE-01
status: implemented_pending_validation
purpose: Clean-room runtime skeleton minimum vertical slice using synthetic runtime_probe only.
boundaries:
  core_api:
    owns:
    - health
    - readiness
    - create runtime_probe job
    - query job
    - query result
    - query outbox
    forbids:
    - direct skill execution
    - direct model call
  job_worker:
    owns:
    - persisted scheduler_job
    - atomic lease
    - retry/dead-letter
    - lease recovery
    forbids:
    - business prompt ownership
    - business judgement
  input_binding:
    owns:
    - public portable input projection
    forbids:
    - internal state leakage
    - database handles
  portable_skill:
    name: runtime_probe
    path: runtime_skills/runtime_probe/skill.yaml
    purpose: runtime validation only
    forbids:
    - database reads
    - file writes
    - Core API calls
    - state transitions
    - provider knowledge
  runner:
    owns:
    - skill package loading
    - input validation
    - output validation
    - model gateway call
    forbids:
    - direct business database writes
    - context fabrication
  model_gateway:
    route: runtime_probe.test
    provider: runtime_probe_test_port
    real_model_calls: false
  materializer:
    owns:
    - runtime_probe_result immutable version
    - runtime_probe_skill_run record
    - runtime_probe_result_index
    - outbox event creation
  outbox:
    external_send: false
formal_storage:
  target_contract: PostgreSQL
  local_test_adapter: SQLite
  sqlite_schema:
  - scripts/core/persistence/goal01_schema.sqlite.sql
  - scripts/core/persistence/goal02_schema.sqlite.sql
  - scripts/core/persistence/goal03_schema.sqlite.sql
  - scripts/core/runtime/goal_runtime_vertical_slice_schema.sqlite.sql
  postgres_schema:
  - scripts/core/persistence/goal01_schema.postgres.sql
  - scripts/core/persistence/goal02_schema.postgres.sql
  - scripts/core/persistence/goal03_schema.postgres.sql
  - scripts/core/runtime/goal_runtime_vertical_slice_schema.postgres.sql
clean_room:
  old_business_data_import_allowed: false
  fixture_required_for_production: false
  cold_backup_access_allowed: false
  real_llm_call_allowed: false
runtime_probe:
  input_fields:
  - request_id
  - correlation_id
  - text
  - requested_operation
  - metadata
  output_fields:
  - normalized_text
  - operation
  - result_code
  - deterministic_summary
  - trace
  - schema_version
