production_boundary_registry:
  status: FROZEN
  version: '2'
  in_boundary_principles:
  - boundary_id: music-core-content-in-1
    principle: 围绕音乐作品、歌手或音乐人、音乐创作与演唱、音乐人物经历、歌曲故事、作品解读、音乐现象、符合排除边界的音乐发现、榜单盘点与比较、现场演出，以及其他与音乐本身具有实质关联的内容。
    rationale: 这些内容的主要价值直接来自音乐、音乐作品或音乐人物本身。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  - boundary_id: music-core-content-in-2
    principle: 可以结合热点，但内容核心必须仍然是音乐、作品或音乐人物本身，并且能够进入后续正式研究。
    rationale: 热点只能作为入口，不能改变音乐领域的正式内容边界。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  out_boundary_principles:
  - boundary_id: music-professional-analysis-out
    principle: 排除专业乐评、听感或作品优劣分析、乐理、编曲、唱法、气息、咬字等演唱技术分析；不能改成“为什么好听、为什么难唱”绕过排除。允许的故事、发现、盘点和合集仍须有具体内容，不能只给现象或彩蛋名字。
    rationale: 用户最新明确排除专业乐评和技术分析；音乐规则不推广到其他领域。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  - boundary_id: music-noncore-content-out-1
    principle: 以明星私生活、娱乐八卦、综艺新闻、饭圈争议、未经证实的传闻或纯热点搬运为主体的内容，不进入正式生产。
    rationale: 这些内容的主要价值来自泛娱乐事件，而不是音乐本身。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  - boundary_id: music-noncore-content-out-2
    principle: 与音乐仅有表面人物关联、实质内容属于泛娱乐新闻的内容，不进入正式生产。
    rationale: 表面人物关联不能替代对音乐作品、创作、演唱或音乐现象的实质关联。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  - boundary_id: music-noncore-content-out-3
    principle: 缺乏可靠依据时，不得把传闻或推测作为事实展开。
    rationale: 正式生产不能把未经证实的信息当作事实。
    origin: explicit_human_decision
    evidence_refs: []
    merged_from: []
  unknown_topic_rule:
    rule: 如果一个选题同时具有音乐内容和泛娱乐属性，判断其主要内容价值是否来自音乐作品、创作、演唱、音乐人物或音乐现象本身；如果是，可以进入后续正式研究；如果主要价值来自八卦、新闻、私生活或泛娱乐事件，不进入正式生产。
    uncertain_action: 无法确定是否越界时，不自动放行，由用户决定。
    origin: explicit_human_decision
  provenance:
    source: explicit_human_decision
