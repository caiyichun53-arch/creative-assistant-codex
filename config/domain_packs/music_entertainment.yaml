  - 填词
  - 作品
  - 舞台
  - 专辑
  - 乐队
  - 听歌
  - 旋律
  - 歌词
  allowed_primary_carriers:
  - 歌曲或作品故事
  - 歌手、音乐人或组合的音乐经历
  - 创作、演唱、合作和作品关系
  - 围绕明确主题的歌曲或作品盘点
  - 作品观点、听歌体验和音乐记忆
  - 与作品紧密相关的音乐文化现象
  excluded_when_music_is_only_an_association: true
