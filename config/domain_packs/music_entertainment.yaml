name: 音乐娱乐
formal_domain_label: music_entertainment
description: 音乐作品、歌手、文化记忆、审美、情绪与流行传播；不做娱乐新闻、综艺八卦和未证实传闻。
activation_status: approved
workflow_mode: manual_guard
content_type_registry:
  status: FROZEN
  version: '1'
  types:
  - canonical_id: music_collection_curation
    name: 音乐主题盘点/合集
    core_subject: 多个音乐作品、歌手或其他明确音乐对象
    content_promise: 围绕一个明确主题，通过筛选、组织、比较或推荐，让多个音乐对象形成一条完整内容
    required_delivery: 明确主题；明确筛选或组织逻辑；多个具有差异的条目；必要的说明和收束
    scope_boundary: 不能因为同时列出多个技术点就算合集；不能以音乐技术、乐理或演唱技术分析为主要交付；不能只是没有选择逻辑的简单罗列
  - canonical_id: person_music_story
    name: 人物音乐故事
    core_subject: 歌手、音乐人、组合等音乐人物
    content_promise: 讲清人物一段具有独立价值的音乐经历、选择、转折、创作过程、合作关系或音乐发展路径
    required_delivery: 人物音乐经历；关键事件或选择；与作品、合作、创作或音乐事业直接相关的材料；清晰的经历推进
    scope_boundary: 泛生活传记不属于；私生活、婚恋、八卦不能因为主角是歌手就进入；单纯评价唱功或音乐技术不属于；人物只是作品或事件参与者时不能自动归入人物故事
  - canonical_id: work_context_story
    name: 作品背景故事
    core_subject: 明确歌曲、专辑或音乐作品
    content_promise: 通过创作、发行、合作、人物关系、时代或文化背景，让观众理解作品如何产生以及作品背后的故事
    required_delivery: 明确作品；创作、发行、合作或历史背景；背景与作品之间的关系；有材料支撑的作品经历或背景叙事
    scope_boundary: 不包括音乐赏析、听感分析、乐理分析、编曲技术分析、演唱技术分析、为什么难唱、单纯讨论作品好不好听或主要交付为主观审美评价；作品为什么产生、如何产生、谁参与和真实背景可以属于本类型
  - canonical_id: music_event_context
    name: 音乐事件/文化现象
    core_subject: 具体音乐事件、音乐节目事件、音乐竞争事件，或有明确音乐内容承载的音乐文化现象
    content_promise: 讲清具体音乐事件发生了什么、谁参与、如何发展，以及它在音乐语境中为什么值得理解
    required_delivery: 明确事件或现象；参与者和关系；发展过程；与音乐直接相关的背景；有材料支撑的有限解释
    scope_boundary: 不能借音乐事件转去主要讲泛商业机制、法律制度、普通行业制度、活动管理、平台算法、泛传播学或与音乐内容关系很弱的社会科普；音乐必须是主要内容承载而不是入口装饰
runtime_requirements:
- music_audience_browser
question_expansion_policy:
  primary_content_carrier_required: true
  primary_content_carrier_rule: 音乐娱乐领域的问题拓展，最终内容必须主要通过音乐、作品或音乐人物的音乐经历来承载；不能只因为人物、作品或机构与音乐有关，就把主体改成另一个领域的制度、法律、技术、商业、职业制度、私生活或泛娱乐知识。
  primary_carrier_signal_terms:
  - 音乐
  - 歌曲
  - 歌手
  - 音乐人
  - 组合
  - 演唱
  - 创作
