schema_version: model_routes.v1

# Illustrates that each of the three runtime model positions can be repointed
# to a DIFFERENT provider independently -- this is an example of a possible
# future state, not the current one (config/model_routes.yaml keeps all three
# on mimo_main today). Note what is deliberately absent: there is no
# "codex"/"claude_cli" provider type here. Claude Code and Codex are
# engineering tools used to write this repo's code; they are never a valid
# provider for a runtime model position, in this file or any other.
model_positions:
  dialogue_model: daily_chat
  business_model: business_analysis
  writing_model: writing_generation

model_providers:
  mimo_main:
    type: mimo
    enabled: true
    provider_name: hermes
    live_model_port: HermesModelProviderAdapter
    auth_ref: HERMES_BUSINESS_API_KEY
    endpoint_ref: HERMES_BUSINESS_BASE_URL
    model_ref: HERMES_BUSINESS_MODEL_NAME
    model_class_ref: HERMES_BUSINESS_MODEL_CLASS
    billing_mode: subscription

  gpt_api_gateway:
    type: openai_compatible_api
    enabled: true
    auth_ref: GPT_API_GATEWAY_KEY
    base_url_ref: GPT_API_GATEWAY_BASE_URL
    model_ref: GPT_API_GATEWAY_MODEL

model_routes:
  daily_chat:   # dialogue_model -- stays on mimo_main in this example
    provider_ref: mimo_main
    fallback: none
    allowed_task_types:
      - daily_conversation
      - system_status_explanation
      - user_instruction_intake

  business_analysis:   # business_model -- example of switching to a GPT API gateway
    provider_ref: gpt_api_gateway
    fallback: none
    allowed_task_types:
      - business_planning
      - topic_screening
      - topic_scoring
      - material_summary
      - material_value_judgement
      - benchmark_analysis
      - comment_analysis
      - experience_matching
      - experience_applicability_judgement
      - risk_initial_review
      - workflow_execution_summary

  writing_generation:   # writing_model -- example of switching to a GPT API gateway
    provider_ref: gpt_api_gateway
    fallback: none
    allowed_task_types:
      - title_generation
      - title_rewrite
      - hook_generation
      - content_structure
      - rough_draft
      - final_draft
      - multi_variant_copy_generation
      - rewrite
      - polishing
      - de_ai_style
      - colloquial_rewrite
      - emotional_strengthening
      - reduce_preachiness
      - reduce_plagiarism_risk_rewrite
      - platform_adaptation
      - cover_copy
      - publishing_copy
      - final_copy_review
