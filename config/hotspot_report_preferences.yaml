version: '2026-09-08.1'
scope: 当前用户的综合热点汇报；不替代其他领域或正式候选规则
rules:
  - id: esports
    basis: 用户明确排除整类
    exclude: 电竞赛事、战报、晋级、战队和选手电竞动态
    boundary: 不扩展到所有游戏、其他体育或劳动权益等跨领域公共事件
  - id: variety
    basis: 用户明确排除整类
    exclude: 综艺节目、节目片段、嘉宾互动、幕后话题及节目热度
    boundary: 不扩展到所有音乐、影视作品或公众人物的公共事件
  - id: celebrity_private
    basis: 从用户选择归纳的初版，用户已授权收口实施
    exclude: 明星婚恋、生育、备孕、外貌及没有实质内容的私人和活动动态
    boundary: 公众权益、劳动、社会争议不因涉及明星而排除
  - id: promotion
    basis: 从用户选择归纳的初版，用户已授权收口实施
    exclude: 只含宣传口号、带货、造势或活动预告而没有实质内容的消息
    boundary: 产品评测、价格竞争力、技术、政策和产业分析不是仅凭发布二字就排除；含糊或混合内容保留
  - id: market_routine
    basis: 从用户选择归纳的初版，用户已授权收口实施
    exclude: 常规金融行情、投资策略、金融机构增资、普通企业公告、经济数据播报、财经日程和要闻拼盘
    boundary: 不排除全部财经；消费权益、劳动权益、实际供应或技术产业问题按内容判断
  - id: memes_challenges
    basis: 从用户选择归纳的初版，用户已授权收口实施
    exclude: 明确的纯玩梗二创、搞笑或猎奇挑战
    boundary: 科普演示、技术演示、摄影技巧和音乐表达不能仅因标题轻松而排除
  - id: routine_local
    basis: 从用户选择归纳的初版，用户已授权收口实施
    exclude: 单纯天气提醒、局部辟谣、零散猎奇或生活争执且没有可见的更广泛问题
    boundary: 不排除全部事故、司法案件或社会个案；影响和内容不清楚时保留
  - id: rejected_event
    basis: 用户明确排除的具体事件，不推广为整个领域
    exclude: 鸣笛催让路女子报警称骚扰；蒙扎站勒克莱尔退赛
    boundary: 仅这两个具体事件，不排除全部纠纷或赛车赛事
uncertain: 保留并说明不确定性，不编造依据；偏好更新须来自用户反馈，不根据一次保留自动扩展
