schema_version: model_routes.v1
model_providers:
  mimo_main:
    type: mimo
    enabled: true
    auth_ref: MIMO_AUTH
    endpoint_ref: MIMO_ENDPOINT
    model_ref: MIMO_MODEL

model_routes:
  daily_chat:
    provider_ref: mimo_main
    fallback: none
    allowed_task_types:
      - daily_conversation
      - system_status_explanation
      - user_instruction_intake

  business_analysis:
    provider_ref: mimo_main
    fallback: none
    allowed_task_types:
      - business_planning
      - topic_screening
      - topic_scoring
      - material_summary
      - benchmark_analysis
      - comment_analysis
      - experience_matching
      - risk_initial_review
      - workflow_execution_summary

  engineering_execution:
    provider_ref: mimo_main
    fallback: none
    allowed_task_types:
      - code_editing
      - command_execution
      - test_running
      - config_modification
      - bug_fixing
      - migration_script_generation
      - repo_inspection

  writing_generation:
    provider_ref: mimo_main
    fallback: none
    allowed_task_types:
      - title_generation
      - hook_generation
      - content_structure
      - rough_draft
      - final_draft
      - rewrite
      - polishing
      - de_ai_style
      - emotional_strengthening
      - platform_adaptation
      - cover_copy
      - publishing_copy
      - final_copy_review
