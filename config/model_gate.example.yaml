# Example only. Keep real values in .env.live-gates or another ignored local secret store.

goal: GOAL-RUNTIME-MODEL-GATE-01
route:
  route_name: runtime_probe.test
  provider_name: hermes
  config_version: goal-runtime-model-gate-01.live.v1
  timeout_ms: 30000
  parameters:
    temperature: 0
    max_completion_tokens: 128
    reasoning_effort: low
    response_format:
      type: json_object
provider:
  purpose: hermes_mimo_only
  daily_hermes_chat_profile_scope: must_remain_mimo
  type: hermes_mimo_chat_completions
  token_env: HERMES_BUSINESS_MODEL_TOKEN
  base_url_env: HERMES_BUSINESS_MODEL_BASE_URL
  model_env: HERMES_BUSINESS_MODEL_NAME
  model_class_env: HERMES_BUSINESS_MODEL_CLASS
  billing_mode: subscription
  cost_status_when_amount_missing: not_reported
safety:
  live_call_limit: 1
  dry_run_fallback_allowed: false
  fake_port_fallback_allowed: false
  business_content_allowed: false
