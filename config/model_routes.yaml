schema_version: model_routes.v1

# Single, explicit model-routing entry point for this repo.
#
# There are exactly three runtime model positions. Each is bound to exactly one
# provider below; each can be repointed to a different provider independently
# in the future (see model_providers). Fallback is disabled for every route --
# on failure the caller fails closed, it never silently substitutes a
# different provider or a cached/default answer.
#
# Claude Code and Codex are engineering tools used to WRITE the code in this
# repository. They are not a runtime model position and must never be
# configured here or bound to a business/writing route -- writing code with
# Claude Code does not make "creation"/"business analysis" run on Claude.
model_selection:
  # This selection remains available for explicit maintenance, tests, and
  # non-Hermes callers. A formal task created by Hermes does not use it as a
  # model default: Hermes passes its current model/provider binding, and a
  # persistent task freezes that binding for resume. There is no automatic
  # fallback or provider priority.
  active_provider_ref: MODEL_ACTIVE_PROVIDER_REF
  allowed_provider_refs:
    - mimo_main
    - relay_main

model_positions:
  dialogue_model: daily_chat          # 对话模型:日常对话/系统状态说明
  business_model: business_analysis   # 业务模型:选题判断/研究综合/关系判定等分析类节点
  writing_model: writing_generation   # 文案模型:钩子/大纲/成稿/润色/AI味判定等创作生成类节点

model_providers:
  mimo_main:
    type: mimo
    enabled: true
    provider_name: hermes
    live_model_port: HermesModelProviderAdapter
    auth_ref: HERMES_BUSINESS_MODEL_TOKEN
    endpoint_ref: HERMES_BUSINESS_MODEL_BASE_URL
    model_ref: HERMES_BUSINESS_MODEL_NAME
    model_class_ref: HERMES_BUSINESS_MODEL_CLASS
    billing_mode: subscription

  relay_main:
    type: openai_compatible
    enabled: true
    provider_name: hermes
    live_model_port: HermesModelProviderAdapter
    auth_file_ref: GPT_RELAY_API_KEY_FILE
    endpoint_ref: GPT_RELAY_BASE_URL
    model_ref: GPT_RELAY_MODEL
    default_parameters:
      reasoning_effort: high
    billing_mode: subscription
  codex_subscription:
    # 已具备统一适配器；当前只绑定工作台验证入口，正式业务切换仍需单独验证。
    type: codex_app_server
    enabled: true
    provider_name: codex_app_server
    live_model_port: CodexAppServerProviderAdapter
    command_ref: CODEX_CLI_PATH
    model_ref: CODEX_WORKBENCH_MODEL
    model_class_ref: CODEX_WORKBENCH_MODEL_CLASS
    timeout_ref: CODEX_WORKBENCH_TIMEOUT_SECONDS
    billing_mode: chatgpt_subscription
model_routes:
  daily_chat:   # dialogue_model
    provider_ref: active_provider
    fallback: none
    allowed_task_types:
      - daily_conversation
      - system_status_explanation
      - user_instruction_intake

  workbench_read_only_assistant:
    # 这是订阅路线的工作台入口，不是第二套正式业务状态流转。
    provider_ref: codex_subscription
    fallback: none
    allowed_task_types:
      - system_status_explanation
      - user_instruction_intake

  business_analysis:   # business_model
    provider_ref: active_provider
    fallback: none
    allowed_task_types:
      - business_planning
      - topic_screening
      - topic_scoring
      - material_summary
      - material_value_judgement
      - benchmark_analysis
      - comment_analysis
      - experience_matching
      - experience_applicability_judgement
      - risk_initial_review
      - workflow_execution_summary

  research_execution:
    # Formal research is handled by the active Hermes service route.
    provider_ref: active_provider
    fallback: none
    allowed_task_types:
      - external_research_execution

  research_planning:
    # Planning and deep research must stay on the same Hermes service route.
    provider_ref: active_provider
    fallback: none
    allowed_task_types:
      - external_research_planning

  writing_generation:   # writing_model
    provider_ref: active_provider
    fallback: none
    allowed_task_types:
      - title_generation
      - title_rewrite
      - hook_generation
      - content_structure
      - rough_draft
      - final_draft
      - multi_variant_copy_generation
      - rewrite
      - polishing
      - de_ai_style
      - colloquial_rewrite
      - emotional_strengthening
      - reduce_preachiness
      - reduce_plagiarism_risk_rewrite
      - platform_adaptation
      - cover_copy
      - publishing_copy
      - final_copy_review

# Removed 2026-07-09: an `engineering_execution` route (code_editing,
# command_execution, test_running, config_modification, bug_fixing,
# migration_script_generation, repo_inspection) used to sit here, bound to
# the old model provider. Nothing in scripts/core or runtime_skills
# ever read that route_id -- it was dead config, and its very existence
# violated the rule above: "engineering execution" describes what Claude
# Code/Codex do to WRITE this repo, which is not a runtime model position and
# must not be modeled as one.
