# 禁词表(数据半边;执行半边 = 写完后代码校验器,阶段5建)
# 来源:旧库 通用写作经验.md·禁用词清单(已归档 vault/参考/痕迹库/真人写作特征.md)
# 纪律:绝不进生成 prompt;只在 LLM 写完后扫描。持续进化:发现新 AI 高频词加进对应等级。
# 等级规则:red=出现1次即拦;warn=800字内≥2次告警;hint=整体评估不机械判定。

red:
  连接词套话:
    - 说白了
    - 本质上
    - 换句话说
    - 值得注意的是
    - 事实上
    - 由此可见
    - 综上所述
    - 总而言之
    - 归根结底
    - 从某种意义上说
    - 不可否认的是
  AI万能句式:
    - 在这个快节奏的时代
    - 越来越多人开始关注
    - 我们不妨换个角度思考
    - 让我们一起来探讨
    - 这不禁让人思考
    - 引发了广泛的讨论
    - 成为了热议的话题
  AI流水线句式:
    - 掰开了
    - 掰开
    - 揉碎了
    - 盘个明明白白
    - 盘个明白
    - 扒清楚
    - 手把手教你
    - 今天我们来聊聊
    - 很多人都不知道
    - 全网最全
    - 建议收藏
    - 先点赞收藏
    - 干货满满
  空洞排比升华:
    - 这才是…的真谛
  虚假互动祈使:
    - 请你记住
    - 你一定要知道
    - 请务必看完
    - 看到最后
    - 建议反复观看
  矫情比喻:
    - 像一只蝴蝶飞过沧海
    - 如同黑暗中的一束光
    - 在时间的洪流里
    - 生命的底色
    - 岁月的痕迹
    - 时代的烙印
    - 命运的齿轮

warn:
  AI高频但口语偶用:
    - 你会发现
    - 你可能会问
    - 有人会说
    - 难道不是吗
    - 真的假的
    - 太真实了
    - 说到点子上了
    - 细思极恐
    - 颠覆认知
    - 打破常识

# 正则类(模式不是定串):校验器按 regex 扫
red_patterns:
  段首然而: '(?m)^然而'
  三连排比: '让你.{1,12}让你.{1,12}让你'
  既是也是更是: '既是.{1,16}也是.{1,16}更是'
  原来背后藏着: '原来.{1,20}的背后[,，]?藏着'

hint_patterns:
  翻译腔_当时候: '当.{1,16}的时候'
  翻译腔_过程中: '在.{1,16}的过程中'
  翻译腔_通过方式: '通过.{1,16}的方式'
  翻译腔_对于来说: '对于.{1,16}来说'
  过度解释: '也就是说|简单来说|通俗地讲'

# 标点规则(口播)
punctuation:
  warn:
    '！': 每段最多1-2个
    '？': 只用于真正提问,不用反问/自问自答
    '；': 口语没有分号,用句号断开

# 结构规则(校验器实现)
structural:
  四字成语: 同段≥2个四字成语告警(口播像背稿)

# 书面词→口语替代(命中 hint 级,给定点重写建议)
replacements:
  抵达: 到
  目睹: 看见
  聆听: 听
  获取: 拿到
  放弃: 不干了
  思考: 想
  回应: 回
  忽视: 没看见
  承受: 扛
  缓缓: 慢慢
  凝望: 盯着看
  触摸: 摸
  基于: 口语化改写
  呈现: 看出来
  赋予: 给
