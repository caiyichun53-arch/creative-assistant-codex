# Copy to config/live_gates.yaml for local validation runs.
# Keep config/live_gates.yaml untracked if it contains machine-specific paths.
#
# These gates validate only current executable boundaries. They do not validate
# retired Host, Feishu, scheduler, staging, or Goal-era workflows.

environment: validation
allow_live_calls: false
shadow_only: true
preflight_required: true
env_file: .env.live-gates
evidence_root: validation_evidence
status_file: validation_evidence/live_gates_status.yaml
allowed_database_roots:
  - data/validation/live_gates
  - validation_evidence/databases

gates:
  - gate_id: GATE-MODEL-PROVIDER
    adapter: current model provider boundary
    live_enabled: false
    isolated_database: data/validation/live_gates/model_provider.sqlite
    required_env:
      - HERMES_BUSINESS_MODEL_TOKEN
      - HERMES_BUSINESS_MODEL_BASE_URL
      - HERMES_BUSINESS_MODEL_NAME
      - HERMES_BUSINESS_MODEL_CLASS
    required_test_env:
      - kind: isolated_database
        name: isolated model-provider validation database
        value: data/validation/live_gates/model_provider.sqlite

  - gate_id: GATE-ASR
    adapter: ASR command boundary
    live_enabled: false
    isolated_database: data/validation/live_gates/asr_validation.sqlite
    required_env:
      - ASR_TEST_MEDIA_PATH
      - ASR_MODELS_ROOT
    required_test_env:
      - kind: isolated_database
        name: isolated ASR validation database
        value: data/validation/live_gates/asr_validation.sqlite
      - kind: path_exists
        name: current external-adapter boundary
        value: scripts/core/external_adapters/goal_phase4_external_adapters.py

  - gate_id: GATE-SEARCH-PROVIDER
    adapter: research adapter boundary
    live_enabled: false
    isolated_database: data/validation/live_gates/search_provider.sqlite
    required_env:
      - SEARCH_PROVIDER_API_KEY
      - SEARCH_PROVIDER_NAME
      - SEARCH_PROVIDER_QUERY_FILE
    required_test_env:
      - kind: isolated_database
        name: isolated research validation database
        value: data/validation/live_gates/search_provider.sqlite

  - gate_id: GATE-EXTERNAL-COLLECTOR-ADAPTER
    adapter: external collector adapter boundary
    live_enabled: false
    isolated_database: data/validation/live_gates/collector_validation.sqlite
    required_env:
      - COLLECTOR_TEST_PROFILE_DIR
      - COLLECTOR_TEST_SAMPLE_URL
    required_test_env:
      - kind: isolated_database
        name: isolated collector validation database
        value: data/validation/live_gates/collector_validation.sqlite
      - kind: path_exists
        name: current external-adapter boundary
        value: scripts/core/external_adapters/goal_phase4_external_adapters.py
