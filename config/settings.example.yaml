# Copy to config/settings.yaml and adjust local paths before running.

paths:
  db: data/formal/clean_room_v0_6_2.sqlite3
  vault: vault
  raw: data/formal/raw
  drafts: data/formal/drafts
  logs: logs

storage:
  formal_engine: postgresql
  database_url_env: CREATION_ASSISTANT_DATABASE_URL
  local_validation_engine: sqlite
  local_validation_db: data/formal/clean_room_v0_6_2.sqlite3
  sqlite_schema_chain:
    - scripts/core/persistence/goal01_schema.sqlite.sql
    - scripts/core/persistence/goal02_schema.sqlite.sql
    - scripts/core/persistence/goal03_schema.sqlite.sql
    - scripts/core/runtime/goal_runtime_vertical_slice_schema.sqlite.sql
  postgres_schema_chain:
    - scripts/core/persistence/goal01_schema.postgres.sql
    - scripts/core/persistence/goal02_schema.postgres.sql
    - scripts/core/persistence/goal03_schema.postgres.sql
    - scripts/core/runtime/goal_runtime_vertical_slice_schema.postgres.sql

legacy_runtime:
  enabled: false
  allow_env: CREATION_ASSISTANT_ENABLE_LEGACY_RUNTIME
  status: removed_from_active_repository
  runtime_authority: false

llm:
  model_routes: config/model_routes.yaml
  business_route_registry: BUSINESS_MODEL_ROUTE_REGISTRY.yaml
  direct_cli_runtime_authority: false
  fallback_enabled: false

hit_detection:
  baseline_window_days: 90
  baseline_min_samples: 30
  excess_threshold: 3.0
  # 2026-07-06 business decision (see BUSINESS_RULE_CATALOG.yaml BR-HIT-001):
  # threshold = max(median * excess_threshold, min(P90, hit_floor_absolute_like_count)).
  # P90 computed on the same small recent sample being judged is close to tautological
  # -- by definition ~10% of any account's sample clears its own P90 -- so it can no
  # longer stand alone as an upper-uncapped term (verified against real data: as a bare
  # OR-ed term it capped 23/28 accounts at exactly 2 hits regardless of true
  # distribution shape). Bounding it with min(P90, floor) keeps it from pushing the bar
  # above the floor for large accounts, while still giving small accounts (whose P90
  # never reaches the floor) a reachable relative bar instead of a permanently
  # unreachable absolute one. There is no separate p90_required toggle -- P90 always
  # participates, just bounded.
  hit_floor_absolute_like_count: 2000
  # 2026-07-07 business decision (BUSINESS_RULE_CATALOG.yaml BR-HIT-001 amendment): a
  # video is also a hit if comment_count/like_count >= comment_like_ratio_threshold,
  # OR-ed alongside the like_count formula above (not a replacement -- a video can
  # qualify through either channel). Sourced from published Douyin operator guidance
  # (comment/like ratio floor ~10%, ~30% for a typical hit) and NOT from an internally
  # computed percentile. 0.2 was chosen after checking 15%/18%/20% against the real
  # 28-account/1253-video dataset: it eliminates the one real account that had zero
  # hits under the like-only formula (财经不眠姐: 0 -> 2) without zeroing any other
  # account, while 15% showed accelerating, less stable growth on accounts that had
  # previously shown false-positive risk under other tested designs. collect_count and
  # share_count ratios were evaluated the same way but no published threshold survived
  # contact with the real data (the claimed 3-5x collect:like ratio for knowledge
  # content matched zero of 1253 real videos), so those two dimensions are not judged.
  comment_like_ratio_threshold: 0.2
  # 2026-07-07 user decision: a still-watching video (day 1-6 of its life) should not
  # be compared against the mature/settled threshold above (median * 3) -- that
  # threshold is calibrated for fully-matured (>=7 day) videos, so a young video would
  # almost never clear it except in an extreme viral case, which defeats the point of
  # checking early at all. Instead, a SEPARATE channel compares a still-watching
  # video's current like_count against `early_excess_threshold` times the account's
  # own median like_count AT THAT SAME DAY-OFFSET (computed from video_checks history
  # across this account's other videos, not from the mature threshold). The user
  # explicitly set this multiplier lower than excess_threshold (3.0) because a 3x bar
  # pulls the standard too high for large accounts -- same reasoning as excess_threshold
  # itself, just applied to the day-specific reference instead of the mature one.
  # Requires enough video_checks history at that day-offset to trust the median; until
  # daily incremental has run for real over enough days, this channel has no data to
  # use yet and is skipped (never blocks or fabricates a threshold from thin samples).
  early_excess_threshold: 2.0
  # 2026-07-06: pinned and younger-than-observe-window videos are permanently
  # ineligible for baseline computation, so fetching exactly baseline_min_samples raw
  # videos on first crawl structurally falls short of 30 eligible after exclusion.
  # Verified against real data: worst observed account had 14/30 excluded (avg 6/30).
  # Fetch buffer covers that with a small margin. Configurable, not a literal in code.
  first_crawl_fetch_buffer: 15
  observe_days: 7
  recheck_interval_hours: 24

candidate_pool:
  decay_half_life_days: 7
  expire_heat: 0.1
  reheat_boost: 0.5

reverse_engine:
  # Local model root. Keep real absolute paths in config/settings.yaml only.
  models_root: models
  asr_model: sensevoice/sensevoice-small
  vad_model: modelscope_cache/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
  min_transcript_chars: 80

humanize:
  # Local source corpus path. Leave empty until configured.
  corpus_dir: ""
  chunk_chars: 60000
  reduce_chars: 80000
  out_dir: data/humanize

crawler:
  daily_max_notes: 20
  rate_limit_jitter_sec: [3, 10]
  incremental: true

language_fuel:
  vault_dir: 语感燃料
  default_write_obsidian: true
  adapters:
    mediacrawler:
      enabled: true
      adapter_status: vendor_available
      platforms: [xhs, douyin, kuaishou, bilibili, weibo, tieba, zhihu]
      source_kind_by_platform:
        xhs: post
        douyin: short_comment
        kuaishou: short_comment
        bilibili: short_comment
        weibo: post
        tieba: post
        zhihu: article_or_answer
  platforms:
    douban:
      enabled: true
      platform_name: 豆瓣
      adapter_status: implemented_multi_channel
      probe_status: unknown
      out_dir: data/language_fuel/douban
      default_limit: 10
      request_interval_sec: 1.0
      require_target: true
      channels:
        movie:
          enabled: true
          domain: film
          domain_name: 影视
          source_kind: long_review
          content_focus: searched_movie_full_reviews
        book:
          enabled: true
          domain: book
          domain_name: 读书
          source_kind: long_review
          content_focus: searched_book_full_reviews
        music:
          enabled: true
          domain: music
          domain_name: 音乐
          source_kind: long_review
          content_focus: searched_music_full_reviews
        group:
          enabled: true
          domain: community
          domain_name: 小组
          source_kind: group_topic
          content_focus: whitelisted_group_topics_and_replies
          require_whitelist: true
          group_whitelist: []
    music:
      netease:
        enabled: true
        platform_name: 网易云音乐
        source_kind: short_comment
        content_focus: song_listener_comments
        adapter_status: implemented
        probe_status: unknown
        out_dir: data/music/netease
        page_size: 20
        default_comment_limit: 100
        request_interval_sec: 0.8
