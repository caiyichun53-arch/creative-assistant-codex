# Copy to config/settings.yaml and adjust local paths before running.

paths:
  db: data/formal/clean_room_v0_6_2.sqlite3
  vault: vault
  raw: data/formal/raw
  drafts: data/formal/drafts
  logs: logs

storage:
  formal_engine: postgresql
  database_url_env: CREATION_ASSISTANT_DATABASE_URL
  local_validation_engine: sqlite
  local_validation_db: data/formal/clean_room_v0_6_2.sqlite3
  sqlite_schema_chain:
    - scripts/core/persistence/goal01_schema.sqlite.sql
    - scripts/core/persistence/goal02_schema.sqlite.sql
    - scripts/core/persistence/goal03_schema.sqlite.sql
    - scripts/core/runtime/goal_runtime_vertical_slice_schema.sqlite.sql
  postgres_schema_chain:
    - scripts/core/persistence/goal01_schema.postgres.sql
    - scripts/core/persistence/goal02_schema.postgres.sql
    - scripts/core/persistence/goal03_schema.postgres.sql
    - scripts/core/runtime/goal_runtime_vertical_slice_schema.postgres.sql

legacy_runtime:
  enabled: false
  allow_env: CREATION_ASSISTANT_ENABLE_LEGACY_RUNTIME
  status: removed_from_active_repository
  runtime_authority: false

llm:
  model_routes: config/model_routes.yaml
  business_route_registry: BUSINESS_MODEL_ROUTE_REGISTRY.yaml
  direct_cli_runtime_authority: false
  fallback_enabled: false

hit_detection:
  # 2026-07-07: this whole block was rewritten from scratch after reconciling
  # against 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.md (now
  # committed to the repo root). See BUSINESS_RULE_CATALOG.yaml BR-HIT-001
  # amendment_2026_07_07_master_doc_realignment for the full decision trail --
  # every value below traces to a specific line in that amendment, not to
  # guesswork. The prior excess_threshold/hit_floor_absolute_like_count/
  # early_excess_threshold/baseline_min_samples/baseline_window_days/
  # first_crawl_fetch_buffer keys are gone; nothing here is a renamed
  # continuation of them, this is a different formula.
  observe_days: 7
  # BR-HIT-001 section A: a formal_new video only ever joins the formal D
  # baseline if publish_time -> first-discovery gap is within this many hours.
  discovery_delay_hours_max: 36
  # BR-HIT-001 section C(1): mature history baseline pool = this account's
  # videos published within the trailing N days, capped at M, one cumulative
  # snapshot per video, rolling (recomputed from current data each time it is
  # needed, no separate top-up algorithm).
  mature_history_window_days: 90
  mature_history_max_samples: 50
  # BR-HIT-001 section C: the user overrode the document's literal "each
  # metric needs >=5 non-null samples" with one unified floor used everywhere
  # in this rule (mature history baseline AND formal D baseline activation).
  unified_min_samples: 20
  # BR-HIT-001 section C(3): "20" in the document literally meant two
  # different things -- an activation gate AND (separately) the ongoing
  # per-D-point computation window. The user determined only the
  # activation-gate meaning survives; the ongoing window is corrected to
  # align with mature_history_max_samples instead of staying fixed at 20
  # forever.
  formal_baseline_activation_min_samples: 20
  formal_baseline_computation_window: 50
  # BR-HIT-001 section D: five OR-ed trigger channels once the relevant
  # formal baseline is active. Single-metric channels (like/comment/collect/
  # share, each independently) share one threshold; the multi-indicator combo
  # channel (>=2 of those 4 metrics each clearing THIS lower bar) is
  # deliberately lower since requiring two simultaneous metrics is already a
  # stricter condition than requiring one.
  single_metric_excess_threshold: 2.0
  multi_indicator_excess_threshold: 1.6
  # 2026-07-08 user decision: the mature-history/rough channel (used for BOTH
  # first-registration hits on historical_mature/transition videos AND the D7
  # cold-start case) is now DELIBERATELY stricter than the formal_d_series
  # channel above -- 3.0x/2.0x instead of 2.0x/1.6x. This is not an accident:
  # comparing a video's cumulative value against a coarse account-wide median
  # (mixed maturities, no day-of-life alignment) is a noisier comparison than
  # the formal D baseline's same-day-point median, so it needs a higher bar to
  # compensate for the weaker evidence quality, not a lower one. Verified by
  # testing 3.0x/2.0x against the real 28-account dataset before adoption:
  # dropped the mature-history-channel hit count from 532 (at the old 2.0x/1.6x)
  # to 262 via the normal path, plus 18 via the small-account P90 path below.
  cold_start_d7_single_metric_threshold: 3.0
  cold_start_d7_multi_indicator_threshold: 2.0
  # 2026-07-08 user decision: a video's own like_count must clear this absolute
  # floor to qualify via the mature-history/rough channel's NORMAL path (below),
  # regardless of how many times its account's median it clears -- stops a tiny
  # account's tiny numbers from reading as a "hit" just because they are a large
  # multiple of an equally tiny median. Does NOT apply to comment_like_ratio
  # (that channel is ratio-based by design, already separately verified against
  # real data) and does NOT apply to formal_d_series (untested/unchanged).
  mature_history_absolute_like_floor: 2000
  # 2026-07-08 user decision: an account is "small" for this channel's purposes
  # when even its best-case comparison (median * cold_start_d7_single_metric_threshold)
  # could never reach mature_history_absolute_like_floor -- for those accounts the
  # fixed floor would structurally lock them out forever, so they get a
  # different bar instead: their OWN like_count distribution's P90 (see
  # small_account_p90_percentile). A hit produced this way is always labelled
  # p90_small_account so it is never confused with the normal-path evidence
  # caliber. Verified against real data: 4/23 evaluable accounts qualified as
  # small, producing 18 hits via this path that the normal path could not reach.
  small_account_p90_percentile: 0.9
  # BR-HIT-001 section D(6): the one channel kept from the pre-realignment
  # week that has no counterpart in the master document at all -- computed
  # purely from the candidate video's own comment_count/like_count, no
  # baseline required. Verified against the real 28-account/1253-video
  # dataset before adoption (see the superseded amendment_2026_07_07 block in
  # BUSINESS_RULE_CATALOG.yaml for the actual 15/18/20 percent comparison).
  comment_like_ratio_threshold: 0.2
  # How many videos the first crawl fetches. Not tied to any sample-count
  # target anymore (the mature history baseline is a rolling 90-day/50-cap
  # window, not a fixed target to hit on day one) -- this just needs to be
  # comfortably above mature_history_max_samples so a small number of
  # unparseable-publish-time items don't structurally starve the window.
  first_crawl_max_notes: 50
  first_crawl_fetch_buffer: 5
  recheck_interval_hours: 24

candidate_pool:
  decay_half_life_days: 7
  expire_heat: 0.1
  reheat_boost: 0.5

reverse_engine:
  # Local model root. Keep real absolute paths in config/settings.yaml only.
  models_root: models
  asr_model: sensevoice/sensevoice-small
  vad_model: modelscope_cache/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
  min_transcript_chars: 80
  # BR-COLLECT-005/006: comments collected in the same detail crawl used for
  # the download URL, then deterministically filtered (no LLM) before storage.
  top_comments: 60
  min_comment_len: 5

humanize:
  # Local source corpus path. Leave empty until configured.
  corpus_dir: ""
  chunk_chars: 60000
  reduce_chars: 80000
  out_dir: data/humanize

crawler:
  daily_max_notes: 20
  rate_limit_jitter_sec: [3, 10]
  incremental: true

language_fuel:
  vault_dir: 语感燃料
  default_write_obsidian: true
  adapters:
    mediacrawler:
      enabled: true
      adapter_status: vendor_available
      platforms: [xhs, douyin, kuaishou, bilibili, weibo, tieba, zhihu]
      source_kind_by_platform:
        xhs: post
        douyin: short_comment
        kuaishou: short_comment
        bilibili: short_comment
        weibo: post
        tieba: post
        zhihu: article_or_answer
  platforms:
    douban:
      enabled: true
      platform_name: 豆瓣
      adapter_status: implemented_multi_channel
      probe_status: unknown
      out_dir: data/language_fuel/douban
      default_limit: 10
      request_interval_sec: 1.0
      require_target: true
      channels:
        movie:
          enabled: true
          domain: film
          domain_name: 影视
          source_kind: long_review
          content_focus: searched_movie_full_reviews
        book:
          enabled: true
          domain: book
          domain_name: 读书
          source_kind: long_review
          content_focus: searched_book_full_reviews
        music:
          enabled: true
          domain: music
          domain_name: 音乐
          source_kind: long_review
          content_focus: searched_music_full_reviews
        group:
          enabled: true
          domain: community
          domain_name: 小组
          source_kind: group_topic
          content_focus: whitelisted_group_topics_and_replies
          require_whitelist: true
          group_whitelist: []
    music:
      netease:
        enabled: true
        platform_name: 网易云音乐
        source_kind: short_comment
        content_focus: song_listener_comments
        adapter_status: implemented
        probe_status: unknown
        out_dir: data/music/netease
        page_size: 20
        default_comment_limit: 100
        request_interval_sec: 0.8
