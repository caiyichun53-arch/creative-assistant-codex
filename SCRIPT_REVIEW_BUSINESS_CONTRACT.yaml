schema_version: script_review.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: script_review
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Review a generated script, produce a polished revision, and judge AI-flavor risk before deterministic checks.
non_responsibilities:
  - script_generate
  - content_plan
  - banned_word_check
  - publication
  - experience_writeback
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - draft_text
    - brief
    - evidence_items
    - human_reference_refs
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
review_policy:
  consumes_supplied_draft_only: true
  must_not_fetch_or_verify_externally: true
  must_not_run_banned_word_check: true
  must_not_publish: true
  must_not_write_experience: true
  review_subnode_route: business.creation_review
  polish_subnode_route: business.creation_polish
  ai_flavor_subnode_route: business.ai_flavor_judge
evidence_requirements:
  evidence_items_min: 1
  evidence_items_max: 12
  human_reference_refs_min: 1
  human_reference_refs_max: 8
  issues_max: 8
  revision_targets_max: 8
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  draft_text_max: 6000
  brief_max: 3000
context_budget:
  max_input_tokens: 12000
token_budget:
  max_output_tokens: 4500
timeout:
  milliseconds: 120000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: script_review:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - empty_polished_text
    - empty_revision_targets
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - all_three_subnodes_use_model_gateway
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.creation_review
  - business.creation_polish
  - business.ai_flavor_judge
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
review_model_output_schema:
  type: object
  required:
    - verdict
    - issues
    - schema_version
  properties:
    verdict:
      type: string
      enum:
        - pass
        - revise
        - fail
    issues:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: script_review.review_output.v1
  additional_properties: false
polish_model_output_schema:
  type: object
  required:
    - polished_text
    - schema_version
  properties:
    polished_text:
      type: string
      minLength: 50
      maxLength: 6000
    schema_version:
      type: string
      const: script_review.polish_output.v1
  additional_properties: false
ai_flavor_model_output_schema:
  type: object
  required:
    - ai_flavor_risk
    - revision_targets
    - schema_version
  properties:
    ai_flavor_risk:
      type: string
      enum:
        - low
        - medium
        - high
    revision_targets:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: script_review.ai_flavor_output.v1
  additional_properties: false
model_binding:
  route_name: business.creation_review
  route_id: writing_generation
  binding_name: script_review_public_input_to_review_polish_ai_flavor
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    draft_text:
      source: input
      key: draft_text
    brief:
      source: input
      key: brief
  model_input_schema:
    type: object
    required:
      - fixture_id
      - draft_text
      - brief
    properties:
      fixture_id: string
      draft_text: string
      brief: string
    additional_properties: false
  prompt_template: >-
    Use only the approved script_review subnodes. First review the supplied
    draft, then polish from review issues, then judge AI-flavor risk on the
    polished text. Do not run deterministic banned-word checks, publish, write
    files, fetch sources, or call another Skill.
  model_output_schema:
    type: object
    required:
      - verdict
      - issues
      - polished_text
      - ai_flavor_risk
      - revision_targets
      - schema_version
    properties:
      verdict: string
      issues: array
      polished_text: string
      ai_flavor_risk: string
      revision_targets: array
      schema_version: string
    additional_properties: false
  output_map:
    verdict:
      source: model_output
      key: verdict
    issues:
      source: model_output
      key: issues
    polished_text:
      source: model_output
      key: polished_text
    ai_flavor_risk:
      source: model_output
      key: ai_flavor_risk
    revision_targets:
      source: model_output
      key: revision_targets
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - draft_text
    - brief
    - evidence_items
    - human_reference_refs
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    draft_text:
      type: string
      minLength: 50
      maxLength: 6000
    brief:
      type: string
      minLength: 1
      maxLength: 3000
    evidence_items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
    human_reference_refs:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: script_review.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - verdict
    - issues
    - polished_text
    - ai_flavor_risk
    - revision_targets
    - schema_version
  properties:
    verdict:
      type: string
      enum:
        - pass
        - revise
        - fail
    issues:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    polished_text:
      type: string
      minLength: 50
      maxLength: 6000
    ai_flavor_risk:
      type: string
      enum:
        - low
        - medium
        - high
    revision_targets:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: script_review.output.v1
  additional_properties: false
