business_data_competitor_registration_execution:
  status: implemented_and_verified
  updated_at: '2026-07-07T00:00:00Z'
  note: This block did not exist when scripts/core/business_data was first built --
    the traceability entries above were frozen at GOAL-ALIGNMENT-01 (2026-07-02),
    before this code existed, and were never re-run against it. That gap let a
    fabricated baseline_min_judgement_samples=10 threshold (present in neither the
    legacy system nor BUSINESS_RULE_CATALOG.yaml, which documents 30) ship
    unnoticed. Fixed 2026-07-06; see tests/validation/test_business_rule_traceability.py
    for the now-enforced check.
  amendment_2026_07_06_br_hit_001: User-decided change to the hit threshold formula
    (see BUSINESS_RULE_CATALOG.yaml BR-HIT-001 amendment_2026_07_06) -- P90 is no
    longer a bare unbounded OR-ed term (it mechanically capped 23/28 real accounts
    at exactly 2 hits regardless of true distribution); it is now bounded by a new
    configurable hit_floor_absolute_like_count (2000). Re-ran the corrected formula
    against the real production database via --rejudge-only and verified results.
  amendment_2026_07_07_br_hit_001_ratio_channel: User-decided second OR-ed hit channel
    (see BUSINESS_RULE_CATALOG.yaml BR-HIT-001 amendment_2026_07_07) -- comment_count/
    like_count >= comment_like_ratio_threshold (0.2) now also qualifies a video as a
    hit, independent of the like_count channel. hits.hit_channel records which
    channel(s) fired. Added because the like-only formula left one real account
    (财经不眠姐) with zero hits; the new channel is sourced from published Douyin
    operator guidance (not an internally-computed percentile) and was checked against
    the real 28-account/1253-video dataset at 10/15/18/20/30% before 20% was chosen.
    Re-ran via --rejudge-only against the real production database and verified.
  amendment_2026_07_07_daily_incremental: Built BR-COLLECT-002/004 (BUILD_PLAN.md
    阶段1/2, 2026-06-13 decisions -- not a new design, an existing one that had
    never been implemented against this clean-room module). Added
    ingest_daily_incremental_items() (new discoveries within observe_days enter
    'watching'; existing rows get metrics updated + a video_checks snapshot appended,
    reconciled before new discoveries per agreed order; only an explicit platform
    pinned flag routes a new discovery to archived+excluded, no positional guessing)
    and run_daily_incremental() (contract-gated entrypoint wiring crawl+ingest+judge_domain
    together, validates crawler.daily_max_notes). Also fixed a real bug found while
    building this -- 'younger_than_7_days' had been implemented as a PERMANENT
    judgement exclusion, contradicting BUILD_PLAN.md's own "其计数照样每日刷新+每轮重判,
    不吃亏" -- broadened the settled-sample query (status IN (...,'watching') and
    excluded_reason IN (...,'younger_than_7_days')) so a row flows through once
    select_baseline_sample's own live age-check confirms it has genuinely aged past
    the window; only 'pinned' remains a real permanent exclusion. (This entry originally
    said no early judgement is performed on still-watching videos, citing BUILD_PLAN.md
    -- that specific point has since been reversed, see amendment_2026_07_07_early_promotion
    below; BUILD_PLAN.md itself was deleted the same day for describing the retired
    legacy system, not current design.)
  amendment_2026_07_07_early_promotion: User-decided reversal (see BUSINESS_RULE_CATALOG.yaml
    BR-HIT-001 amendment_2026_07_07_early_promotion) -- the "no early judgement, wait
    until exit" behavior above had been borrowed from BUILD_PLAN.md (retired legacy
    system's build log) without independent confirmation, and BUSINESS_DECISION_TABLES.md
    (the actual current GOAL-ALIGNMENT-01 decision record) doesn't state either way.
    judge_account() now also checks every currently 'watching' row (any age) against
    the already-computed hit thresholds on every judgement pass; a video that clears
    either channel is promoted immediately instead of waiting for it to age out. Reuses
    the existing validated hit criteria -- not a new growth-curve/steepness model (no
    historical trajectory data exists yet to calibrate one). Verified with 2 new tests
    (early promotion fires when the bar is cleared; a still-young video that hasn't
    cleared it stays 'watching').
  amendment_2026_07_07_excess_threshold_2x: 'User directly overruled excess_threshold=3.0
    for the mature/settled channel too, not just the new day-reference channel -- 3x
    pulls the standard too high for large accounts. Lowered to 2.0 in both config
    files (see BUSINESS_RULE_CATALOG.yaml BR-HIT-001 amendment_2026_07_07_excess_threshold_2x).
    Re-ran via --rejudge-only against the real production database immediately: 198
    -> 245 hits (+47), 28/28 accounts still have >=1 hit (none zeroed), per-account
    range 1-17 hits (no degenerate blowout), hit_channel distribution shifted to
    like_threshold=177/comment_like_ratio=43/both=25 (was 130/48/20) -- consistent
    with a lower bar, not a broken formula.'
  amendment_2026_07_07_day_reference_channel: 'User pushed further -- comparing a
    still-young video against the MATURE threshold (calibrated for >=7 day-old
    videos) rarely fires this early, which defeats the point. Added
    _account_day_reference_median() (median like_count across this account''s other
    videos'' video_checks history at the SAME day-offset since publish; returns None
    below DAY_REFERENCE_MIN_SAMPLES=3, channel is skipped rather than fabricating a
    reference) and a new config value early_excess_threshold=2.0 (deliberately lower
    than excess_threshold=3.0, same reasoning as excess_threshold itself -- user''s
    words, a 3x bar pulls the standard too high for large accounts). A still-watching
    video with no other qualifying channel is promoted if its current like_count
    clears early_excess_threshold times the day-specific median. Recorded as
    hit_channel=''like_threshold'' (not a new enum value, avoids migrating the CHECK
    constraint on the real production hits table); promoted_via_day_reference_count
    is the source of truth for this channel''s hit count. Verified with 2 new tests
    (promotes when enough day-specific history exists and the bar is cleared; skipped
    -- stays watching -- when there''s insufficient day-specific history). Not yet
    exercised against real data: video_checks was only just created and daily
    incremental has never run for real, so there is no real day-specific history yet
    for this channel to use.'
  amendment_2026_07_07_master_doc_realignment: 'Whole business_data hit-detection
    engine rewritten from scratch against 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_
    无损汇编版.md (now committed to the repo root) -- see BUSINESS_RULE_CATALOG.yaml
    BR-HIT-001 amendment_2026_07_07_master_doc_realignment for the full decision
    trail. This replaced, not incrementally patched: discovery-anchored D0-D7 (not
    calendar days), the three-category first-contact classification (historical_
    mature/transition/formal_new, replacing the watching/archived/promoted status
    machine), four baselines (mature_history rolling 90d/50cap/unified_min_samples=20,
    cold_start_d7_rough, formal_d_series 20-activate/50-window, formal_p_series kept
    but unused pending experience-layer design), the six OR-ed trigger channels
    (like/comment/collect/share anomaly at 2.0x, multi_indicator at 1.6x,
    comment_like_ratio kept from the prior iteration), and permanent candidate
    records (BR-HIT-005: never retract once first triggered). Explicitly deferred,
    not built this pass (see BUSINESS_RULE_CATALOG.yaml BR-HIT-002/006/007): control/
    counter-example sample recall, five-tier LLM-cost-gated processing, and
    purpose-tagged comment collection -- none of these have a comment-collection
    pipeline to hook into yet in this codebase, so building them now would be
    speculative scaffolding.'
  amendment_2026_07_08_backfill_counting_and_daily_refresh: 'Three fixes from one
    real-data question (why an account with six-figure like counts had zero hits):
    (1) _mature_history_pool() reinstates a narrowly-scoped version of the
    legacy_supplement/backfill-outside-the-90-day-window mechanism this same file''s
    old BR-BASELINE-003 entry above flags as an unresolved "conflict" -- now
    resolved: backfill only applies when the account''s FULL lifetime pool has
    >= unified_min_samples(20) videos AND is high-magnitude by the same yardstick
    _account_small_status already uses, otherwise behavior is unchanged. (2)
    judge_account()''s rough_hit_count/formal_hit_count are now tallied from
    baseline_mode (never overwritten) instead of judgment_confidence (which gets
    overwritten to "formal" when comment_like_ratio also fires on a video that
    already cleared mature_history) -- a real reporting bug that undercounted rough
    hits by 30 videos in the live 28-account dataset; the persisted hits/
    competitor_videos records were always correct, only the run-report tally was
    wrong. (3) ingest_daily_incremental_items() now refreshes a transition video''s
    numbers and records a video_checks row on every daily pass while it has not yet
    matured (previously frozen at its first-contact snapshot until day 7), matching
    formal_new''s existing daily cadence -- no age-gate was added to any channel,
    per explicit user decision to keep this simple. See BUSINESS_RULE_CATALOG.yaml
    amendment_2026_07_08_backfill_counting_and_daily_refresh for the full decision
    trail and BR-BASELINE-003''s current status (unified_min_samples=20 remains
    authoritative; this only widens WHICH videos can be pooled to reach it).'
  amendment_2026_07_08_day_since_publish_column: 'Follow-up: video_checks.
    day_since_publish (nullable INTEGER) added so a transition video''s daily
    checks record which day of its own 0-7 lifecycle each one happened on --
    deliberately separate from discovery_batch_index (discovery-batch-anchored,
    formal_new only). register_competitor_accounts.install_schema() now lazily
    ALTER TABLE ADD COLUMNs this onto any existing DB (CREATE TABLE IF NOT EXISTS
    does not retroactively add columns) -- applied to the real production DB via
    --rejudge-only. See BUSINESS_RULE_CATALOG.yaml
    amendment_2026_07_08_day_since_publish_column for the full trail.'
  requirement_alignment:
    BR-COLLECT-001: exact_match
    BR-COLLECT-002: exact_match
    BR-COLLECT-003: exact_match
