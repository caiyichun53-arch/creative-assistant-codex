schema_version: script_generate.business_contract.v1
governance_basis: docs/EFFECTIVE_DESIGN_BASELINE.md
status: active_formal_business_contract
skill_id: script_generate
skill_version: 1.0.0
source_documents:
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - runtime_skills/script_generate/skill.yaml
responsibility: Generate one draft script from supplied content plan, brief, and research summary.
non_responsibilities:
  - content_plan
  - production_research_plan
  - script_review
  - script_polish
  - ai_flavor_judge
  - banned_word_check
  - publication
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - brief
    - selected_hook
    - beats
    - research_summary
    - evidence_items
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
generation_policy:
  consumes_supplied_plan_only: true
  must_not_fetch_or_verify_externally: true
  must_not_review_or_polish: true
  must_not_run_banned_word_check: true
  must_not_call_other_skills: true
  draft_must_use_selected_hook: true
  draft_must_follow_beats: true
evidence_requirements:
  beats_min: 1
  beats_max: 8
  evidence_items_min: 1
  evidence_items_max: 12
  output_draft_min_length: 50
  output_draft_max_length: 6000
timeout:
  milliseconds: 120000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: script_generate:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
    - empty_draft
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.creation_draft
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.creation_draft
  route_id: writing_generation
  binding_name: script_generate_public_input_to_creation_draft
  binding_version: 1.0.0
  # 2026-07-11: input_map/model_input_schema previously only forwarded
  # outline/brief to the model -- selected_hook, evidence_items, and
  # research_summary were all required in the public input_schema (a real
  # caller must supply them) but silently dropped before ever reaching the
  # model. This broke generation_policy.draft_must_use_selected_hook (the
  # model was never told what the hook was) and left the model with no real
  # evidence to ground factual claims in. All three now flow through.
  input_map:
    fixture_id:
      source: input
      key: request_id
    outline:
      source: input
      key: beats
    brief:
      source: input
      key: brief
    selected_hook:
      source: input
      key: selected_hook
    evidence_items:
      source: input
      key: evidence_items
    research_summary:
      source: input
      key: research_summary
  model_input_schema:
    type: object
    required:
      - fixture_id
      - outline
      - brief
      - selected_hook
      - evidence_items
      - research_summary
    properties:
      fixture_id: string
      outline:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: string
          minLength: 1
      brief:
        type: string
        minLength: 1
      selected_hook:
        type: string
        minLength: 1
      evidence_items:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: object
      research_summary:
        type: string
        minLength: 1
    additional_properties: false
  # 2026-07-11: rewritten from a one-line "return JSON, don't do X" template.
  # Real production data review found the old prompt gave the model zero
  # guidance on output language, register, or how to use the (previously
  # missing) selected_hook/evidence_items. This is a Douyin spoken-narration
  # script generator; the prompt now says so explicitly, requires Simplified
  # Chinese conversational register (not written/formal Chinese), requires
  # the exact supplied hook as the opening beat, requires following the
  # outline in order without skipping or adding beats, requires grounding
  # claims in evidence_items rather than inventing facts, and names concrete
  # AI-writing tells to avoid (formulaic 首先/其次/最后 transitions, hedging,
  # repeated sentence structure, filler recaps) instead of leaving "sound
  # natural" unstated.
  prompt_template: >-
    You are writing a spoken-narration script (口播文案) for a Chinese
    short-video platform (抖音). Return only JSON with keys draft_text and
    schema_version, schema_version must be script_generate.output.v1.

    Write draft_text entirely in natural, spoken Simplified Chinese -- the
    way a real person would say it out loud, not written or formal register.
    Do not use bullet points, numbered lists, or headers inside draft_text;
    it must read as one continuous spoken narration.

    The script must open with, or naturally build from, this exact hook as
    its opening beat -- do not invent a different opening:
    selected_hook={selected_hook}

    Follow this beat outline in order, one beat at a time; do not skip a
    beat and do not add beats beyond what is listed: outline={outline}

    Ground every factual claim in the supplied evidence; do not invent
    statistics, quotes, or facts that are not present here:
    evidence_items={evidence_items}

    Research context (may be a placeholder noting no formal research pass
    has run yet -- treat it as supplementary, not a license to fabricate
    beyond evidence_items): research_summary={research_summary}

    Overall creative direction: brief={brief}

    Avoid generic AI-writing tells: no formulaic transitions like
    首先/其次/最后 unless genuinely natural here, no hedging language, no
    repeating the same sentence structure back to back, no filler sentence
    that just restates what was already said. Write at a length natural for
    being read aloud for this content -- do not pad or artificially
    compress to hit a target length.

    Before answering, double check your JSON includes both keys --
    draft_text and schema_version set exactly to
    script_generate.output.v1. Do not omit schema_version.
  model_output_schema:
    type: object
    required:
      - draft_text
      - schema_version
    properties:
      draft_text:
        type: string
        minLength: 50
      schema_version:
        type: string
        const: script_generate.output.v1
    additional_properties: false
  output_map:
    draft_text:
      source: model_output
      key: draft_text
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - brief
    - selected_hook
    - beats
    - research_summary
    - evidence_items
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
    correlation_id:
      type: string
      minLength: 1
    brief:
      type: string
      minLength: 1
    selected_hook:
      type: string
      minLength: 1
    beats:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
    research_summary:
      type: string
      minLength: 1
    evidence_items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: script_generate.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - draft_text
    - schema_version
  properties:
    draft_text:
      type: string
      minLength: 50
    schema_version:
      type: string
      const: script_generate.output.v1
  additional_properties: false
