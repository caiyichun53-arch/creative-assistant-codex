schema_version: 1
goal: GOAL-ALIGNMENT-01
contracts:
- module: vendor/MediaCrawler; scripts/collect/common.py; scripts/collect/crawl_competitors.py;
    scripts/language_fuel/collect_mediacrawler.py; scripts/reverse/fetch_comments.py
  decision: wrap
  preserved_behavior:
  - Starts MediaCrawler subprocesses, parses output, archives raw files and upserts
    legacy SQLite records.
  - Preserve user-visible business result and deterministic thresholds/defaults unless
    traceability marks a conflict.
  removed_behavior:
  - Direct production state writes
  - Direct production external sends
  - Unrecorded model calls
  changed_behavior:
  - Inputs/outputs become explicit contract payloads
  - State changes move to Core/Materializer
  - Artifacts gain source hashes and correlation ids
  target_layer: collector_adapter
  input_contract:
    required:
    - source_ref or command envelope
    - domain/account context when applicable
    forbidden:
    - raw production secret
    - implicit current working directory as business input
  output_contract:
    required:
    - normalized payload or artifact reference
    - content/source hash when file/text is produced
    - status/verdict
    forbidden:
    - hidden DB mutation as output
  state_contract:
    owner: Core/Materializer
    legacy_state: read-only migration evidence
    idempotency_key: source-specific stable key or command id
  idempotency: Replaying the same source/command must not create duplicate business
    objects, sends or model artifacts.
  side_effect_contract:
    allowed:
    - declared adapter I/O for wrap modules
    - local projection after formal artifact exists
    forbidden:
    - production DB write
    - production message send
    - batch DNA generation during alignment
  error_contract: Failure returns typed error/receipt; partial adapter output is rejected
    before state advancement.
  related_requirement_ids:
  - BR-COLLECT-001
  - BR-COLLECT-002
  - BR-COLLECT-003
  - BR-COLLECT-004
  - BR-COLLECT-005
  - BR-COLLECT-006
  - BR-COLLECT-007
  - BR-BASELINE-001
  migration_tests:
  - Replay saved JSONL fixture
  - Assert normalized output and no state write before Materializer
  unresolved_conflicts:
  - Direct DB writes
  - No adapter result contract
  clean_room_contract:
    production_must_not_read:
    - data/creation.db
    - legacy data directories
    - cold archive
    - test fixtures
    startup_assumption: empty formal database
    fixture_access: test environment only
