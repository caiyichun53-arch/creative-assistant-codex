  amendment_2026_07_08_day_since_publish_column:
    decided_by: user
    reason: 'Follow-up question after amendment_2026_07_08_backfill_counting_and_
      daily_refresh: now that transition videos are checked daily during their 0-7
      day observation, WHERE is which day of that lifecycle actually recorded?
      video_checks.discovery_batch_index only carries D0-D7 discovery-batch-anchored
      semantics for formal_new videos (explicitly documented as "not a calendar-day
      count since publish") -- it was NULL for every transition check, so there was
      no way to tell, from the table itself, which day of a transition video''s life
      a given row corresponded to (only derivable indirectly from checked_at minus
      publish_time). The user chose to add an explicit column rather than leave it
      derivable-only.'
    change: 'Added video_checks.day_since_publish (nullable INTEGER), deliberately a
      separate column from discovery_batch_index so the two anchoring schemes (
      discovery-batch vs calendar-day-since-publish) are never conflated in the same
      field. Populated for historical_mature/transition video_checks rows only (the
      first-contact snapshot in ingest_stock_items, and every daily-refresh/matured
      snapshot in ingest_daily_incremental_items) via a new _day_since_publish()
      helper -- (now - publish_time).days. Left NULL for formal_new rows, which
      already have discovery_batch_index for this purpose; adding it there too was
      out of scope for what was asked. register_competitor_accounts.install_schema()
      now also lazily ALTER TABLE ADD COLUMNs any missing nullable column (currently
      just this one) on every call via a new _ensure_column() helper, since CREATE
      TABLE IF NOT EXISTS does not retroactively add columns to an existing table
      (e.g. the real production DB) -- applied for real via --rejudge-only, which
      calls install_schema() before judging; verified the column now exists on
      data/formal/production_activation.sqlite3. Verified with 1 new test (a
      transition video checked 2 days after publish records day_since_publish=2 and
      discovery_batch_index=NULL).'
  superseded_amendments_kept_as_audit_trail_only:
    note: 'Everything below this point describes the mid-week (2026-07-06 /
