- requirement_id: BR-BASELINE-002
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 历史基线与Day7口径
  priority: P0
  domain_scope: all domains
  status: '2026-07-07: superseded in detail by BR-HIT-001 sections B/C -- there is
    no observation window to "leave"; a transition video takes a second snapshot at
    exactly day 7 (not an ongoing re-crawl), and a formal_new video''s D0-D7 series
