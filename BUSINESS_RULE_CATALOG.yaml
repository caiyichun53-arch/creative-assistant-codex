  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 评论采集 (第16章，2026-07-07 新增)
  priority: P1
  domain_scope: all domains
  status: 'New 2026-07-07: this rule did not previously exist in the catalog. Added
    per user instruction to backfill every item flagged in the master-doc
    reconciliation pass. CLAUDE.md''s "MC 抓评论" is a simplified gloss over this
    more precise design -- this rule is the actual spec.'
  trigger: a candidate video enters early lightweight processing, D7/P+7d wrap-up,
    mature full processing, or a tag-searched external video enters full processing
    or topic validation
  inputs:
  - video type / timing (which BR-HIT-006 tier it is in)
  - purpose tag (early_topic / mature_analysis / mature_history / external_snapshot)
  expected_behavior: 'Sampling strategy keyed to video type/timing, each producing a
    tagged purpose: formal D/P video''s first early trigger -> collect the top 60
    first-level comments by the collector''s own popularity ranking, purpose=early_topic,
    to identify follow-up questions/controversy/expansion directions. The same
    candidate reaching D7/P+7d needing mature processing -> collect another (fresh)
    top 60, purpose=mature_analysis, for mature analysis and the standard sample
    package (BR-HIT-002). A video that only first formally triggers at D7/P+7d ->
    collect one purpose=mature_analysis batch only, no earlier batch (avoids
    duplication). Cold-start rough signal or historical-high-signal video -> collect
    ONE batch, purpose=mature_history, only if topic validation or manual research
    actually needs it -- this is weak evidence, not equivalent to a real formal D7
    trigger. Tag-search external video -> collect one batch, purpose=external_snapshot,
    only on entering full processing or topic validation -- external signal, never
    labelled as if it were this account''s own D7. If fewer than 60 comments actually
    exist, save the actual count. First-level comments only in phase one -- second-level
    (reply) comments are NOT collected during any of the above. Preserve the
    collector''s own popularity ordering and sample_rank. Empty-text comments are not
    stored. Do not build commenter profiles, and do not present "share of sampled
    popular comments" as if it were "share of the actual audience." A unique
    constraint on (video, purpose, observation_point, sampling_strategy) enforces
    idempotent retries -- re-running the same collection step must not create a
    duplicate batch.'
  defaults:
    comments_per_batch: 60
    reply_comments_collected_in_phase_one: false
  thresholds:
    comments_per_batch: 60
  timing_semantics: Each purpose tag is collected at its own specific trigger point
    (see expected_behavior); mature_analysis may run twice for the same video
    (early + mature) but is otherwise a fresh collection each time, not an update
    to the earlier batch.
  state_effects:
  - comment batch insert (per video, purpose, observation_point, sampling_strategy)
  allowed_side_effects: []
  forbidden_behavior:
  - collecting second-level/reply comments in phase one
  - building commenter profiles
  - presenting popular-comment-sample share as audience share
  - creating a duplicate batch for the same (video, purpose, observation_point,
    sampling_strategy)
  - labelling external_snapshot or mature_history evidence as if it were a real D7
    trigger
  edge_cases:
  - fewer than 60 comments exist -- save actual count, do not pad or fabricate
  - empty-text comment -- excluded from storage
  - retrying the same collection step -- must be idempotent via the unique
    constraint, not create a second batch
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - purpose-tag routing fixture (one fixture per purpose tag, assert correct
    trigger point and count)
  - idempotent-retry fixture (same video/purpose/observation_point/strategy run
    twice, assert single batch)
  - under-60-actual-count fixture
