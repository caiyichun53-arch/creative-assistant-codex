      document''s ORIGINAL design did have a "legacy_supplement" backfill-outside-
      the-90-day-window mechanism (retired verbatim in BR-BASELINE-003''s status
      note) -- asking whether a narrower version should come back for exactly this
      kind of account. (2) Separately, the assistant misreported the post-bugfix
      real-data reconciliation (250 rough / 232 normal + 18 p90) when the true
      channel-fired count was 280 (262 normal + 18 p90, exactly matching the
      original dry-run prediction) -- root-caused to rough_hit_count/formal_hit_count
      being tallied from judgment_confidence, which gets overwritten to "formal"
      whenever comment_like_ratio ALSO fires on a video that already cleared the
      mature_history channel (30 such videos in the real dataset). (3) The user
      observed the real hit rate on still-observing transition videos looked high
      and asked whether videos under some minimum age (they suggested 3 days)
      should be excluded from judgement entirely; on reflection they decided
      against adding that age-gate complexity ("为了不麻烦，所有视频都要参与爆款判断")
      and instead identified the ACTUAL gap: transition videos were frozen at
      their first-contact snapshot for up to 6 days (ingest_daily_incremental_items
      only touched them once, at day 7 maturity) while formal_new videos already
      get refreshed every single day -- the user asked for transition videos to
      get the same daily-refresh cadence, with no age restriction on either.'
    change: '(A) _mature_history_pool() now returns (pool, used_backfill). When
      the in-window (90-day/50-cap) pool has fewer than unified_min_samples(20)
      videos, it additionally computes a full-lifetime pool (same historical_
      mature/matured-transition query, no window filter, still capped at
      mature_history_max_samples=50). Backfill (using the full-lifetime pool
      instead of the in-window one) applies ONLY when BOTH: the full-lifetime
      pool itself has >= unified_min_samples(20) videos ("历史视频够多"), AND its
      like_count median * cold_start_d7_single_metric_threshold >=
      mature_history_absolute_like_floor ("体量高" -- the same yardstick
      _account_small_status already uses, just evaluated against the full-lifetime
      pool instead of the in-window one). An account that is either lifetime-sparse
      or genuinely small-magnitude is NOT backfilled -- it stays exactly as
      underpowered as before amendment_2026_07_08_mature_history_channel_retuned.
      used_backfill is surfaced in judge_account()''s per-account report dict as
      mature_history_used_backfill (and aggregated as
      total_accounts_using_mature_history_backfill in judge_domain()) -- not
      written to any schema column, to avoid migrating the baseline_mode/
      hit_channel CHECK constraints (same precedent as
      amendment_2026_07_07_day_reference_channel not minting a new hit_channel
      enum value). (B) judge_account()''s rough_hit_count/formal_hit_count are now
      tallied from baseline_mode (which is never overwritten) instead of
      judgment_confidence (which the ratio_label branch overwrites to "formal"):
      a video counts toward rough_hit_count if baseline_mode==''mature_history'',
      and toward formal_hit_count if baseline_mode==''formal_d_series'' OR
      comment_like_ratio also fired -- a video firing both now correctly
      increments both counters (these are per-channel counts, not a partition;
      rough_hit_count + formal_hit_count can exceed promoted_count when a video
      clears more than one channel type). What gets WRITTEN to hits/
      competitor_videos.judgment_confidence is unchanged (still "formal" takes
      precedence when comment_like_ratio also clears, since it is independently
      strong evidence) -- only the run-report tally was wrong, not the persisted
      record. (C) ingest_daily_incremental_items()''s transition/not-yet-matured
      branch now updates like_count/comment_count/share_count/collect_count and
      records a video_checks row on EVERY daily pass (previously it did nothing
