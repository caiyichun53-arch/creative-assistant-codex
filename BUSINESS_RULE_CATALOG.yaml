  state_effects:
  - competitor_videos.mature_snapshot_taken_at set
  allowed_side_effects:
  - baseline recomputation
  forbidden_behavior:
  - periodic full re-crawl as baseline truth
  - fabricate a D-series for a transition video
  edge_cases:
