  priority: P0
  domain_scope: all domains
  status: '2026-07-08: local SenseVoice default empirically confirmed, not changed,
    per BR-ASR-003''s one-off comparison (see that entry''s outcome note below for
    the real-data result and root cause). Same day: the actual production reverse-prep
    path implementing this rule (not just the one-off comparison) was built and
    committed for the first time as scripts/core/business_data/run_reverse_prep.py --
    previously only BR-ASR-003''s benchmark tool existed, and it never touches
    hits.reverse_status. Cross-checked directly against the source document''s
    section 13 (not just this catalog entry, which was a narrower distillation)
    and extended the same day to match: raw_transcript/cleaned_transcript
    versioning (hit_transcripts is append-only, never overwritten), provenance
    (asr_model/vad_model/processing_method/audio_sha256 recorded per attempt),
    the pending/running/completed/failed status vocabulary, deterministic
    quality-anomaly flags (empty/too_short/high_repetition), and a best-effort
    5-tier processing-priority order (section 13.2) against what the schema can
    currently express. A real, separate bug was found and fixed in the same
    session: scripts/tools/
    _local_asr_transcribe.py let funasr/torchaudio''s own stdout notices leak
    into the captured transcript, and its subprocess stdout defaulted to the
    OS codepage instead of UTF-8, corrupting every non-ASCII character in a
    real stored transcript -- both fixed (stdout redirected during model
    load/generation, explicit UTF-8 reconfigure before the final write) and
    verified against real re-processed data.

    Same-day follow-up (explicit user decision: "爆款文案是要提取经验的,所以
    备料这里最后自动执行" -- a promoted hit is not useful for DNA/experience
    extraction until it has a transcript): run_full_registration()/
    run_rejudge_only()/run_daily_incremental() in run_competitor_registration_
    full.py now each call run_reverse_prep() synchronously right after
    judge_domain(), scoped via judgement_run_id to only the hits THAT
    judgement run just promoted (not the whole historical pending backlog).
    Judgement itself stays instant; the calling entry point now also waits for
    prep to finish (real network + local ASR per hit) before returning.'
  trigger: hit needs transcript
  inputs:
  - fresh download url
  - ASR model path
  expected_behavior: ASR is local deterministic/ML runtime used to produce transcript
    artifacts; it must not call LLM.
  defaults:
    provider: local SenseVoice
  thresholds: {}
  timing_semantics: Transcript generation happens before DNA analysis.
  state_effects:
  - transcript artifact reference
  - reverse_status may advance in legacy
  allowed_side_effects:
  - local temp audio
  - transcript file
  forbidden_behavior:
  - LLM transcript correction in formal path without ModelGateway
  - persist ephemeral download URL
  edge_cases:
  - download URL expired
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - GATE-ASR evidence
  - transcript hash fixture
