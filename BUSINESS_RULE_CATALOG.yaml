  source_section: 候选视频：提前触发与双阶段处理 -- 候选记录字段与永久保留 (第15.1/15.2章，2026-07-07 新增)
  priority: P1
  domain_scope: all domains
  status: 'New 2026-07-07: this rule did not previously exist in the catalog. Added
    per user instruction to backfill every item flagged in the master-doc
    reconciliation pass. Directly refines BR-HIT-001''s retraction/graduation
    removal -- see amendment below.'
  trigger: a video first clears any BR-HIT-001 trigger channel (becomes a candidate)
  inputs:
  - first_trigger_observation (the D/P point of first hit)
  - trigger_rules (cumulative list, not just the first one)
  - peak_observation
  expected_behavior: 'A candidate record carries: first_trigger_observation (the
    D/P point of first hit), first_trigger_at (timestamp), trigger_rules (the
    CUMULATIVE list of every rule that has ever fired for this video across all
    observation points, not only the first one), peak_observation (the D/P point
    where the video performed strongest relative to its baseline), baseline_mode
    (mature_history / formal_d_series / formal_p_series -- whichever baseline it
    was actually judged against), judgment_confidence (rough / formal),
    tracking_completed (has D7/P+7d been reached), light_process_status
    (pending/completed/failed -- video-level only; deep analysis is tracked
    separately per sample_id+domain_id, see BR-HIT-006), deep_eligibility
    (pending/eligible/not_eligible/manual -- resolved at D7/P+7d wrap-up, see
    BR-HIT-006). PERMANENCE RULE (verbatim from the document, stronger than merely
    "not mentioned"): once a video first formally triggers, its candidate record is
    KEPT even if its multiplier later falls back below threshold -- there is no
    retraction, no un-promotion, ever, once first triggered.'
  defaults: {}
  thresholds: {}
  timing_semantics: trigger_rules accumulates across every daily judgement pass for
    the life of the video; peak_observation and other derived fields may be updated
    on later passes, but the fact of first_trigger_observation/first_trigger_at and
    the historical trigger_rules entries already recorded are never deleted.
  state_effects:
  - candidate record insert/update (cumulative fields only ever grow, never shrink)
  allowed_side_effects: []
  forbidden_behavior:
  - retracting/un-promoting a candidate once first triggered, for any reason
    including a later multiplier drop
  - overwriting or deleting a prior trigger_rules entry when a later pass adds a
    new one
  - a watching/archived/promoted status-machine standing in for these fields (see
    BR-HIT-001 section F -- deleted, replaced by this rule)
  edge_cases:
  - video triggers on day 2, never triggers again, still needs a permanent record
    with judgment_confidence=rough or formal depending on baseline_mode at time of
    trigger
  - video triggers on multiple different D points via different rules -- trigger_rules
    must list all of them, not just the most recent
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - permanence fixture (trigger, then feed data that would no longer clear the bar,
    assert record is unchanged/kept)
  - cumulative trigger_rules fixture (two different rules fire on two different
    days, both remain listed)
- requirement_id: BR-HIT-006
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 候选视频：提前触发与双阶段处理 -- 分级处理与深度分析资格 (第15.3/15.4章，2026-07-07 新增)
  priority: P1
  domain_scope: all domains
  status: 'New 2026-07-07: this rule did not previously exist in the catalog. Added
    per user instruction to backfill every item flagged in the master-doc
    reconciliation pass. This is a cost-control gate on top of BR-HIT-001/BR-HIT-005
    -- most candidates are meant to stop at deterministic wrap-up, not automatically
    receive full LLM-based deep analysis.'
  trigger: a candidate record (BR-HIT-005) changes tier -- first trigger, D7/P+7d
    reached, or deep-eligibility resolved
  inputs:
  - candidate record fields (BR-HIT-005)
  - strong_peak threshold (default 5.0x, configurable)
  - user-selected production_task linkage, or manual research-sample flag
  expected_behavior: 'Five processing tiers, NOT a single one-shot pass: (1) early
    lightweight processing -- triggered when D0-D6 first hits a formal D/P candidate,
    or the user explicitly requests it; collects early comments (see BR-HIT-007) and
    extracts the original topic, follow-up questions, controversies, and expansion
    questions; purpose is to capture high-confidence early signal promptly. (2) D7/P+7d
    lightweight wrap-up -- runs for EVERY video that ever triggered candidate status,
    regardless of tier; freezes complete data, updates peak_observation and final
    status; does NOT call a high-cost LLM by default. (3) mature full processing --
    only for videos meeting the deep_eligibility conditions below; collects mature
    comments, recalls control/counter-example samples (BR-HIT-002), runs deep
    analysis, and may extract experience or mark a counter-example. (4) final-point
    first-formal-trigger -- a video that only first clears formal D/P at D7 or P+7d
    (never earlier) collects one mature_analysis comment batch and is judged against
    the deep_eligibility table below; only proceeds to full deep analysis if eligible.
    (5) cold-start rough signal -- no formal baseline active, D7 is merely anomalous
    vs. the mature history baseline; saves a rough signal, may seed a topic candidate,
    but does NOT auto-extract experience. DEEP-ELIGIBILITY TABLE (all conditions are
    independently sufficient, OR-ed): still clears a formal candidate rule at D7/P+7d
    -> eligible; an earlier peak reached strong_peak (default 5.0x, configurable) ->
    eligible; the video is linked to a user-selected production_task, or the user
    explicitly marked it as a research sample -> eligible; explicitly designated as a
    normal control, low-performer counter-example, or manual research sample (see
    BR-HIT-002) -> eligible. NOT eligible (default): only a weak early trigger, D7
    fell back below threshold, and no topic was generated from it -> deterministic
    wrap-up only, no deep analysis. Cold-start rough signal is NOT eligible by
    default -- exception only when a manual or formal topic-selection need specifically
    requires it.'
  defaults:
    strong_peak_multiplier: 5.0
  thresholds:
    strong_peak_multiplier: 5.0
  timing_semantics: Tier (1) runs at first D0-D6 formal trigger; tier (2) runs at
    every video''s D7/P+7d regardless of eligibility; tiers (3)/(4) run only after
    deep_eligibility resolves to eligible; tier (5) runs only for cold-start rough
    signals and never escalates to (3) automatically.
  state_effects:
  - light_process_status transition (BR-HIT-005 field)
  - deep_eligibility transition (BR-HIT-005 field)
  allowed_side_effects:
  - comment collection (BR-HIT-007)
  - control-sample recall (BR-HIT-002)
  forbidden_behavior:
  - calling a high-cost LLM during the D7/P+7d lightweight wrap-up by default
  - running full deep analysis on a video that does not meet any deep_eligibility
    condition
  - auto-extracting experience from a cold-start rough signal
  - treating every candidate as needing the same processing depth
  edge_cases:
  - video never reaches D7 (account paused/archived mid-tracking) -- wrap-up tier
    cannot run; record stays tracking_completed=false
  - strong_peak reached on an early day but D7 value falls back below the ordinary
    threshold -- still deep-eligible because of the earlier peak, not re-evaluated
    away
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - five-tier routing fixture (one video per tier, assert correct tier taken)
  - deep_eligibility OR-condition fixture (each of the four independently-sufficient
    conditions tested alone)
  - cold-start rough signal never auto-promotes to deep analysis fixture
