    per search, top 5 selected for deep processing, 3 consecutive cycles with
    no validated topic auto-pauses a tag. This entry did not exist before --
    the capability itself (MediaCrawler keyword search) was never wired in
    either, see scripts/core/external_adapters/local_mediacrawler_executor.py.'
  trigger: domain tag rotation search
  inputs:
  - domain_label
  - active tag
  expected_behavior: A due-for-rotation active tag triggers one real
    MediaCrawler keyword search (--keywords), reading up to 20 raw results,
    deterministically filtered (platform-id dedup, tag actually present in
    text) and ranked (search position + engagement, no formal baseline
    multiplier since discovered videos have no D-baseline), with the top 5
    stored for possible deeper processing. New tags discovered from the hit
    library enter status=suggested and require human confirmation (via
    review_queue.py) before becoming active.
  defaults:
    live_enabled: false
    rotation_days: 7
    search_read_max: 20
    deep_processing_max_per_tag: 5
    consecutive_cycles_before_pause: 3
    daily_deep_processing_max_per_domain: 10
  thresholds: {}
  timing_semantics: Each active tag is due once every rotation_days; a search
    cycle updates the tag''s rotation cursor regardless of outcome.
  state_effects:
  - domain_search_tags insert/update
  - domain_search_cursor update
  - discovered_external_videos insert
  allowed_side_effects:
  - platform read (real MediaCrawler search)
