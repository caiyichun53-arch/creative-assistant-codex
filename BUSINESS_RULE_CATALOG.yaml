  amendment_2026_07_08_backfill_counting_and_daily_refresh:
    decided_by: user
    reason: 'Three issues surfaced from a single real-data question ("why does
      账号小椰子专栏, with six-figure like counts, have zero hits?"), investigated one
      at a time: (1) the account has 55 lifetime historical_mature videos but only
