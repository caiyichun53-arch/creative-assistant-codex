    business.creation_polish as edit_notes (polish-fixes-what-review-found),
    the exact wrong order. Reordered so creation_polish runs first (standalone
    quality pass on the raw draft) and creation_review runs second (final gate
    on the polished text, together with business.ai_flavor_judge). This is
    realized as ONE new pipeline stage (script_reviews table, one
    run_script_review.py binding), not two separate database stages, because
    script_review is a single atomic Skill call that already bundles
    polish+review+ai_flavor together -- the document''s ordering requirement is
    satisfied by the call order WITHIN that one Skill, not by inventing a
    database-level split the real Skill boundary does not have.'
  trigger: an approved script_drafts row exists (human_review_status=''approved'')
  inputs:
  - draft_text
  - brief
  - evidence_items
  - human_reference_refs
  expected_behavior: run_script_review.py picks up approved, not-yet-reviewed
    drafts, calls runtime_skills/script_review (which internally runs polish
    before review before ai_flavor_judge), and persists the result to
    script_reviews with human_review_status=''pending_review''. A reviewed
    draft must not silently become the final draft.
  defaults: {}
  thresholds: {}
  timing_semantics: Runs after script_generate produces an approved draft, before
    a final_drafts row can exist.
  state_effects:
  - script_reviews insert
  allowed_side_effects: []
  forbidden_behavior:
  - review a draft before it is polished
  - skip the human review gate on script_reviews
  - auto-promote a script_reviews row to final_drafts
  edge_cases:
  - verdict=fail (script needs a full rewrite, not just polish)
  user_confirmation_required: true
  supersedes: []
  validation_required:
  - script_review runs after script_generate approval fixture
  - polish-before-review call order fixture
