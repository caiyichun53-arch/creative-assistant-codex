schema_version: 1
goal: GOAL-ALIGNMENT-01
source_scope:
- 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
- AGENTS.md
- BUILD_PLAN.md
- MIGRATION_EXECUTION_PLAN.md
- MODULE_REUSE_MATRIX.yaml
- legacy scripts/config/data read-only audit
rules:
- requirement_id: BR-DATA-RESET-001
  source_document: GOAL-DATA-RESET-01 user scope revision
  source_section: clean-room final freeze
  priority: P0
  domain_scope: all domains
  trigger: production startup or data reset validation
  inputs:
  - config/settings.yaml
  - formal V0.6.2 schema chain
  expected_behavior: Production starts from an empty formal database and never imports
    old business data, old DNA, old topics, old drafts, old model outputs or old
    runtime state.
  defaults:
    formal_engine: postgresql
    local_validation_db: data/formal/clean_room_v0_6_2.sqlite3
  state_effects:
  - legacy_runtime.enabled=false
  allowed_side_effects:
  - synthetic fixture load into isolated test database only
  - cold backup outside repository and production load paths
  forbidden_behavior:
  - read data/creation.db in production
  - load fixtures in production
  - migrate old SQLite records into formal tables
  - use legacy runtime fallback
  validation_required:
  - clean-room empty DB zero-row check
  - production startup without old paths
  - fixture production rejection
  - readiness --require-safe
- requirement_id: BR-COLLECT-001
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 竞品数据侧/注册存量视频
  priority: P0
  domain_scope: all domains
  trigger: register competitor account
  inputs:
  - competitor profile url or sec_uid
  - domain
  status: '2026-07-07: superseded in detail by BR-HIT-001 section B (three-category
    first-contact classification) -- there is no watching/archived status machine or
    observation pool anymore. Kept as a pointer, not duplicated.'
  expected_behavior: 'First crawl classifies every item into historical_mature or
    transition (never formal_new) per BR-HIT-001 section B; there is no watching
    observation pool to enter or avoid.'
  defaults:
    first_crawl_status: n/a (see BR-HIT-001 section B first_contact_category)
  thresholds:
    observe_days: 7
  timing_semantics: first_seen_at is discovery time; publish_time remains original
    platform publish time.
  state_effects:
  - competitor_videos.first_contact_category set (historical_mature or transition)
  allowed_side_effects:
  - collector raw archive
  - SQLite/source record in legacy only
  forbidden_behavior:
  - fabricate a D-series for a historical_mature or transition video
  - send external message during registration
  edge_cases:
  - missing publish_time
  - private/deleted video
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - 'fixture: first_seen_at - publish_time gap'
  - register idempotency test
- requirement_id: BR-COLLECT-002
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 竞品数据侧/日常增量观察池
  priority: P0
  domain_scope: all domains
  trigger: daily competitor crawl
  inputs:
  - newly discovered platform item
  - last_crawled_at
  status: '2026-07-07: superseded in detail by BR-HIT-001 section B -- a video newly
    discovered via the ongoing daily batch is classified first_contact_category=
    formal_new (D0 recorded now) regardless of its publish age; there is no more
    "watching" status or observation-window entry gate.'
  expected_behavior: A video newly discovered via the ongoing daily batch (not at
    registration) is classified formal_new and gets its D0 snapshot recorded immediately.
  defaults:
    daily_max_notes: config crawler.daily_max_notes
  thresholds:
    observe_days: 7
  timing_semantics: T+0 starts from publish_time for age, but first_seen_at records
    actual discovery.
  state_effects:
  - competitor_videos.first_contact_category=formal_new
  - video_checks D0 snapshot
  allowed_side_effects:
  - collector raw archive
  forbidden_behavior:
  - reclassify a registration-time stock item as formal_new
  - LLM decision for formal_new classification
  edge_cases:
  - publish_time absent uses discovery time only as fallback flag
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - watching subset replay
- requirement_id: BR-COLLECT-003
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 竞品数据侧/视频去重
  priority: P0
  domain_scope: all domains
  trigger: upsert video
  inputs:
  - competitor_id
  - platform_item_id
  expected_behavior: Video identity is platform item id scoped to competitor/source;
