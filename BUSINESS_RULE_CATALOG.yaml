  amendment_2026_07_07_early_promotion:
    decided_by: user
    reason: 'BUSINESS_DECISION_TABLES.md (GOAL-ALIGNMENT-01) documents the observation
      window as "watch and snapshot" for T+0..T+7 without stating whether a still-watching
      video can be promoted before it ages out. An earlier session pass had implemented
      "no early promotion, wait until exit" based on BUILD_PLAN.md (the retired legacy
      system''s build log, deleted 2026-07-07) -- an unconfirmed borrowing, not a
      decision recorded against the current system. The user directly overruled this:
      a video''s own 0-7 day video_checks curve exists to be used, not just archived,
      and there is no technical reason a still-watching video''s current numbers cannot
      be checked against the account''s already-computed threshold on every pass.'
    change: judge_account() now also evaluates every currently status=''watching''
      row (any age) against the same already-computed like_threshold/comment_like_ratio_threshold
      used for settled samples; a video that clears either channel is promoted
      immediately regardless of how many days it has been observed. This reuses the
      existing, already-validated hit criteria. A still-watching video that has not
      cleared either channel is left untouched by this pass; it either clears the bar
      on a later day, clears the day-reference channel below, or graduates to archived
      once it ages past observe_days without ever clearing anything.
  amendment_2026_07_07_day_reference_channel:
    decided_by: user
    reason: 'The user pointed out that comparing a still-young video (e.g. day 2 of
      its life) against the mature/settled like_threshold (median * excess_threshold,
      calibrated for videos that have had the full observe_days to accumulate
      engagement) is apples-to-oranges -- a young video will almost never clear a bar
      set for fully-matured videos, which defeats the point of checking early at all.
      The user required a genuinely day-appropriate reference instead: this account''s
      OWN historical median like_count at that SAME day-of-life, built from
      video_checks history across its other videos -- this is what the 0-7 day
      video_checks curve is actually for, not just archival storage.'
    change: 'Added _account_day_reference_median() (median like_count across this
      account''s video_checks rows recorded at the exact same day-offset since
      publish as the candidate video; returns None, not zero, when fewer than
      DAY_REFERENCE_MIN_SAMPLES=3 such checks exist, so the channel is skipped rather
      than fabricating a reference from too few points) and a new
      early_excess_threshold config value (2.0, see config/settings.yaml).
      A still-watching video with no other qualifying channel is promoted if its
      current like_count >= early_excess_threshold times the day-specific median. The
      user explicitly required early_excess_threshold to be LOWER than excess_threshold
      (3.0) -- set to 2.0 -- for the same reason excess_threshold itself was tuned
      -- a 3x bar pulls the standard too high for large accounts. This is still NOT a
      growth-curve/steepness/trajectory-shape predictive model (that would need
      historical trajectory data across many complete 0-7 day curves, including both
      confirmed hits and confirmed non-hits, to calibrate responsibly -- none exists
      yet since video_checks was only just created and daily incremental has not yet
      run for real over multiple days). Promoted hits via this channel are recorded
      as hit_channel=''like_threshold'' (same category: a like_count magnitude check,
      just against a different reference point) rather than a new enum value, to
      avoid migrating the CHECK constraint on the real production hits table;
      promoted_via_day_reference_count in judge_account()''s return value is the
      source of truth for how many hits this specific channel produced.'
  amendment_2026_07_07_excess_threshold_2x:
    decided_by: user
    reason: The user directly overruled excess_threshold=3.0 for the mature/settled
      channel too (not only the new day-reference channel) -- 3x pulls the standard
      too high for large accounts, the exact same reasoning that shaped
      early_excess_threshold=2.0. The user was explicit that this applies to ALL
      like-count-magnitude judging, not just the day-of-life reference channel.
    change: 'excess_threshold lowered from 3.0 to 2.0 in config/settings.yaml and
      config/settings.example.yaml. This changes the primary mature-video threshold
      formula (max(median * excess_threshold, min(P90, hit_floor_absolute_like_count)))
      used to judge every settled/archived/promoted video, not just newly-observed
      ones. Re-ran via --rejudge-only against the real production database
      immediately after this change -- 198 -> 245 hits (+47), 28/28 accounts still
      have at least one hit (0 zeroed), per-account hit counts range 1-17 (no account
      exploded to a degenerate share of its sample). hit_channel distribution shifted
      to like_threshold=177/comment_like_ratio=43/both=25 (previously 130/48/20) --
      consistent with a lower like-count bar, not a sign of a broken formula.'
  amendment_2026_07_07:
    decided_by: user
    reason: 'The like_count-only channel left one real production account (财经不眠姐)
      with zero hits despite genuine comment engagement, because its like_count never
      cleared its own scale threshold. The user required the fix be grounded in how
      Douyin officially evaluates engagement ratios, not another internally-computed
      percentile -- but official view-based rate metrics (点赞率/收藏率 as a percentage
      of play_count) are structurally unobtainable for competitor accounts (verified
      both by inspecting the actual scraper''s raw API response, which has no play_count
      field for third-party videos, and by web research confirming Douyin does not
      expose play_count to non-owners). Comment-to-like ratio was identified as the one
      published metric that substitutes like_count for play_count as its denominator,
      with an explicit public threshold range (~10% floor, ~30% typical hit). Verified
      against the real 28-account/1253-video dataset before adoption -- at 30% threshold,
      14/28 accounts scored zero (too strict); at 10%, 财经不眠姐 jumped to 20 hits out
      of 45 videos (too loose, reintroducing false-positive risk this account showed
      under other previously-rejected designs); 15%/18%/20% were compared directly,
      and 20% was chosen because it eliminates the zero-hit account (0 -> 2) without
      zeroing any other account, while showing the least accelerating growth on
      previously-flagged-risky accounts. collect_count/like_count and share_count/like_count
      were evaluated the same way (published claim: knowledge-content collect:like
      ratio of 3:1-5:1) but that specific number matched zero of 1253 real videos, so
      those two ratio channels were NOT added -- only comment_like_ratio, which did
      survive contact with real data.'
    change: added a second OR-ed channel (comment_like_ratio_threshold=0.2, see
      config/settings.yaml hit_detection) alongside the existing like_count channel;
      added hits.hit_channel column recording which channel(s) promoted each hit.
  amendment_2026_07_06:
    decided_by: user
    reason: P90 computed on the same small recent sample being judged is close to
      tautological -- by definition ~10% of any account's own sample clears its
      own P90, so using it as a bare, unbounded OR-ed term mechanically caps every
      account's hit count near a fixed percentile regardless of whether that
      account's distribution has a genuine standout video. Verified against the
      real 28-account production dataset -- with P90 unbounded, 23/28 accounts were
      capped at exactly 2 hits; with P90 bounded by the floor, hit counts varied
      2-8 per account, tracking real distribution shape instead of sample-size
      arithmetic.
    change: p90_required (bare on/off toggle) removed; P90 now always participates
      but is bounded above by hit_floor_absolute_like_count, so it can never push
      the bar above the configured floor for large accounts, while still giving
      small accounts (whose own P90 never reaches the floor) a reachable relative
      bar instead of a permanently unreachable absolute one.
  defaults: {}
  thresholds:
    single_metric_excess_threshold: 2.0
    multi_indicator_excess_threshold: 1.6
    cold_start_d7_single_metric_threshold: 3.0
    cold_start_d7_multi_indicator_threshold: 2.0
    mature_history_absolute_like_floor: 2000
    small_account_p90_percentile: 0.9
    comment_like_ratio_threshold: 0.2
    discovery_delay_hours_max: 36
    observe_days: 7
    mature_history_window_days: 90
    mature_history_max_samples: 50
    formal_baseline_activation_min_samples: 20
    formal_baseline_computation_window: 50
    unified_min_samples: 20
  timing_semantics: Discovery-batch judgement runs after each daily collection pass;
    D0..D7 snapshots are keyed to discovery batch, not to calendar day since publish.
    Mature-history and formal-baseline medians are recomputed from current data each
    time they are needed (rolling), not stored as a frozen one-time value.
  state_effects:
  - hits insert/update
  - video promoted/marked as hit
  allowed_side_effects:
  - hit artifact creation
  forbidden_behavior:
  - absolute-like-count-only judgement (no baseline reference at all)
  - LLM hit judgement
  - P90-cap-plus-absolute-floor formula (removed, see expected_behavior section F)
  - watching/archived/promoted status-machine or retraction/graduation lifecycle
    (removed, see expected_behavior section F)
  - baseline_min_samples 30-target/10-floor scheme (removed, replaced by
    unified_min_samples=20)
  - platform-position or heuristic pinned-video detection (removed, see
    expected_behavior section E)
  edge_cases:
  - account has fewer than unified_min_samples(20) qualifying videos -- mature
    history baseline and formal D/P baselines are not computed; only
    comment_like_ratio can fire
  - video discovered more than discovery_delay_hours_max(36h) after its real
    publish time -- never joins the formal D baseline, but still feeds the mature
    history baseline once matured
  - fewer than 20 complete D0-D7 (or P) sequences -- formal baseline stays
    inactive; only the cold-start D7 rough reference (rough-labelled, non-hit-producing)
    and comment_like_ratio can fire
  - zero median
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - golden high/normal/low fixture
  - discovery-anchored D0-D7 fixture (first-discovery delayed past publish date)
  - transition-sample two-snapshot fixture (1-7 days old at first contact)
  - unified_min_samples=20 boundary fixture (19 vs 20 qualifying videos)
  - formal D/P baseline 20-activate / 50-window fixture (more than 50 qualifying
    predecessors accumulated)
  - multi-indicator 1.6x combo fixture (2-of-4 metrics each clearing 1.6x while none
    clears the 2.0x single-metric bar)
  - pinned-but-recent vs pinned-but-stale age-filter fixture (no separate pinned flag
    consulted)
