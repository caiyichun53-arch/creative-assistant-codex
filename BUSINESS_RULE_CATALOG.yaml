  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 13 音频、ASR 与文本清理 ("模型大小、量化和 VAD 参数必须用中文口播样本测试后锁定")
  priority: P2
  domain_scope: all domains
  status: '2026-07-08: this entry exists outside the master document''s literal text
    -- it exists by explicit user decision (decided_by: user), added the same way
    comment_like_ratio was added to BR-HIT-001: kept by explicit user decision, not
    invented unilaterally. BR-ASR-001''s default (local SenseVoice) was never actually
    benchmarked against the document''s own stated requirement to test with real
    Chinese 口播 samples before locking a choice; the user separately wants a real
    cloud alternative (MiMo''s ASR endpoint) benchmarked against it before deciding
    whether BR-ASR-001''s default should change. Neither BR-ASR-001 nor BR-ASR-002
    covers running that comparison itself -- this entry exists specifically so the
    comparison has a real citation to point execution_contract.require_catalog_citations()
    at, instead of being force-fit onto a rule about production transcript generation.'
  trigger: user requests a one-off ASR provider comparison (local vs cloud) on a
    real promoted hit's audio, to inform whether BR-ASR-001's default should change
  inputs:
  - one real promoted hit's freshly-fetched download URL (per BR-ASR-002, fetched
    immediately before use, never persisted)
  - local SenseVoice/VAD model path
  - MiMo ASR endpoint credentials (HERMES_BUSINESS_API_KEY, local-machine .env only)
  expected_behavior: A bounded, one-off, user-initiated benchmark run -- not a
    change to the production reverse-prep path, not a recurring job, not a default
    change. Produces two transcripts (local SenseVoice, MiMo cloud ASR) from the
    SAME audio for the user to compare; does not itself decide or write a new
    BR-ASR-001 default. Calling MiMo here is not "LLM transcript correction in
    formal path" (BR-ASR-001's forbidden_behavior) because this is not the formal
    path -- it is a calibration input to a future, separate decision about what the
    formal path's default should be.
  defaults:
    scope: single video, single run, not automated/scheduled
  thresholds: {}
  timing_semantics: One-off, on explicit user request each time -- not triggered
    automatically by any hit promotion.
  state_effects:
  - no BR-ASR-001 default changed by this entry alone
  - no reverse_status/hits row touched
  allowed_side_effects:
  - local temp audio file
  - one real MiMo API call (billed, per MiMo's token-based pricing)
  - two transcript outputs for user comparison
  forbidden_behavior:
  - running this unattended/on a schedule
  - treating its output as a silent authorization to change BR-ASR-001's default
  - persisting the fetched download URL (same as BR-ASR-002)
  edge_cases:
  - download URL expired before either ASR call completes (re-fetch fresh per
    BR-ASR-002, do not reuse a stale URL)
  - the account's "music" track is unrelated background music, not the video's own
    narration (verified real case, 2026-07-08) -- per explicit user instruction,
    do not attempt to filter/validate this by duration or other heuristics; use it
    directly as the video's audio
  user_confirmation_required: true
  supersedes: []
  validation_required:
  - manual: user reviews both transcripts side by side
  outcome: '2026-07-08: run twice against two different real promoted hits via
    scripts/tools/compare_asr_providers.py (Token Plan base URL: the public docs''
    example endpoint api.xiaomimimo.com 401s for a Token Plan key -- the correct
    base URL, https://token-plan-cn.xiaomimimo.com/v1, was confirmed from the
    user''s own account console). Video 1 (~11 min): local SenseVoice produced a
    complete 6709-character transcript; MiMo returned only 377 characters (just
    the closing remarks, missing everything before it). Video 2 (shorter): local
    SenseVoice produced a complete 3892-character transcript; MiMo returned only
    497 characters covering roughly the first eighth of the content, ending in a
    repeated/looped sentence rather than a real stop. Root cause confirmed via
    MiMo''s own official model page (mimo.mi.com/models/zh-CN/mimo-v2.5-asr):
    mimo-v2.5-asr has an 8K-token context window shared between audio input
    tokens and text output (2K-token max output) -- a several-minute audio clip''s
    own token cost leaves too little of that shared budget for a complete
    transcript, which is a structural limit of the model, not a request-formatting
    bug (confirmed: identical result re-sending the exact same audio file twice).
    Decision (decided_by: user): BR-ASR-001''s local SenseVoice default is
    confirmed and kept unchanged -- MiMo is not adopted for reverse-prep
    transcription.'
