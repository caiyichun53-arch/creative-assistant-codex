- requirement_id: BR-BASELINE-003
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 基线样本不足
  priority: P0
  domain_scope: all domains
  status: '2026-07-07: superseded in detail by BR-HIT-001 section C -- the unified
    minimum is 20 (user override of the document''s original per-metric ">=5"), not
    30, and there is no more legacy_supplement/backfill-outside-the-90-day-window
    behavior. Below 20, the mature history baseline is simply not computed at all
    (no evidence-insufficient hit is ever promoted from it).'
  trigger: baseline sample under minimum
  inputs:
  - sample_count
  expected_behavior: Below unified_min_samples(20), the mature history baseline is
    not computed and no hit is promoted from it -- only comment_like_ratio (which
    needs no baseline) can still fire for that account.
  defaults:
    legacy_supplement: false
  thresholds:
    minimum_sample_count: 20
  timing_semantics: Do not silently compare against a too-small sample.
  state_effects:
  - baseline simply absent for that account/metric until the sample grows
  allowed_side_effects: []
  forbidden_behavior:
  - promote a hit from an underpowered (< unified_min_samples) baseline
  - backfill toward the minimum from outside the 90-day window
  edge_cases:
  - exactly 19 vs exactly 20 qualifying videos
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - synthetic sparse-account fixture (19 vs 20 boundary)
- requirement_id: BR-HIT-001
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 爆款判定 (第8/9/10/14/15章 + 附录A，2026-07-07 与用户逐条对照复核后定稿)
  priority: P0
  domain_scope: all domains
  status: '2026-07-07 full realignment to the master document (see
    amendment_2026_07_07_master_doc_realignment below). This replaces the
    partial, code-first iteration built earlier the same week (the
    amendment_2026_07_06 / amendment_2026_07_07 / amendment_2026_07_07_excess_threshold_2x
    / amendment_2026_07_07_day_reference_channel / amendment_2026_07_07_early_promotion
    blocks below): those are kept ONLY as an audit trail of what was tried and why it
    was superseded -- they do NOT describe current behavior. Read expected_behavior
    below plus amendment_2026_07_07_master_doc_realignment for the current design;
    everything needed to implement or verify it is there, none of the superseded
    blocks below need to be read to understand current behavior.'
  trigger: discover / track / judge a competitor or self-owned video
  inputs:
  - discovery_delay_hours (publish_time to first-crawl-discovery gap)
  - video_checks history (per-video, per-discovery-batch snapshots)
  - mature_history_baseline (per-account, per-metric median)
  - formal_d_baseline (per-account, per-D-point median, competitor videos)
  - formal_p_baseline (per-account, per-P-point median, self-owned videos)
  - like_count / comment_count / collect_count / share_count
  - comment_like_ratio_threshold
  expected_behavior: 'FULL CURRENT DESIGN (supersedes all per-threshold amendments
    below; this paragraph alone is sufficient to implement or verify it):


    (A) Discovery-anchored D-notation, not calendar days. D0 = the first crawl
    batch that discovers a given video; D1..D7 = the next 7 discovery batches for
    that same video, regardless of how many calendar days after publish the video
    was actually first discovered. A video only qualifies for the formal D baseline
    if discovery_delay_hours (publish_time -> first discovery) <= 36 hours; a video
    discovered later than that can still be tracked and still counts toward the
    mature history baseline once it matures, it just never becomes a formal-D-baseline
    member or gets D-point candidate judgement.


    (B) Three categories at first contact with a video (per the master document''s
    "历史回填与三类视频"): (1) historical mature sample -- already published >=7 days
    when first seen; store one current cumulative snapshot now; feeds the mature
    history baseline only, never the formal D baseline. (2) transition sample --
    published 1-7 days when first seen; store one snapshot now, then store a second
    "matured" snapshot once it turns exactly 7 days published; no D-series is
    fabricated for it; once matured it feeds the mature history baseline only, never
    the formal D baseline. (3) formal new video -- first discovered via the account''s
    regular ongoing daily batch (i.e. not at first registration); store D0, then D1..D7
    on the following 7 discovery batches; feeds ASR/topic pipelines and, once the full
    D0-D7 set is complete AND discovery_delay_hours <= 36h, becomes eligible to join
    the formal D baseline.


    (C) Four baselines, not one: (1) mature history baseline -- source pool is this
    account''s videos published within the trailing 90 days, capped at 50 (a rolling
    window: newly-matured transition samples and newly-matured regular videos slide
    in as they turn 7 days old; videos aging past 90 days slide out; there is no
    separate "top-up" algorithm, the same 90-day/50-cap rule is simply re-evaluated
    against current data whenever the baseline is needed); one cumulative-value
    snapshot per video; median per metric; requires >= UNIFIED_MIN_SAMPLES (20, see
    thresholds) total qualifying videos before it can be computed at all -- this
    supersedes the master document''s literal "each metric needs >=5 non-null
    samples," which the user explicitly overrode in favor of one unified floor of 20
    used everywhere in this rule. (2) cold-start / history-high-signal rough reference
    -- compares a video''s numbers against the mature history median using the SAME
    multipliers as section (D) below (2.0x single-metric, 1.6x any-2-of-4 combo).
    Applies in two cases, per master doc chapter 20.2 "存量高信号" and chapter 14''s
    cold-start row: (a) a historical_mature or matured-transition video (the normal
    case at first registration/首采, since these NEVER get a D-series at all), and
    (b) a formal_new video at exactly D7 while the formal D baseline itself has
    fewer than UNIFIED_MIN_SAMPLES qualifying D0-D7 sequences. CORRECTED 2026-07-07
    (see amendment_2026_07_07_history_high_signal_is_a_real_hit below): this IS a
    real hit -- the document explicitly permits calling it "历史爆款" informally --
    tagged judgment_confidence=rough (a distinct evidence caliber from
    formal_d_series, per the document''s "不能与正式D候选混用证据口径", not "not a
    hit at all"). It is inserted into hits and is subject to the same permanence
    rule (section F below / BR-HIT-005) as any other hit. (3) formal competitor D baseline -- activates once the account has
    accumulated >= UNIFIED_MIN_SAMPLES (20) complete, discovery-delay-qualifying
    D0-D7 sequences; once active, each D-point''s median is computed over the most
    recent 50 qualifying predecessor videos at that D-point -- this corrects the
    master document''s literal text ("最近20条"), which fixed the ongoing computation
    window at 20 forever; the user determined 20 should only ever be the activation
    gate, and the ongoing window should align with the mature history baseline''s 50;
    the video currently being judged never contributes to its own baseline. (4) formal
    self-owned P baseline -- kept (not redundant with raw play-count-based ratios,
    because it answers "is this better than THIS account''s own normal performance,"
    which official engagement-rate metrics computed against play_count cannot answer
    on their own, and this account-relative comparison is what feeds the experience-library
    promotion loop); activates at >= UNIFIED_MIN_SAMPLES (20) complete P sequences,
    window then also aligned to 50 to mirror the D-baseline correction. NOTE (explicitly
    left open, not a gap in this catalog entry -- deliberately deferred): the exact
    mechanics of HOW the P-baseline comparison result feeds into experience-library
    promotion are not yet designed; that design work belongs to the experience-library
    layer, not to this hit-detection rule, and must not be guessed here.


    (D) Trigger rules once the relevant formal baseline (D for competitor, P for
    self-owned) is active -- five independent OR-ed channels, any one firing is
    sufficient: (1) like anomaly -- candidate''s like_count >= 2.0x the baseline
    median like_count at that D/P point. (2) comment anomaly -- comment_count >=
    2.0x median. (3) collect anomaly -- collect_count >= 2.0x median. (4) share
    anomaly -- share_count >= 2.0x median. (5) multi-indicator anomaly -- at least 2
    of the 4 metrics above each independently clear 1.6x their own median (a separate,
    lower-bar combo path, evaluated independently of channels 1-4''s own 2.0x bars,
    not requiring any single metric to hit 2.0x). PLUS one additional channel that
    exists outside the master document, kept by explicit user decision:
    (6) comment_like_ratio -- comment_count/like_count >= comment_like_ratio_threshold
    (0.2); computed purely from the candidate video''s own numbers, no baseline or
    account history required at all, so it can fire even before any baseline is
    active. hits.hit_channel records which channel(s) fired.


    (E) Pinned-video handling: there is no separate pinned-detection step. Age
    eligibility for every rule above (7-day minimum, 90-day mature-history window,
    36-hour discovery-delay gate) is determined purely from the video''s real
    publish timestamp versus current time. A pinned video whose real publish date
    is actually outside a given window is excluded by that ordinary age rule like
    any other video; a pinned video that is actually recent is eligible like any
    other recent video. No platform "is this pinned" flag or list-position heuristic
    is consulted anywhere in this rule.


    (F) Explicitly REMOVED from the prior (superseded) implementation, by explicit
