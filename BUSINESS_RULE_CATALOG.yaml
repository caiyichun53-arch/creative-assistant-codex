  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 对照视频与标准样本包 (第17/17.1章，2026-07-07 补全)
  priority: P1
  domain_scope: all domains
  status: '2026-07-07: expanded from a one-line migration stub to the document''s
    full deterministic control-sample spec, per user instruction to backfill every
    item flagged in this reconciliation pass.'
  trigger: analysis fixture selection / control-sample recall for a hit candidate
  inputs:
  - candidate video (the hit being analyzed, needing contrast samples)
  - same_topic / core_question / full-text or pg_trgm top-K recall results
  - account baseline (mature_history / formal_d_series / formal_p_series, whichever
    the candidate itself was judged against)
  expected_behavior: 'Three-tier match priority, in order: (1) same account, same or
    near-identical topic, performance near normal level. (2) other benchmark
    accounts, same topic or near-identical, ordinary performance. (3) same account,
    related but not identical topic, an ordinary video. A control match is NOT
    required -- failing to find one does not block analysis of the hit itself.
    Recall is deterministic: prefer same-account first; pull candidates from
    same_topic, matching core_question, or full-text/pg_trgm top-K; only call
    content_relation_judge (an LLM) when the topic relationship is genuinely
    ambiguous -- never do an all-pairs comparison across the whole library. Default
    "normal control" bar: at the same observation point as the candidate, the
    primary metric is between 0.75x and 1.25x this account''s baseline, AND it did
    NOT itself clear any hit trigger rule; rank further by topic closeness. Default
    "low-performer counter-example" bar: primary metric <=0.5x baseline at the same
    observation point, OR at least two available metrics <=0.7x; a low-performer
    sample MUST have a same-topic or near-topic relationship to the candidate it is
    contrasting -- a low performer alone does not mechanically disprove the
    hit-detection formula, it only adds a counter-example / boundary-evidence data
    point. When there is no matching observation point across baseline modes
    (e.g. comparing a mature-history video to a formal-D-series video), compare only
    content structure and wording -- never compare absolute numbers, growth, or
    multipliers across different baseline_mode values. A user may manually designate
    a normal, low-performer, or counter-example sample and must record the reason;
    manually-designated samples still must be tagged with their baseline_mode and
    comparability caveats.'
  defaults:
    control_groups:
    - normal
    - low
    normal_control_metric_range:
    - 0.75
    - 1.25
    low_performer_single_metric_ceiling: 0.5
    low_performer_multi_metric_ceiling: 0.7
    low_performer_multi_metric_min_count: 2
  thresholds: {}
  timing_semantics: Controls are read-only evidence and must not be promoted; recalled
    and attached at analysis time, not stored as a permanent pairing.
  state_effects: []
  allowed_side_effects:
  - sample-package field capture (see below)
  forbidden_behavior:
  - discard controls during migration
  - all-pairs library-wide comparison to find a control
  - comparing absolute numbers/growth/multipliers across different baseline_mode
    values
  - treating a low-performer sample as disproving the hit formula on its own
  - promoting a control/counter-example sample as a hit
  edge_cases:
  - low count from young watching videos may be immature
  - no matching observation point across baseline modes -- fall back to
    content-only comparison, do not block analysis
  - no control found at all -- proceed without one, do not block
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - 'fixture: high/normal/low videos'
  - normal-control 0.75x/1.25x boundary fixture
  - low-performer single-metric 0.5x and multi-metric 0.7x/2-of-N boundary fixture
  - cross-baseline_mode fallback-to-content-only fixture
  - sample-package required-field completeness fixture (account/video id, publish
    time, first discovery, duration, title, domain, D/P sequence, snapshot ids,
    baseline reference, multiplier, missing points, trigger rules, raw/cleaned
    script + version id, comment batch ids + actual/included/omitted counts,
    duplicate/same-topic/control relationships, baseline_mode, discovery delay,
    sample count, collection time, domain_config/Skill/prompt/model/payload_hash)
