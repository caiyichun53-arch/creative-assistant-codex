  - writing a discovered video into hits/competitor_videos (would misrepresent
    it as having a formal D-baseline it does not have)
  - treating a discovered video''s absolute numbers as a formal multiplier
  edge_cases:
  - a domain with zero active tags yet (sources.yaml not filled in)
  - a search that returns zero results for a real tag
  user_confirmation_required: true
  supersedes: []
  validation_required:
  - domain search tag rotation fixture
  - deterministic filter/ranking fixture
  - suggested tag requires human confirmation before becoming active fixture
