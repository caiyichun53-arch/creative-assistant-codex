- requirement_id: BR-COLLECT-005
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 逆向备料/评论采集阶段
  priority: P0
  domain_scope: all domains
  status: '2026-07-08: implemented in scripts/core/business_data/run_reverse_prep.py
    (fetch_detail_with_comments) -- comments are read from the same MediaCrawler
    detail crawl (get_comment=yes) used to resolve the fresh download URL, not a
    separate collector.comments pass. Scope: only already-promoted hits, not the
    broader purpose-tagged multi-stage pipeline BR-HIT-002/006/007 still describe
    (those remain acknowledged gaps). Cross-checked against source document section
    16 the same day and extended to also preserve the crawler''s own hotness
    ordering via hit_comments.sample_rank (assigned before filtering, so a gap in
    the sequence shows a dropped comment); reply/second-level comments were
    already excluded at the crawler level (--get_sub_comment no, hardcoded in
    LocalMediaCrawlerExecutor), matching section 16''s "第一阶段关闭二级评论"
    with no code change needed.'
  trigger: hit promoted or prep worker runs
  inputs:
  - hit platform_item_id
  - raw comments
  expected_behavior: Comments for hit analysis are collected as reverse-prep evidence,
    not formal research evidence.
  defaults:
    comment_stage: reverse_prep
  thresholds:
    top_comments: 60
  timing_semantics: Prefer collecting comments in the same fresh detail crawl used
    for download URLs.
  state_effects:
  - hit_comments append
  allowed_side_effects:
  - comments.json projection
  - raw detail archive
  forbidden_behavior:
  - use comments inside formal research path
  - send platform messages
  edge_cases:
  - no comments available
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - comment fixture with/without comments
- requirement_id: BR-COLLECT-006
  source_document: 爆款口播内容经验库系统_最终完整执行总控文档_V0.6.2_无损汇编版.docx
  source_section: 逆向备料/评论过滤去重
  priority: P1
  domain_scope: all domains
  status: '2026-07-08: implemented in scripts/core/business_data/run_reverse_prep.py
    (filter_comments) -- pure deterministic filtering (min length, dedup by
    comment_id, content-hash fallback when comment_id is missing), no LLM
    involved. 2026-07-13 correction (置顶规则总表 V0.6.3 卷首核对后): storage key
    changed from (hit_id, comment_id) to (hit_id, comment_id, purpose) -- see
    BR-HIT-007. Dedup within a single purpose is unchanged (a retry of the same
    collection pass still cannot create duplicate rows); the same comment_id
    genuinely collected again under a DIFFERENT purpose (e.g. early_topic then
    mature_analysis) now gets its own row instead of being silently dropped by
    the old key, which the user pointed out was necessary precisely because
    section 16 designs multiple collection passes per video.'
  trigger: store hit comments
  inputs:
  - comment_id
  - content
  - like_count
  expected_behavior: Keep high-signal comments after deterministic noise filtering
    and idempotent comment_id insertion.
  defaults:
    min_comment_len: 5
  thresholds:
    top_comments: 60
  timing_semantics: Filtering happens before DNA input assembly.
  state_effects:
  - hit_comments INSERT OR IGNORE
  allowed_side_effects:
  - filtered comment projection
  forbidden_behavior:
  - LLM decides noise filter
  - duplicate comment rows
  edge_cases:
  - missing comment_id falls back to content hash in target
  user_confirmation_required: false
  supersedes: []
  validation_required:
  - comment_filter unit fixture
