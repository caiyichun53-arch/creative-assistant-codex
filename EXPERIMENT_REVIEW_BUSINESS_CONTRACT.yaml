schema_version: experiment_review.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: experiment_review
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\6b5c993c-a2d1-460d-adc8-cf2142efd403\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Review supplied experiment design, execution data, result metrics and evidence to decide whether tested experience hypotheses are supported, refuted, inconclusive, or need more data.
non_responsibilities:
  - experience_revision_propose
  - formal_experience_publication
  - formal_experience_modification
  - script_review
  - tactic_extract
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - experiment_id
    - experiment_design
    - execution_summary
    - result_metrics
    - evidence_items
    - tested_experience_refs
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
review_policy:
  consumes_supplied_experiment_packet_only: true
  must_not_fetch_or_verify_externally: true
  must_not_modify_formal_experience: true
  must_not_publish_experience: true
  must_not_call_experience_revision_propose: true
  route: business.experiment_review
evidence_requirements:
  evidence_items_min: 1
  evidence_items_max: 12
  tested_experience_refs_min: 1
  tested_experience_refs_max: 8
  output_evidence_used_must_reference_input_claims: true
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  experiment_id_max: 80
  experiment_design_max: 1800
  execution_summary_max: 1800
context_budget:
  max_input_tokens: 7000
token_budget:
  max_output_tokens: 1800
timeout:
  milliseconds: 60000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: experiment_review:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - inconclusive
    - model_empty_result
    - non_json_output
    - missing_output_field
    - unseen_experience_ref
    - unseen_evidence
    - illegal_publish
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - failure_does_not_write_formal_result
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.experiment_review
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.experiment_review
  binding_name: experiment_review_public_input_to_review
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    experiment_design:
      source: input
      key: experiment_design
    execution_summary:
      source: input
      key: execution_summary
    result_metrics:
      source: input
      key: result_metrics
    evidence_refs:
      source: input
      key: evidence_items
    tested_experience_refs:
      source: input
      key: tested_experience_refs
  model_input_schema:
    type: object
    required:
      - fixture_id
      - experiment_design
      - execution_summary
      - result_metrics
      - evidence_refs
      - tested_experience_refs
    properties:
      fixture_id: string
      experiment_design: string
      execution_summary: string
      result_metrics: object
      evidence_refs:
        type: array
        items:
          type: object
      tested_experience_refs:
        type: array
        items:
          type: string
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys review_status, supported_experience_refs,
    refuted_experience_refs, inconclusive_experience_refs, key_findings,
    evidence_used, next_actions, schema_version. Review only the supplied
    experiment packet. Do not publish, revise, or write formal experience. Do
    not call another Skill or fetch missing context. Experience refs must come
    only from tested_experience_refs. evidence_used must contain only claims
    from evidence_refs. Use schema_version experiment_review.output.v1.
  model_output_schema:
    type: object
    required:
      - review_status
      - supported_experience_refs
      - refuted_experience_refs
      - inconclusive_experience_refs
      - key_findings
      - evidence_used
      - next_actions
      - schema_version
    properties:
      review_status:
        type: string
        enum:
          - supports_hypothesis
          - refutes_hypothesis
          - inconclusive
          - needs_more_data
      supported_experience_refs:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      refuted_experience_refs:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      inconclusive_experience_refs:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      key_findings:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: string
          minLength: 1
          maxLength: 240
      evidence_used:
        type: array
        minItems: 0
        maxItems: 12
        items:
          type: string
      next_actions:
        type: array
        minItems: 0
        maxItems: 6
        items:
          type: string
          minLength: 1
          maxLength: 240
      schema_version:
        type: string
        const: experiment_review.output.v1
    additional_properties: false
  output_map:
    review_status:
      source: model_output
      key: review_status
    supported_experience_refs:
      source: model_output
      key: supported_experience_refs
    refuted_experience_refs:
      source: model_output
      key: refuted_experience_refs
    inconclusive_experience_refs:
      source: model_output
      key: inconclusive_experience_refs
    key_findings:
      source: model_output
      key: key_findings
    evidence_used:
      source: model_output
      key: evidence_used
    next_actions:
      source: model_output
      key: next_actions
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - experiment_id
    - experiment_design
    - execution_summary
    - result_metrics
    - evidence_items
    - tested_experience_refs
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    experiment_id:
      type: string
      minLength: 1
      maxLength: 80
    experiment_design:
      type: string
      minLength: 1
      maxLength: 1800
    execution_summary:
      type: string
      minLength: 1
      maxLength: 1800
    result_metrics:
      type: object
    evidence_items:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
    tested_experience_refs:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 160
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: experiment_review.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - review_status
    - supported_experience_refs
    - refuted_experience_refs
    - inconclusive_experience_refs
    - key_findings
    - evidence_used
    - next_actions
    - schema_version
  properties:
    review_status:
      type: string
      enum:
        - supports_hypothesis
        - refutes_hypothesis
        - inconclusive
        - needs_more_data
    supported_experience_refs:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    refuted_experience_refs:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    inconclusive_experience_refs:
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
    key_findings:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        minLength: 1
        maxLength: 240
    evidence_used:
      type: array
      minItems: 0
      maxItems: 12
      items:
        type: string
    next_actions:
      type: array
      minItems: 0
      maxItems: 6
      items:
        type: string
        minLength: 1
        maxLength: 240
    schema_version:
      type: string
      const: experiment_review.output.v1
  additional_properties: false
