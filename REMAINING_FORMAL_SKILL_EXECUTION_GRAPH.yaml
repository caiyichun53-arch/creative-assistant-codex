    status: phase_4_pending
    boundary: Core and Skills must consume frozen public artifacts, not MediaCrawler directly.
  - adapter_id: asr_adapter
    status: phase_4_pending
    boundary: Core and Skills must consume prepared transcript artifacts, not local ASR commands directly.
  - adapter_id: comment_collector_adapter
    status: phase_4_pending
    boundary: Core and Skills must consume prepared comment artifacts, not platform crawlers directly.
  - adapter_id: search_provider_fetcher
    status: phase_4_pending
    boundary: Research Skills must consume fetched evidence packets through the formal adapter boundary.
  - adapter_id: netease_music_adapter
    status: phase_4_pending
    boundary: Music evidence must be isolated behind an adapter before formal Skill use.
