schema_version: sample_deep_analyze.business_contract.v1
goal: GOAL-V0.6.2-PRODUCTION-COMPLETION-01
status: active_formal_business_contract
skill_id: sample_deep_analyze
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\4ebd5a12-206f-401e-b0b6-0c3878e47996\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
  - REMAINING_FORMAL_SKILL_EXECUTION_GRAPH.yaml
responsibility: Analyze one already prepared winner sample into reusable topic, hook, and structure patterns.
non_responsibilities:
  - source_to_topic
  - tactic_extract
  - multi_sample_reduce
  - ASR_transcription
  - comment_collection
  - content_classify
  - content_relation_judge
  - research_fetching
  - script_generation
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - sample_id
    - candidate_topic
    - transcript_excerpt
    - metrics
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - dna_note_path
  - raw_video_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
analysis_policy:
  one_sample_per_run: true
  consumes_prepared_material_only: true
  must_not_run_asr_or_collect_comments: true
  must_not_reduce_multiple_samples: true
  must_not_write_examples_or_experience: true
  output_only_reusable_patterns: true
evidence_requirements:
  transcript_excerpt_required: true
  metrics_required: true
  output_must_not_claim_unprovided_comments: true
input_length_limits:
  request_id_max: 80
  correlation_id_max: 80
  sample_id_max: 80
  candidate_topic_max: 120
  # 2026-07-09: raised from 2200 -- derived from context_budget.max_input_tokens
  # below (~1500 tokens reserved for prompt+metrics overhead, ~10500 left for
  # transcript at a conservative 1.5 chars/token for Chinese). 2200 was cutting
  # ~24% of real transcripts mid-content; confirmed on real data that this
  # visibly degraded structure_pattern output (the model fabricated an ending
  # for content it never saw). See runtime_skills/sample_deep_analyze/
  # input_schema.yaml for the same derivation.
  transcript_excerpt_max: 7000
context_budget:
  max_input_tokens: 12000
token_budget:
  max_output_tokens: 2500
timeout:
  milliseconds: 90000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: sample_deep_analyze:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - high_metric_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.reverse_dna_analysis
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.reverse_dna_analysis
  route_id: business_analysis
  binding_name: sample_deep_analyze_public_input_to_reverse_dna_analysis
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    transcript_excerpt:
      source: preprocessed
      key: transcript_text
    metrics:
      source: input
      key: metrics
  model_input_schema:
    type: object
    required:
      - fixture_id
      - transcript_excerpt
      - metrics
    properties:
      fixture_id: string
      transcript_excerpt: string
      metrics: object
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys topic_pattern, hook_pattern, structure_pattern,
    schema_version. Analyze one prepared sample only. Do not run ASR, collect
    comments, reduce multiple samples, write examples, fetch facts, or call other
    Skills. Use schema_version sample_deep_analyze.output.v1.
    transcript_excerpt={transcript_excerpt}; metrics={metrics}
  model_output_schema:
    type: object
    required:
      - topic_pattern
      - hook_pattern
      - structure_pattern
      - schema_version
    properties:
      topic_pattern:
        type: string
        minLength: 1
        maxLength: 800
      hook_pattern:
        type: string
        minLength: 1
        maxLength: 800
      structure_pattern:
        type: string
        minLength: 1
        maxLength: 800
      schema_version:
        type: string
        const: sample_deep_analyze.output.v1
    additional_properties: false
  output_map:
    topic_pattern:
      source: model_output
      key: topic_pattern
    hook_pattern:
      source: model_output
      key: hook_pattern
    structure_pattern:
      source: model_output
      key: structure_pattern
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - sample_id
    - candidate_topic
    - transcript_excerpt
    - metrics
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
      maxLength: 80
    correlation_id:
      type: string
      minLength: 1
      maxLength: 80
    sample_id:
      type: string
      minLength: 1
      maxLength: 80
    candidate_topic:
      type: string
      minLength: 1
      maxLength: 120
    transcript_excerpt:
      type: string
      minLength: 1
      maxLength: 7000
    metrics:
      type: object
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: sample_deep_analyze.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - topic_pattern
    - hook_pattern
    - structure_pattern
    - schema_version
  properties:
    topic_pattern:
      type: string
      minLength: 1
      maxLength: 800
    hook_pattern:
      type: string
      minLength: 1
      maxLength: 800
    structure_pattern:
      type: string
      minLength: 1
      maxLength: 800
    schema_version:
      type: string
      const: sample_deep_analyze.output.v1
  additional_properties: false
