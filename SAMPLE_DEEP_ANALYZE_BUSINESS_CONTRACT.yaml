schema_version: sample_deep_analyze.business_contract.v1
governance_basis: docs/EFFECTIVE_DESIGN_BASELINE.md
status: active_formal_business_contract
skill_id: sample_deep_analyze
skill_version: 1.0.0
source_documents:
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - runtime_skills/sample_deep_analyze/skill.yaml
responsibility: Analyze one already prepared winner sample into reusable topic, hook, and structure patterns.
non_responsibilities:
  - source_to_topic
  - tactic_extract
  - multi_sample_reduce
  - ASR_transcription
  - comment_collection
  - content_classify
  - content_relation_judge
  - research_fetching
  - script_generation
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - sample_id
    - candidate_topic
    - transcript_excerpt
    - metrics
    - domain_label
    - schema_version
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - local_file_path
  - dna_note_path
  - raw_video_path
  - source_url_to_fetch
  - cookie_or_token
  - hermes_chat_memory
  - cold_backup_reference
analysis_policy:
  one_sample_per_run: true
  consumes_prepared_material_only: true
  must_not_run_asr_or_collect_comments: true
  must_not_reduce_multiple_samples: true
  must_not_write_examples_or_experience: true
  output_only_reusable_patterns: true
evidence_requirements:
  transcript_excerpt_required: true
  metrics_required: true
  output_must_not_claim_unprovided_comments: true
# 2026-07-13 用户明确拍板:彻底取消这份契约曾经声明的字符/token 上限
# (input_length_limits.transcript_excerpt_max/context_budget/token_budget),
# 转写文字稿等真实内容一律原样完整发给模型,不再截断,也不再对真实调用施加
# max_completion_tokens 限制。历史教训留痕(不是删掉就当没发生过):2026-07-09
# 曾经把 transcript_excerpt_max 从2200字硬截断,真实数据验证过这会切掉约24%
# 真实转写文字稿的正文中段,模型在结构手法输出里编造了它从没见过的结尾——这
# 正是"偷偷截断"最危险的地方:错误不会报出来,只会安静地污染产出。这次的决定
# 就是不再允许这种情况发生,风险(真实调用可能因为内容过长而报错、或成本变高)
# 由用户明确接受。
timeout:
  milliseconds: 90000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - output_schema_error
idempotency:
  key: sample_deep_analyze:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: technical_failure_without_formal_result
  non_json_output: technical_failure_without_formal_result
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
fixture_cases:
  required_fixture_ids:
    - fan_kepu_social_life
    - music_entertainment
    - high_metric_neutral
    - model_empty_result
    - non_json_output
    - missing_output_field
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - adapter_job_worker_materializer_passed
  - idempotent_replay_passed
  - retry_failure_path_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.reverse_dna_analysis
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.reverse_dna_analysis
  route_id: business_analysis
  binding_name: sample_deep_analyze_public_input_to_reverse_dna_analysis
  binding_version: 1.0.0
  # 2026-07-11: candidate_topic (the real video title) is required by the
  # public input_schema but was never forwarded to the model. Added so the
  # model has a real topic anchor, not just a transcript excerpt that may be
  # truncated for a long video.
  input_map:
    fixture_id:
      source: input
      key: request_id
    candidate_topic:
      source: input
      key: candidate_topic
    transcript_excerpt:
      source: preprocessed
      key: transcript_text
    metrics:
      source: input
      key: metrics
  model_input_schema:
    type: object
    required:
      - fixture_id
      - candidate_topic
      - transcript_excerpt
      - metrics
    properties:
      fixture_id: string
      candidate_topic:
        type: string
        minLength: 1
      transcript_excerpt: string
      metrics: object
    additional_properties: false
  # Rewritten after a real-output review found that the old bare "return this JSON shape"
  # prompt, 2 of 22 real analyses came back with English snake_case labels
  # instead of Chinese (e.g. "redefining_common_pest_as_beneficial_predator")
  # while the other 20 were Chinese -- the prompt never specified an output
  # language, so the model picked inconsistently per call. This mixing
  # directly degrades tactic_extract downstream (it cannot find real
  # commonality across notes that are not even in the same language). The
  # prompt now requires Simplified Chinese explicitly, clarifies what each
  # of the three pattern fields actually means (a reusable pattern
  # description, not a summary of this one video's specific facts), and asks
  # for a concise but complete description rather than either a bare label
  # or a full paragraph.
  prompt_template: >-
    You are extracting reusable content patterns from one already-successful
    Chinese short-video (抖音) script. Return only JSON with keys
    topic_pattern, hook_pattern, structure_pattern, schema_version
    (schema_version=sample_deep_analyze.output.v1).

    Write all three fields in Simplified Chinese, regardless of what
    language the transcript itself is in.

    topic_pattern: the reusable TYPE or ANGLE of topic this video takes, not
    a restatement of its specific facts -- phrase it so it could describe
    other videos taking a similar angle on a different subject.

    hook_pattern: the reusable OPENING TECHNIQUE used to capture attention,
    not a quote of the actual opening line -- describe the strategy (e.g.
    what kind of contrast, question, or tension it opens with).

    structure_pattern: the reusable NARRATIVE STRUCTURE as an ordered
    sequence of stages (use → between stages) -- describe the shape of the
    argument/story, not this video's specific content at each stage.

    Each field should be a concise but complete phrase or short sentence
    (not a bare one-word label, not a full paragraph) -- write however much
    is actually needed to describe the real pattern, no more.

    candidate_topic={candidate_topic}; transcript_excerpt={transcript_excerpt};
    metrics={metrics}

    Before answering, double check your JSON includes all four keys --
    topic_pattern, hook_pattern, structure_pattern, and schema_version set
    exactly to sample_deep_analyze.output.v1. Do not omit schema_version.

    Do not run ASR, collect comments, reduce multiple samples, write
    examples, fetch facts, or call other Skills.
  model_output_schema:
    type: object
    required:
      - topic_pattern
      - hook_pattern
      - structure_pattern
      - schema_version
    properties:
      topic_pattern:
        type: string
        minLength: 1
      hook_pattern:
        type: string
        minLength: 1
      structure_pattern:
        type: string
        minLength: 1
      schema_version:
        type: string
        const: sample_deep_analyze.output.v1
    additional_properties: false
  output_map:
    topic_pattern:
      source: model_output
      key: topic_pattern
    hook_pattern:
      source: model_output
      key: hook_pattern
    structure_pattern:
      source: model_output
      key: structure_pattern
    schema_version:
      source: model_output
      key: schema_version
input_schema:
  type: object
  required:
    - request_id
    - correlation_id
    - sample_id
    - candidate_topic
    - transcript_excerpt
    - metrics
    - domain_label
    - schema_version
  properties:
    request_id:
      type: string
      minLength: 1
    correlation_id:
      type: string
      minLength: 1
    sample_id:
      type: string
      minLength: 1
    candidate_topic:
      type: string
      minLength: 1
    transcript_excerpt:
      type: string
      minLength: 1
    metrics:
      type: object
    domain_label:
      type: string
      enum:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - unknown
    schema_version:
      type: string
      const: sample_deep_analyze.input.v1
  additional_properties: false
output_schema:
  type: object
  required:
    - topic_pattern
    - hook_pattern
    - structure_pattern
    - schema_version
  properties:
    topic_pattern:
      type: string
      minLength: 1
    hook_pattern:
      type: string
      minLength: 1
    structure_pattern:
      type: string
      minLength: 1
    schema_version:
      type: string
      const: sample_deep_analyze.output.v1
  additional_properties: false
