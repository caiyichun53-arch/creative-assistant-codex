schema_version: 1
goal: GOAL-DATA-RESET-01
phase: clean_room_acceptance_definition
hard_gates:
- gate_id: CR-DB-EMPTY
  assertion: New formal database business tables start with 0 rows
  evidence: SQL count report over formal DB after migrations
- gate_id: CR-NO-OLD-IDENTIFIERS
  assertion: No old ids, old statuses, old DNA, old topics or old drafts exist in
    formal DB
  evidence: negative queries and artifact path scan
- gate_id: CR-CONFIG-NO-CREATION-DB
  assertion: Production configuration does not reference data/creation.db
  evidence: config scan excluding docs/tests/fixtures
- gate_id: CR-CODE-NO-LEGACY-FALLBACK
  assertion: Production code does not read legacy directories or fallback to old SQLite
  evidence: static scan allowlist for docs/tests/diagnostics only
- gate_id: CR-FIXTURE-TEST-ONLY
  assertion: Fixtures load only in test environment
  evidence: fixture loader requires explicit test flag/path
- gate_id: CR-PRODUCTION-STARTS-WITHOUT-FIXTURES
  assertion: Deleting fixtures does not prevent production startup
  evidence: clean startup smoke test with fixtures absent
- gate_id: CR-COLD-BACKUP-INACCESSIBLE
  assertion: Hermes, Skills and retrieval cannot access cold backup
  evidence: path denylist and runtime mount/config inspection
- gate_id: CR-MODEL-CONTEXT-CLEAN
  assertion: No old data enters model context
  evidence: ModelGateway input hash/source manifest contains no legacy refs
- gate_id: CR-CLEAN-ROOM-TESTS
  assertion: clean-room tests pass
  evidence: dedicated test command output
forbidden_after_cleaning:
- production read of data/creation.db
- production read of cold archive
- old DNA/model output in formal artifact tables
- old topics/drafts imported
- fixture path in production config
required_before_phase_2:
- review LEGACY_DATA_INVENTORY.yaml
- review FIXTURE_RETENTION_MANIFEST.yaml
- approve cold backup location outside project and production load paths
- approve production code fallback remediation plan
