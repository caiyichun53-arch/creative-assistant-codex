    - ".agents/skills/creation-banned-check/SKILL.md references scripts/content/check_banned.py."
    - ".agents/skills/creation-save-draft/SKILL.md references scripts/content/save_draft.py."
    - "README.md and BUILD_PLAN.md still document scripts/db/init_db.py, scripts/run_daily.py, scripts/reverse/dna.py, scripts/collect, scripts/analyze, scripts/feishu and tools/asr entrypoints."
