    - "V0.6.2 Scheduler registration is only in scripts/core/**."
    - "Legacy scheduled entry is documented as Windows Task Scheduler -> scripts/run_daily.py in BUILD_PLAN.md; it is not registered in Goal03Scheduler."
  rc_safe_to_remove_summary:
    count: 0
    reason: "No tracked legacy code met all removal criteria because every candidate still has at least one of: local skill/doc reference, migration/history compatibility responsibility, adapter reuse value, fixture/replay value, or rollback value."

