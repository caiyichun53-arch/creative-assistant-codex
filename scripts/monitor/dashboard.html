<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>创作助手 · 框架监控面板</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8a90a0;
    --ok: #3ecf8e;
    --warn: #e8b339;
    --bad: #e5534b;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h3 {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1f2330;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .badge .n { font-weight: 700; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .dot.neutral { background: var(--accent); }
  .empty { color: var(--muted); font-style: italic; }

  section { margin-bottom: 28px; }
  section h2 {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: #1c2130; }
  tr.attempts-row td { background: #10131a; }
  code { color: var(--accent); }
  .status-pill { padding: 1px 8px; border-radius: 999px; font-size: 11.5px; }
  .status-succeeded, .status-approved, .status-completed, .status-verified, .status-active { background: rgba(62,207,142,0.15); color: var(--ok); }
  .status-failed, .status-rejected, .status-dead, .status-cancelled, .status-deprecated { background: rgba(229,83,75,0.15); color: var(--bad); }
  .status-queued, .status-leased, .status-pending, .status-running, .status-candidate, .status-selected, .status-researching, .status-checking, .status-planned, .status-proposed, .status-paused, .status-draft, .status-sent { background: rgba(91,140,255,0.15); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>框架监控面板</h1>
  <span class="meta" id="db-path">数据库: -</span>
  <span class="meta" id="last-updated">最后更新: -</span>
</header>
<main>
  <div class="cards" id="summary-cards"></div>

  <section>
    <h2>任务队列(scheduler_job)</h2>
    <table>
      <thead><tr><th>任务ID</th><th>类型</th><th>状态</th><th>尝试次数</th><th>计划执行时间</th><th>更新时间</th></tr></thead>
      <tbody id="jobs-body"></tbody>
    </table>
  </section>

  <section>
    <h2>审计日志(audit_event)</h2>
    <table>
      <thead><tr><th>创建时间</th><th>事件类型</th><th>操作者</th><th>对象类型</th><th>对象ID</th></tr></thead>
      <tbody id="audit-body"></tbody>
    </table>
  </section>

  <section>
    <h2>发件箱(outbox_message)</h2>
    <table>
      <thead><tr><th>发件ID</th><th>主题</th><th>状态</th><th>尝试次数</th><th>更新时间</th></tr></thead>
      <tbody id="outbox-body"></tbody>
    </table>
  </section>

  <section>
    <h2>技能执行记录(runtime_probe_skill_run)</h2>
    <table>
      <thead><tr><th>创建时间</th><th>技能名称</th><th>绑定名称</th><th>模型路由</th><th>状态</th></tr></thead>
      <tbody id="skillruns-body"></tbody>
    </table>
  </section>
</main>

<script>
const REFRESH_MS = 5000;
const STATE_KINDS = ["production_task", "topic", "claim", "experiment", "tactic"];

const CARD_LABELS = {
  scheduler_job: "任务队列",
  outbox_message: "发件箱消息",
  command_receipt: "命令回执",
  skill_run: "技能执行",
};

const STATE_KIND_LABELS = {
  production_task: "生产任务",
  topic: "选题",
  claim: "结论",
  experiment: "实验",
  tactic: "打法",
};

const STATUS_LABELS = {
  queued: "排队中",
  leased: "执行中",
  succeeded: "成功",
  failed: "失败",
  cancelled: "已取消",
  dead: "已终止",
  pending: "待发送",
  sent: "已发送",
  rejected: "已拒绝",
  draft: "草稿",
  running: "运行中",
  completed: "已完成",
  candidate: "候选",
  selected: "已选中",
  researching: "研究中",
  planned: "已规划",
  approved: "已批准",
  proposed: "已提出",
  checking: "核实中",
  verified: "已核实",
  active: "活跃",
  paused: "已暂停",
  deprecated: "已弃用",
};

function statusLabel(status) {
  return STATUS_LABELS[status] || status;
}

const expandedJobIds = new Set();

function dotClass(status) {
  const ok = ["succeeded", "approved", "completed", "verified", "active", "sent"];
  const bad = ["failed", "rejected", "dead", "cancelled", "deprecated"];
  if (ok.includes(status)) return "ok";
  if (bad.includes(status)) return "bad";
  return "neutral";
}

function badgeRow(counts) {
  const entries = Object.entries(counts || {});
  if (!entries.length) return '<span class="empty">暂无数据</span>';
  return '<div class="badge-row">' + entries.map(([k, n]) =>
    `<span class="badge"><span class="dot ${dotClass(k)}"></span>${statusLabel(k)}<span class="n">${n}</span></span>`
  ).join("") + "</div>";
}

function statusPill(status) {
  return `<span class="status-pill status-${status}">${statusLabel(status)}</span>`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function renderSummary(summary) {
  const cards = [];
  cards.push(`<div class="card"><h3>${CARD_LABELS.scheduler_job}</h3>${badgeRow(summary.scheduler_job_by_status)}</div>`);
  cards.push(`<div class="card"><h3>${CARD_LABELS.outbox_message}</h3>${badgeRow(summary.outbox_message_by_status)}</div>`);
  cards.push(`<div class="card"><h3>${CARD_LABELS.command_receipt}</h3>${badgeRow(summary.command_receipt_by_status)}</div>`);
  cards.push(`<div class="card"><h3>${CARD_LABELS.skill_run}</h3>${badgeRow(summary.skill_run_by_status)}</div>`);
  for (const kind of STATE_KINDS) {
    cards.push(`<div class="card"><h3>${STATE_KIND_LABELS[kind]}</h3>${badgeRow(summary.state_by_object_kind[kind])}</div>`);
  }
  document.getElementById("summary-cards").innerHTML = cards.join("");
}

function renderJobs(jobs) {
  const body = document.getElementById("jobs-body");
  if (!jobs.length) {
    body.innerHTML = '<tr><td colspan="6" class="empty">暂无任务</td></tr>';
    return;
  }
  body.innerHTML = jobs.map(j => `
    <tr class="job-row" data-job-id="${escapeHtml(j.job_id)}">
      <td><code>${escapeHtml(j.job_id).slice(0, 12)}…</code></td>
      <td>${escapeHtml(j.job_kind)}</td>
      <td>${statusPill(j.status)}</td>
      <td>${j.attempt_count}/${j.max_attempts}</td>
      <td>${escapeHtml(j.run_after)}</td>
      <td>${escapeHtml(j.updated_at)}</td>
    </tr>
  `).join("");

  async function showAttempts(row, jobId) {
    const attempts = await getJSON(`/api/jobs/${encodeURIComponent(jobId)}/attempts`);
    const html = attempts.length
      ? attempts.map(a => `第 ${a.attempt_no} 次尝试:${statusLabel(a.status)}(worker=${escapeHtml(a.worker_id)}, 开始=${escapeHtml(a.started_at)}, 结束=${escapeHtml(a.finished_at || "-")})`).join("<br>")
      : '<span class="empty">暂无尝试记录</span>';
    const tr = document.createElement("tr");
    tr.className = "attempts-row";
    tr.innerHTML = `<td colspan="6">${html}</td>`;
    row.after(tr);
  }

  body.querySelectorAll("tr.job-row").forEach(row => {
    const jobId = row.dataset.jobId;
    if (expandedJobIds.has(jobId)) {
      showAttempts(row, jobId);
    }
    row.addEventListener("click", () => {
      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains("attempts-row")) {
        existing.remove();
        expandedJobIds.delete(jobId);
        return;
      }
      expandedJobIds.add(jobId);
      showAttempts(row, jobId);
    });
  });
}

function renderAudit(events) {
  const body = document.getElementById("audit-body");
  body.innerHTML = events.length
    ? events.map(e => `
      <tr>
        <td>${escapeHtml(e.created_at)}</td>
        <td>${escapeHtml(e.event_type)}</td>
        <td>${escapeHtml(e.actor)}</td>
        <td>${escapeHtml(e.object_kind)}</td>
        <td><code>${escapeHtml(e.object_id).slice(0, 12)}…</code></td>
      </tr>
    `).join("")
    : '<tr><td colspan="5" class="empty">暂无审计事件</td></tr>';
}

function renderOutbox(messages) {
  const body = document.getElementById("outbox-body");
  body.innerHTML = messages.length
    ? messages.map(m => `
      <tr>
        <td><code>${escapeHtml(m.outbox_id).slice(0, 12)}…</code></td>
        <td>${escapeHtml(m.topic)}</td>
        <td>${statusPill(m.status)}</td>
        <td>${m.attempts}</td>
        <td>${escapeHtml(m.updated_at)}</td>
      </tr>
    `).join("")
    : '<tr><td colspan="5" class="empty">暂无发件箱消息</td></tr>';
}

function renderSkillRuns(runs) {
  const body = document.getElementById("skillruns-body");
  body.innerHTML = runs.length
    ? runs.map(r => `
      <tr>
        <td>${escapeHtml(r.created_at)}</td>
        <td>${escapeHtml(r.skill_name)}</td>
        <td>${escapeHtml(r.binding_name)}</td>
        <td>${escapeHtml(r.model_route)}</td>
        <td>${statusPill(r.status)}</td>
      </tr>
    `).join("")
    : '<tr><td colspan="5" class="empty">暂无技能执行记录</td></tr>';
}

async function refresh() {
  try {
    const [summary, jobs, audit, outbox, skillRuns] = await Promise.all([
      getJSON("/api/summary"),
      getJSON("/api/jobs?limit=50"),
      getJSON("/api/audit?limit=50"),
      getJSON("/api/outbox?limit=50"),
      getJSON("/api/skill-runs?limit=50"),
    ]);
    renderSummary(summary);
    renderJobs(jobs);
    renderAudit(audit);
    renderOutbox(outbox);
    renderSkillRuns(skillRuns);
    document.getElementById("db-path").textContent = `数据库: 共 ${summary.table_rows ? Object.keys(summary.table_rows).length : 0} 张表`;
    document.getElementById("last-updated").textContent = `最后更新: ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    document.getElementById("last-updated").textContent = `出错: ${err.message}`;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
