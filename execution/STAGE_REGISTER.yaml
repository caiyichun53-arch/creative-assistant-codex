default_allowed_files:
  - AGENTS.md
  - execution/STAGE_REGISTER.yaml
  - scripts/execution/stage_control.py
  - docs/IMPLEMENTATION_EXECUTION_BASELINE.md
  - docs/*.md
  - tests/*.py
  - tests/core/*.py
  - .gitignore

protected_files:
  - docs/EFFECTIVE_DESIGN_BASELINE.md
  - data/**
  - config/model_routes.yaml
  - BUSINESS_MODEL_ROUTE_REGISTRY.yaml

forbidden_modes:
  - mock
  - fixture-only
  - temp-entry
  - internal-direct-call
  - production_daily
  - external-call
  - formal-data-write
  - model-call

forbidden_rules:
  - id: fallback_or_silent_degrade
    description: "Do not add automatic fallback, provider downgrade, or silent recovery paths."
    pattern: "(?i)(auto(?:matic)?[_ -]?fallback|silent[_ -]?fallback|provider[_ -]?downgrade|fallback\\s*=)"
  - id: temporary_bypass_entry
    description: "Do not add temporary bypasses, direct internal-call acceptance, or side-entry workflow execution."
    pattern: "(?i)(temporary[_ -]?bypass|side[_ -]?entry|direct[_ -]?call|fixture[_ -]?only|mock[_ -]?acceptance)"

stop_conditions:
  - "The baseline hash does not match baseline.sha256."
  - "No unique eligible type=business Stage can be selected."
  - "A dependency status is missing or conflicts with depends_on."
  - "A changed file is outside the selected Stage scope."
  - "A protected file is modified."
  - "The selected Stage requires explicit authorization before real workflow execution."
  - "A business rule change is required to continue."

