schema_version: formal_skill_route_mapping.v1
goal: GOAL-RUNTIME-BUSINESS-SKILL-ADAPTER-01
source_policy:
  primary_sources:
    - C:\Users\15891\.codex\attachments\655209ca-4f74-4a46-b971-d0ae32beb2df\pasted-text-1.txt
    - AGENTS.md
    - BUILD_PLAN.md
    - BUSINESS_MODEL_ROUTE_REGISTRY.yaml
  unavailable_sources:
    - target-architecture.md
    - rebuild-direction.md
  note: The repo and Codex memory search did not find target-architecture.md or rebuild-direction.md; BUILD_PLAN.md, AGENTS.md and the pasted goal remain the available governing sources.
mapping_policy:
  formal_skills_are_business_capabilities: true
  existing_business_nodes_are_model_routes: true
  do_not_treat_model_nodes_as_skills: true
  each_existing_model_node_maps_to_one_formal_skill_role: true
  multiple_model_nodes_may_be_subnodes_of_one_formal_skill: true
  unmapped_existing_production_model_nodes_allowed: false
formal_skills:
  - formal_skill_id: content_classify
    version: 1.0.0
    source_document: CONTENT_CLASSIFY_BUSINESS_CONTRACT.yaml
    responsibility: Classify isolated public content text into the formal domain taxonomy, or return formal uncertain/no-result semantics when evidence is insufficient or unsuitable.
    input_schema: content_classify.input_schema.v1
    output_schema: content_classify.output_schema.v1
    allowed_model_nodes:
      - business.topic_judgement
    execution_order: 10
    whether_model_is_required: true
    target_runner: FormalBusinessSkillAdapter
    materializer_contract: formal_business_skill_result.v1
    status: active_formal_business_skill
    evidence:
      - Active formal content_classify Skill for GOAL-BUSINESS-SKILL-CONTENT-CLASSIFY-01.
      - Uses business.topic_judgement only through ModelGateway with formal fixtures and live Provider validation.
      - Scope excludes relation judgement, viral judgement, research, creation, review, DB reads, file reads, Feishu messaging, and other Skill invocation.

  - formal_skill_id: content_relation_judge
    version: 1.0.0
    source_document: CONTENT_RELATION_JUDGE_BUSINESS_CONTRACT.yaml
    responsibility: Judge the formal content relation between two already provided public content objects or evidence units.
    input_schema: content_relation_judge.input_schema.v1
    output_schema: content_relation_judge.output_schema.v1
    allowed_model_nodes:
      - business.content_relation_judgement
    execution_order: 20
    whether_model_is_required: true
    target_runner: FormalBusinessSkillAdapter
    materializer_contract: formal_business_skill_result.v1
    status: active_formal_business_skill
    evidence:
      - Formal relation taxonomy and directionality supplied by the GOAL-BUSINESS-SKILL-CONTENT-RELATION-JUDGE-01 semantic ruling.
      - Uses business.content_relation_judgement only through ModelGateway with formal fixtures and live Provider validation.
      - Kept separate from content_classify so business.topic_judgement does not silently absorb relation judgement.

  - formal_skill_id: source_to_topic
    version: 1.0.0
    source_document: SOURCE_TO_TOPIC_BUSINESS_CONTRACT.yaml
    responsibility: Transform source evidence into a candidate topic.
    input_schema: source_to_topic.input_schema.v1
    output_schema: source_to_topic.output_schema.v1
    allowed_model_nodes:
      - business.source_to_topic
    execution_order: 30
    whether_model_is_required: true
    target_runner: FormalBusinessSkillAdapter
    materializer_contract: formal_business_skill_result.v1
    status: active_formal_business_skill
    evidence:
      - Not mapped to business.topic_judgement because generation from source is not classification.
      - Uses dedicated business.source_to_topic route through ModelGateway.
      - Formal source_to_topic Skill package implemented for GOAL-V0.6.2-PRODUCTION-COMPLETION-01 Phase 2.

  - formal_skill_id: sample_deep_analyze
    version: 1.0.0
    source_document: SAMPLE_DEEP_ANALYZE_BUSINESS_CONTRACT.yaml
    responsibility: Analyze one validated winner sample into deep DNA notes.
    input_schema: sample_deep_analyze.input_schema.v1
    output_schema: sample_deep_analyze.output_schema.v1
    allowed_model_nodes:
      - business.reverse_dna_analysis
    execution_order: 40
    whether_model_is_required: true
    target_runner: FormalBusinessSkillAdapter
    materializer_contract: formal_business_skill_result.v1
    status: active_formal_business_skill
    evidence:
      - AGENTS.md separates deterministic prep from LLM reverse DNA analysis.
      - Formal sample_deep_analyze Skill package implemented for GOAL-V0.6.2-PRODUCTION-COMPLETION-01 Phase 2.

  - formal_skill_id: tactic_extract
    version: 1.0.0
    source_document: TACTIC_EXTRACT_BUSINESS_CONTRACT.yaml
    responsibility: Reduce multiple sample analyses into reusable tactics.
    input_schema: tactic_extract.input_schema.v1
    output_schema: tactic_extract.output_schema.v1
