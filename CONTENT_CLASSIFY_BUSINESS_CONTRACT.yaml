schema_version: content_classify.business_contract.v1
goal: GOAL-BUSINESS-SKILL-CONTENT-CLASSIFY-01
skill_id: content_classify
skill_version: 1.0.0
source_documents:
  - C:\Users\15891\.codex\attachments\3464f3ae-7795-498e-a0f4-cc0a2d1c2153\pasted-text-1.txt
  - AGENTS.md
  - BUILD_PLAN.md
  - FORMAL_SKILL_ROUTE_MAPPING.yaml
responsibility: Classify an isolated public content text into the formal domain taxonomy, or return a formal no-result/uncertain outcome when the evidence is insufficient or unsuitable.
non_responsibilities:
  - content_relation_judge
  - viral_or_hit_judgement
  - account_baseline_calculation
  - deep_sample_analysis
  - tactic_extract
  - topic_generation
  - research
  - creation
  - review
  - status_transition
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
allowed_inputs:
  source: public_input_binding_only
  required_fields:
    - request_id
    - correlation_id
    - content_id
    - title
    - body
    - evidence_items
    - language_hint
    - domain_hint
  note: Inputs are synthetic or explicitly isolated validation fixtures in this goal.
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - business_status_code
  - file_path
  - hermes_chat_memory
  - legacy_data_reference
  - cold_backup_reference
classification_taxonomy:
  labels:
    fan_kepu_social_life:
      description: General popular-science or social-life explanatory content.
    music_entertainment:
      description: Music or entertainment content, including artists, songs, albums, performances, and industry stories.
    third_domain_neutral:
      description: Neutral placeholder for a domain outside the current two named domains; it only proves extensibility.
    cross_domain:
      description: Content materially spans two or more taxonomy labels and must not be forced into one label.
    not_classifiable:
      description: Content is present but should not be classified as a domain item.
    none:
      description: No label is assigned because status is no_result.
  status_values:
    classified: One primary label is supported by the input evidence.
    multiple_candidates: More than one candidate label is supported and the Skill must expose the ambiguity.
    uncertain: Evidence is conflicting, noisy, or too weak to make a stable classification.
    no_result: The input is empty, non-content, unsupported, or otherwise cannot produce a classification.
output_enums:
  classification_status:
    - classified
    - multiple_candidates
    - uncertain
    - no_result
  primary_label:
    - fan_kepu_social_life
    - music_entertainment
    - third_domain_neutral
    - cross_domain
    - not_classifiable
    - none
  no_result_reason:
    - none
    - empty_text
    - insufficient_information
    - non_content
    - unsupported_language
    - model_empty_result
  uncertainty_reason:
    - none
    - multiple_supported_domains
    - title_body_conflict
    - noisy_input
    - weak_evidence
    - mixed_language_boundary
  confidence:
    - high
    - medium
    - low
    - none
no_result_semantics:
  no_result_must_not_force_label: true
  primary_label_when_no_result: none
  confidence_when_no_result: none
  allowed_reasons:
    - empty_text
    - insufficient_information
    - non_content
    - unsupported_language
    - model_empty_result
uncertainty_semantics:
  uncertain_must_preserve_ambiguity: true
  multiple_candidates_requires_two_or_more_candidate_labels: true
  weak_or_conflicting_evidence_must_not_be_forced_into_existing_domains: true
evidence_requirements:
  evidence_items_min: 1
  evidence_items_max: 8
  output_evidence_must_reference_input_evidence: true
  rationale_must_not_add_unseen_facts: true
confidence_policy:
  type: enum_only
  no_numeric_thresholds: true
  high: Clear single-domain evidence in title/body and evidence_items.
  medium: Clear classification with minor noise or limited context.
  low: Weak but usable evidence, normally paired with uncertain or multiple_candidates.
  none: Required for no_result.
domain_scope:
  primary_domains:
    - fan_kepu_social_life
    - music_entertainment
  extensibility_placeholder:
    - third_domain_neutral
cross_domain_behavior:
  status: multiple_candidates
  primary_label: cross_domain
  requirement: Preserve all supported candidate_labels instead of forcing one current domain.
third_domain_behavior:
  label: third_domain_neutral
  limitation: Passing third-domain fixtures proves extensibility only, not third-domain business quality.
timeout:
  milliseconds: 30000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - model_empty_result
    - output_schema_error
idempotency:
  key: content_classify:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: formal_no_result_when_model_returns_valid_no_result_otherwise_fail_attempt
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
test_cases:
  required_fixture_ids:
    - fan_kepu_single
    - music_entertainment_single
    - third_domain_neutral
    - multiple_domain_candidates
    - uncertain_weak_evidence
    - insufficient_information
    - empty_text
    - overlong_text
    - title_body_conflict
    - noisy_input
    - cross_domain_content
    - not_classifiable_content
    - mixed_language_boundary
    - model_empty_result
    - non_json_output
    - illegal_enum_output
    - missing_output_field
completion_definition:
  - business_contract_complete
  - no_missing_requirement_for_current_formal_sources
  - formal_skill_package_active
  - fake_fixture_matrix_passed
  - minimal_live_provider_call_passed
  - postgresql_end_to_end_gate_passed
  - clean_room_formal_db_all_zero
  - formal_production_direct_cli_model_calls_zero
missing_requirements: []
allowed_model_nodes:
  - business.topic_judgement
whether_model_is_required: true
target_runner: FormalBusinessSkillAdapter
materializer_contract: formal_business_skill_result.v1
model_binding:
  route_name: business.topic_judgement
  route_id: business_analysis
  binding_name: content_classify_public_input_to_topic_judgement
  binding_version: 1.0.0
  input_map:
    fixture_id:
      source: input
      key: request_id
    candidate_topic:
      source: preprocessed
      key: content_text
    evidence_refs:
      source: input
      key: evidence_items
    taxonomy:
      source: literal
      value:
        - fan_kepu_social_life
        - music_entertainment
        - third_domain_neutral
        - cross_domain
        - not_classifiable
        - none
  model_input_schema:
    type: object
    required:
      - fixture_id
      - candidate_topic
      - evidence_refs
      - taxonomy
    properties:
      fixture_id: string
      candidate_topic: string
      evidence_refs: array
      taxonomy: array
    additional_properties: false
  prompt_template: >-
    Return only JSON with keys classification_status, primary_label, candidate_labels,
    no_result_reason, uncertainty_reason, confidence, rationale, evidence_used, schema_version.
    Classify only the content domain. Do not judge quality, popularity, strategy, relation,
    research value, or writing suggestions. Allowed labels: fan_kepu_social_life,
    music_entertainment, third_domain_neutral, cross_domain, not_classifiable, none.
    Allowed statuses: classified, multiple_candidates, uncertain, no_result.
    Use schema_version content_classify.output.v1. evidence_used must be selected only from evidence_refs.
    candidate_topic={candidate_topic}; evidence_refs={evidence_refs}; taxonomy={taxonomy}
  model_output_schema:
    type: object
    required:
      - classification_status
      - primary_label
      - candidate_labels
      - no_result_reason
      - uncertainty_reason
      - confidence
      - rationale
      - evidence_used
      - schema_version
    properties:
      classification_status:
        type: string
        enum:
          - classified
          - multiple_candidates
          - uncertain
          - no_result
      primary_label:
        type: string
        enum:
          - fan_kepu_social_life
          - music_entertainment
          - third_domain_neutral
          - cross_domain
          - not_classifiable
          - none
      candidate_labels:
        type: array
        minItems: 0
        maxItems: 5
        items:
          type: string
          enum:
            - fan_kepu_social_life
            - music_entertainment
            - third_domain_neutral
            - cross_domain
            - not_classifiable
      no_result_reason:
        type: string
        enum:
          - none
          - empty_text
          - insufficient_information
          - non_content
          - unsupported_language
          - model_empty_result
      uncertainty_reason:
        type: string
        enum:
          - none
          - multiple_supported_domains
          - title_body_conflict
          - noisy_input
          - weak_evidence
          - mixed_language_boundary
      confidence:
        type: string
        enum:
          - high
          - medium
          - low
          - none
      rationale:
        type: string
        minLength: 1
      evidence_used:
        type: array
        minItems: 0
        maxItems: 8
        items:
          type: string
      schema_version:
        type: string
        const: content_classify.output.v1
    additional_properties: false
  output_map:
    classification_status:
      source: model_output
      key: classification_status
    primary_label:
      source: model_output
      key: primary_label
    candidate_labels:
      source: model_output
      key: candidate_labels
    no_result_reason:
      source: model_output
      key: no_result_reason
    uncertainty_reason:
      source: model_output
      key: uncertainty_reason
    confidence:
      source: model_output
      key: confidence
    rationale:
      source: model_output
      key: rationale
    evidence_used:
      source: model_output
      key: evidence_used
    schema_version:
      source: model_output
      key: schema_version
  deterministic_output_normalization:
    nullable_none_fields:
      - no_result_reason
      - uncertainty_reason
    nullable_empty_arrays:
      - candidate_labels
      - evidence_used
    numeric_confidence_to_enum: true
    classified_primary_label_backfills_candidate_labels: true
