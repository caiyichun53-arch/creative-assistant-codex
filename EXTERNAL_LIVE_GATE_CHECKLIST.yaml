status: PLAN_ONLY_NO_LIVE_EXECUTION
baseline:
  release_branch: release/v0.6.2-rc1
  validation_branch: validation/v0.6.2-live-gates
  rc_tag: v0.6.2-rc1
  goal_12_status: GOAL-12_COMPLETE_WITH_EXTERNAL_LIVE_GATES
safety_rules:
  production_database: forbidden
  production_accounts: forbidden
  real_publish: forbidden
  platform_production_mutation: forbidden
  full_production_deploy: forbidden
  business_code_changes: forbidden
  migration_changes: forbidden
  existing_test_changes: forbidden
  secret_commit: forbidden
  legacy_retirement_execution: forbidden
evidence_root: validation_artifacts/v0.6.2-live-gates
gates:
  - gate_id: GATE-HERMES-REAL-HOST
    validation_goal: Real host invocation enters Hermes, maps to Core, creates or transitions state, enqueues response and replays idempotently.
    current_entrypoints:
      - scripts/core/hermes/goal11_host_binding.py
      - HermesInboundMessage
      - HermesCoreBridge
      - FeishuThinBinding
      - FeishuResponseDispatcher
      - RuntimeHost outbox.dispatch
    required_accounts_credentials_environment:
      - non-production host endpoint or local host runner
      - test actor identity
      - isolated SQLite or disposable PostgreSQL database
      - disposable reply channel
    config_example_status: partial
    isolated_database: data/validation/live_gates/v0.6.2/hermes_host.sqlite
    possible_external_side_effects:
      - host callback receipt
      - reply outbox dispatch to test channel
      - isolated audit records
    prohibited_operations:
      - production Core database writes
      - live user/channel replies
      - unsupported command types
      - direct Core calls bypassing HermesCoreBridge
    recommended_command_or_entrypoint:
      future_live: python scripts/validation/live_gates/run_hermes_host_gate.py --db <isolated-db> --host test
      fixture_reference: python scripts/core/hermes/verify_goal_11.py
    fixture_validated:
      - Feishu binding maps only to Hermes message
      - duplicate events replay without duplicate state or response
      - fake response dispatch retries without duplicate send
      - GOAL-12 staging exercised Hermes to Core to response outbox
    live_remaining:
      - real host envelope shape
      - external event id stability
      - auth boundary and actor mapping
      - response dispatch against disposable channel
      - live retry and idempotency behavior
    pass_conditions:
      - one Core command receipt per unique external event
      - replay returns original result
      - response outbox created once and dispatched once
      - evidence captured under gate evidence root
    stop_conditions:
      - production database write
      - duplicate command receipt for same idempotency key
      - unexpected host command type
      - response to non-test channel
    rollback:
      - revoke test host token
      - stop validation runner
      - archive isolated database and logs
      - discard isolated database after review
    evidence_location: validation_artifacts/v0.6.2-live-gates/GATE-HERMES-REAL-HOST
    required_before_production: true
    currently_executable: false
    missing_conditions:
      - live harness
      - non-production host endpoint
      - disposable reply channel

  - gate_id: GATE-FEISHU-THIN-BINDING
