  - gate_id: GATE-CONTINUOUS-FAULT-RECOVERY
    validation_goal: Bounded live validation runtime recovers leases, retries safely and stops without duplicate external effects.
    current_entrypoints:
      - scripts/core/scheduler/goal03_scheduler.py
      - scripts/core/runtime/goal04_runtime_host.py
      - RuntimeHost.run_once
      - RuntimeHost.run_batch
      - scripts/core/staging/verify_goal_12.py
    required_accounts_credentials_environment:
      - isolated database
      - validation worker identity
      - disposable test credentials for providers in run
      - provider/test fault injection controls
      - approved duration and max cost/request budget
    config_example_status: partial
    isolated_database: data/validation/live_gates/v0.6.2/continuous_fault_recovery.sqlite
    possible_external_side_effects:
      - repeated test-channel messages
      - repeated test provider calls
      - provider rate-limit events
      - local log/database growth
    prohibited_operations:
      - full production deployment
      - unbounded loops
      - production credentials
      - automatic output promotion
      - destructive cleanup while active
    recommended_command_or_entrypoint:
      future_live: python scripts/validation/live_gates/run_continuous_fault_recovery_gate.py --db <isolated-db> --duration-minutes <n> --max-external-calls <n>
      fixture_reference: python scripts/core/staging/verify_goal_12.py
    fixture_validated:
      - expired lease recovery with FakeClock
      - five deterministic outbox jobs
      - handler failure retry path
      - clean-room deletion after validation assets are removed
    live_remaining:
      - real wall-clock lease expiry
      - provider/network failure retry behavior
      - external rate-limit handling
      - worker restart/resume from isolated database
      - bounded process supervision
    pass_conditions:
      - agreed duration or job count completes
      - retries stay within max attempts
      - no duplicate external side effects after restart/retry
      - stop command halts worker without DB corruption
    stop_conditions:
      - unbounded retry loop
      - duplicate external side effect
      - cost/request cap exceeded
      - writes outside isolated DB/log root
    rollback:
      - stop validation worker
      - revoke or rotate escaped test credentials
      - restore isolated DB from pre-run backup
      - archive logs for review
    evidence_location: validation_artifacts/v0.6.2-live-gates/GATE-CONTINUOUS-FAULT-RECOVERY
    required_before_production: true
    currently_executable: false
    missing_conditions:
      - live continuous harness
      - passed individual provider gates
      - run duration and budget approval
      - explicit approval to call external test services
