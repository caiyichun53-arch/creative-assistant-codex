    current_entrypoints:
      - scripts/core/hermes/goal11_host_binding.py
      - FeishuBindingEvent
      - FeishuThinBinding
      - FeishuResponseDispatcher
      - scripts/feishu/client.py
      - scripts/feishu/push.py
    required_accounts_credentials_environment:
      - Feishu test tenant
      - test app id
      - test app secret
      - disposable test chat id
      - event verification/signature material if receiving events
      - isolated database
    config_example_status: partial
    isolated_database: data/validation/live_gates/v0.6.2/feishu_binding.sqlite
    possible_external_side_effects:
      - test chat messages
      - tenant token issuance
      - Feishu event delivery logs
    prohibited_operations:
      - sending to production chats
      - production Feishu app credentials
      - modifying Feishu docs/sheets/official data
      - relying on production lark-cli profile
    recommended_command_or_entrypoint:
      future_live: python scripts/validation/live_gates/run_feishu_binding_gate.py --db <isolated-db> --chat <test-chat-id>
      fixture_reference: python scripts/core/hermes/verify_goal_11.py
    fixture_validated:
      - required binding fields
      - duplicate event replay
      - fake response retry and idempotent send receipt
    live_remaining:
      - Feishu payload normalization
      - tenant token acquisition
      - API send result and message id capture
      - event retry behavior
      - receive/reply permission scopes
    pass_conditions:
      - one test event creates one Hermes/Core receipt
      - one response reaches only test chat
      - repeated delivery does not duplicate state or reply
      - secrets redacted from evidence
    stop_conditions:
      - message reaches non-test chat
      - token or secret appears in logs
      - broad production scope required
      - duplicate reply on retry
    rollback:
      - remove bot from test chat
      - revoke or rotate test app secret
      - disable event subscription
      - delete only disposable validation data after review
    evidence_location: validation_artifacts/v0.6.2-live-gates/GATE-FEISHU-THIN-BINDING
    required_before_production: true
    currently_executable: false
    missing_conditions:
      - Feishu test tenant/app/chat
      - live harness
      - explicit approval to call Feishu

