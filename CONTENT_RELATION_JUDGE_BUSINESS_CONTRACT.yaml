  - formal_production_direct_cli_model_calls_zero
missing_requirements:
  - id: relation_taxonomy
    severity: blocking
    detail: No latest formal source defines the allowed relation_type enum values.
  - id: relation_directionality
    severity: blocking
    detail: No latest formal source defines symmetric/asymmetric relation types or left/right swap reversal rules.
  - id: no_relation_vs_insufficient_evidence
    severity: blocking
    detail: Formal sources require the distinction but do not define concrete output states.
  - id: primary_relation_policy
    severity: blocking
    detail: No latest formal source defines how to select a primary relation when multiple relations may apply.
  - id: confidence_policy
    severity: blocking
