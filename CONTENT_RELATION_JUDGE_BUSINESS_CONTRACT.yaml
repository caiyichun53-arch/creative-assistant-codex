  - FORMAL_SKILL_ROUTE_MAPPING.yaml: formal_skills.content_relation_judge
  - BUSINESS_RULE_CATALOG.yaml: BR-REL-001
  - REQUIREMENT_CODE_TRACEABILITY.yaml: BR-REL-001
responsibility: Judge the formal relation between two already provided public content objects or evidence units, once the formal relation taxonomy and direction semantics exist.
non_responsibilities:
  - content_classify
  - viral_or_hit_judgement
  - account_baseline_calculation
  - topic_generation
  - fact_research
  - deep_sample_analysis
  - tactic_extract
  - creation
  - review
  - similarity_search
  - content_clustering
  - deduplication_writeback
  - status_transition
  - database_query
  - file_read_write
  - feishu_messaging
  - other_skill_invocation
relation_subject_definition:
  left: public, portable content object or evidence unit supplied by the caller
  right: public, portable content object or evidence unit supplied by the caller
  boundary: The Skill may only judge the relation between the supplied left and right inputs; it must not fetch, infer, or look up missing context.
allowed_inputs:
  required_public_shape:
    - request_id
    - correlation_id
    - left_content
    - right_content
    - left_evidence_items
    - right_evidence_items
    - domain_context
    - relation_scope
    - schema_version
  allowed_optional_public_fields:
    - left_title
    - right_title
    - left_local_ref
    - right_local_ref
    - frozen_non_sensitive_metadata
forbidden_inputs:
  - database_connection
  - orm_object
  - internal_table_name
  - legacy_database_id
  - business_status_code
  - local_file_path
  - dna_file_path
  - hermes_chat_memory
  - cookie_or_token
  - cold_backup_reference
  - url_that_skill_must_fetch
  - implicit_field_requiring_core_or_database_lookup
relation_taxonomy:
  status: missing_requirement
  allowed_relation_types: []
  missing_reason: Latest formal sources require an explicit relation artifact but do not define the formal relation enum values.
relation_directionality:
  status: missing_requirement
  missing_reason: Latest formal sources do not define which relation types are symmetric, asymmetric, reversible, or order-sensitive.
symmetric_relations:
  status: missing_requirement
  relation_types: []
asymmetric_relations:
  status: missing_requirement
  relation_types: []
order_sensitivity:
  status: missing_requirement
  rule: Cannot be implemented without a formal relation taxonomy and reversal rules.
same_item_semantics:
  status: missing_requirement
  missing_reason: Latest formal sources mention same-item fixture coverage but do not define the formal output for same-item inputs.
insufficient_evidence_semantics:
  status: missing_requirement
  distinction_required: Must be distinct from no_relation and technical_failure.
  missing_reason: Latest formal sources require the distinction but do not define the output enum/state.
no_relation_semantics:
  status: missing_requirement
  distinction_required: Must be distinct from insufficient_evidence and technical_failure.
  missing_reason: Latest formal sources require the distinction but do not define the output enum/state.
uncertainty_semantics:
  status: missing_requirement
  missing_reason: Latest formal sources do not define whether uncertainty is a relation_type, a status, or a separate field.
multiple_relation_policy:
  status: missing_requirement
  missing_reason: Latest formal sources require a primary relation policy but do not define it.
primary_relation_policy:
  status: missing_requirement
  missing_reason: Latest formal sources do not define priority ordering among possible relations.
evidence_requirements:
  output_evidence_must_reference_input: true
  evidence_from_left_required_when_available: true
  evidence_from_right_required_when_available: true
  rationale_must_not_add_unseen_facts: true
rationale_requirements:
  structured_rationale_required: true
  must_support_relation_type: true
  must_not_expose_prompt_or_internal_model_config: true
  must_not_emit_topic_creation_or_strategy_advice: true
confidence_policy:
  status: missing_requirement
  missing_reason: Latest formal sources mention confidence but do not define enum, numeric range, or threshold semantics.
domain_scope:
  current_named_domains:
    - fan_kepu_social_life
    - music_entertainment
  extensibility_required: true
cross_domain_behavior:
  status: missing_requirement
  missing_reason: Latest formal sources require cross-domain fixture coverage but do not define cross-domain relation semantics.
third_domain_behavior:
  fixture_limit: Third-domain fixture may only prove the Skill is not hardcoded to current two named domains.
  must_not_claim_business_quality_passed: true
input_length_limits:
  status: missing_requirement
  conservative_placeholder:
    request_id_max: 80
    correlation_id_max: 80
    title_max: 120
    content_max: 1200
    evidence_items_max: 8
context_budget:
  max_input_tokens: 2000
token_budget:
  max_output_tokens: 700
timeout:
  milliseconds: 30000
retry:
  provider_max_attempts_per_job: 1
  scheduler_max_attempts: 3
  retry_on:
    - provider_error
    - model_empty_result
    - output_schema_error
idempotency:
  key: content_relation_judge:{request_id}
  duplicate_same_request: replay_existing_job
  duplicate_different_request: reject
error_contract:
  validation_error: fail_without_formal_result
  provider_error: fail_attempt_and_retry_if_attempts_remain
  model_empty_result: fail_without_formal_result_until_no_result_semantics_are_defined
  schema_error: fail_without_formal_result
  materializer_error: fail_without_success_outbox
materialization_contract:
  object_kind: formal_business_skill_result
  projection_version: formal_business_skill_result.v1
  result_index: formal_business_skill_result_index
  success_outbox_topic: formal_business_skill.result.materialized
  failed_runs_record_attempt: true
  failed_runs_create_formal_result: false
