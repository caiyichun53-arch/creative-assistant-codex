relation_taxonomy:
  relation_types:
    same_item:
      definition: Normalized content is exactly the same, or both inputs explicitly refer to the same public content object.
      direction: symmetric
      boundary: Same title alone is insufficient.
    equivalent:
      definition: Wording, order, or examples may differ, but core facts, core viewpoint, and main information are materially the same.
      direction: symmetric
      boundary: If one side has material new information, use contains, contained_by, or complementary.
    contains:
      definition: Left fully covers the core content of right and has additional valid information.
      direction: left_contains_right
      swapped_relation: contained_by
    contained_by:
      definition: Left core content is fully covered by right and right has additional valid information.
      direction: left_contained_by_right
      swapped_relation: contains
    complementary:
      definition: Both sides address the same specific topic or question, do not materially conflict, and provide different facts, evidence, angles, or explanations that can be combined.
      direction: symmetric
      boundary: Same broad domain alone is insufficient.
    contradicts:
      definition: Both sides address the same specific question, fact, or proposition and provide substantive conclusions that cannot both be true.
      direction: symmetric
      requirement: The conflicting proposition must be identified.
    related_distinct:
      definition: Both sides belong to the same specific topic, but core information or discussion angles are independent and none of the stronger relations apply.
      direction: symmetric
      purpose: Marks a concrete topic relation without merging the contents.
    no_relation:
      definition: Input evidence is sufficient and confirms no meaningful direct content relation.
      direction: symmetric
      requirement: Must not be used when evidence is insufficient.
    insufficient_evidence:
      definition: Missing, too short, noisy, ambiguous, or unclear input prevents a reliable relation judgement.
      direction: symmetric
      requirement: Must state the missing or insufficient evidence type.
relation_directionality:
  symmetric:
    - same_item
    - equivalent
    - complementary
    - contradicts
    - related_distinct
    - no_relation
    - insufficient_evidence
  asymmetric:
    - contains
    - contained_by
  swap_rules:
    same_item: same_item
    equivalent: equivalent
    contains: contained_by
    contained_by: contains
    complementary: complementary
    contradicts: contradicts
    related_distinct: related_distinct
    no_relation: no_relation
    insufficient_evidence: insufficient_evidence
symmetric_relations:
  - same_item
  - equivalent
  - complementary
  - contradicts
  - related_distinct
  - no_relation
  - insufficient_evidence
asymmetric_relations:
  - contains
  - contained_by
order_sensitivity:
  asymmetric_relations_must_reverse_on_swap: true
  evidence_fields_must_swap: true
  rationale_must_remain_semantically_consistent: true
same_item_semantics:
  relation_type: same_item
  allowed_when:
    - normalized_content_exactly_same
    - explicit_same_public_content_object_reference
  forbidden_when:
    - title_only_same
insufficient_evidence_semantics:
  relation_type: insufficient_evidence
  business_result: true
  requires_missing_evidence: true
  distinct_from_no_relation: true
  distinct_from_technical_failure: true
no_relation_semantics:
  relation_type: no_relation
  business_result: true
  requires_sufficient_comparison: true
  distinct_from_insufficient_evidence: true
  distinct_from_technical_failure: true
uncertainty_semantics:
  low_confidence_relation_judgement: insufficient_evidence
  no_extra_uncertain_relation_type: true
multiple_relation_policy:
  secondary_relations_allowed: false
  output_one_primary_relation: true
primary_relation_policy:
  priority_order:
    - same_item
    - equivalent
    - contradicts
    - contains_or_contained_by
    - complementary
    - related_distinct
    - no_relation
  insufficient_evidence_policy: If evidence is insufficient for reliable judgement, return insufficient_evidence instead of applying priority order.
  special_rules:
    - Explicit substantive conflict takes priority over contains and complementary.
    - Contains or contained_by requires full coverage of core content.
    - Partial overlap with independent valid information and no conflict is complementary.
    - Same broad domain alone is insufficient for related_distinct.
evidence_requirements:
  non_technical_failure_requires_structured_evidence: true
  content_relations_require_left_evidence: true
  content_relations_require_right_evidence: true
  no_relation_requires_compared_dimensions: true
  insufficient_evidence_requires_missing_evidence: true
  output_evidence_must_reference_input: true
  rationale_must_not_add_unseen_facts: true
rationale_requirements:
